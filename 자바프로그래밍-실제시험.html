<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="theme.js?v=202610062029"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>자바프로그래밍 · 중간고사 실제시험</title>
    <link rel="stylesheet" href="style.css?v=202610062029">
    <style>
        pre.io { background:#0f1b14; }
        pre.io::before { content:"▶ 실행 화면"; color:#7fd49a; }
        pre.io code { color:#dff5e6; }
        .ex-lock { max-width:440px; margin:26px auto; text-align:center; }
        .ex-lock form { display:flex; gap:8px; justify-content:center; margin:14px 0 6px; }
        .ex-lock input { flex:1 1 auto; min-width:0; max-width:240px; font-size:18px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); text-align:center; }
        /* 비밀번호 칸을 type=password 로 두면 브라우저가 "비밀번호 저장" → 다음에 자동으로 채워 넣어서, 그 뒤에 친 숫자가 이어 붙음 → 틀림. 그래서 text 칸 + 점 가리기 */
        #ex-pin, #ex-play-pin { -webkit-text-security:disc; text-security:disc; }
        .ex-bar .ex-to-admin { font-size:13px; font-weight:800; color:var(--main); text-decoration:none; }
        #ex-pin.show { -webkit-text-security:none; text-security:none; }
        .ex-lock .ex-eye { padding:10px 12px; background:var(--card); color:var(--ink); border:1px solid var(--line); font-size:16px; }
        .ex-lock .ex-eye.on { background:var(--main); color:#fff; border-color:var(--main); }
        .ex-btn, .ex-lock button { font-size:15px; font-weight:800; padding:10px 18px; border:0; border-radius:12px; background:var(--main); color:#fff; cursor:pointer; }
        .ex-btn:disabled, .ex-lock button:disabled { opacity:.55; cursor:default; }
        .ex-msg { min-height:22px; font-weight:800; margin:6px 0 0; }
        .ex-msg.no { color:#d9534f; }
        .ex-msg.info { color:var(--ink-2); font-weight:600; }
        .ex-bar { position:sticky; top:62px; z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin:0 0 14px; padding:10px 14px; padding-right:62px; border:1px solid var(--line); border-radius:14px; background:var(--card); box-shadow:0 6px 18px rgba(0,0,0,.08); font-weight:800; font-size:14px; }
        .ex-bar .ex-score { color:var(--main); }
        .ex-bar .ex-time { font-variant-numeric:tabular-nums; color:var(--ink-2); }
        .ex-bar .ex-sync { font-weight:600; font-size:12px; color:var(--ink-2); }
        .ex-bar .ex-btn { margin-left:auto; padding:7px 14px; font-size:13px; }
        .ex-kind { display:inline-block; font-size:12px; font-weight:900; padding:1px 9px; border-radius:999px; margin-right:6px; vertical-align:1px; color:#fff; }
        .ex-kind.out { background:#2d6a4f; }
        .ex-kind.type { background:#1f5aa6; }
        .ex-kind.blank { background:#8a5a00; }
        .ex-kind.err { background:#a12d2d; }
        .ex-kind.kmcq { background:#6b4fa0; }   /* 'mcq' 는 quiz.js 의 객관식 카드 이름이라 겹치지 않게 k 붙임 */
        .ex-kind.kshort { background:#8a5a00; }
        /* 객관식 (시험 모드: 고른 답만 표시 · 맞았는지는 시험이 끝난 뒤 풀이에서) */
        .exmcq { border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0; background:var(--card); }
        .exmcq .quiz-q { font-weight:700; }
        .exmcq .quiz-cat { display:inline-block; min-width:26px; height:24px; line-height:24px; text-align:center; background:var(--main); color:#fff; border-radius:6px; font-size:13px; margin-right:8px; padding:0 4px; }
        .exmcq-opts { display:grid; gap:8px; margin:10px 0 4px; }
        .exmcq-opt { display:block; width:100%; text-align:left; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font-size:15px; line-height:1.55; cursor:pointer; }
        .exmcq-opt:hover { border-color:var(--main); }
        .exmcq-opt.sel { border:2px solid var(--main); background:rgba(45,106,79,.10); font-weight:700; }
        .exmcq-opt.sel::after { content:"  ✓ 고름"; font-size:12px; font-weight:800; color:var(--main); }
        .ex-rv-opts { display:grid; gap:6px; margin:8px 0; }
        .ex-rv-opt { padding:8px 12px; border:1px solid var(--line); border-radius:10px; }
        .ex-rv-opt.ok { border:2px solid #2e9d5b; }
        .ex-rv-opt.ok::after { content:"  ✅ 정답"; font-size:12px; font-weight:800; color:#2e9d5b; }
        .ex-rv-opt.mine:not(.ok) { border:2px solid #d9534f; }
        .ex-desc { margin:4px 0 8px; line-height:1.7; }
        .ex-file { font-size:12px; font-weight:800; color:var(--ink-2); margin-left:6px; }
        .quiz-item.ex-q .quiz-cat { display:inline-block; min-width:26px; height:24px; line-height:24px; text-align:center; background:var(--main); color:#fff; border-radius:6px; font-size:13px; margin-right:8px; padding:0 4px; }
        .quiz-item.ex-q pre { margin:6px 0 10px; }
        .ex-live .quiz-btn.show, .ex-live .oq-show, .ex-live .ct-show { display:none !important; }
        .ex-rules ul { margin:6px 0 0; padding-left:20px; line-height:1.8; }
        #ex-result .ex-final { font-size:22px; font-weight:900; color:var(--main); margin:12px 0 4px; }
        .ex-admin-head { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
        .ex-admin-head .ex-go-btns { margin-left:auto; display:flex; flex-wrap:wrap; gap:8px; }
        .ex-btn.ghost { background:var(--line); color:var(--ink); }
        .ex-bar .ex-time.low { color:#d9534f; }
        /* 시험 시간 정하기 (관리자 대기 화면) */
        .ex-timed { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin:12px 0 4px; padding:12px; border:1px dashed var(--line); border-radius:12px; }
        .ex-timed label { display:inline-flex; align-items:center; gap:5px; font-weight:800; font-size:14px; }
        .ex-timed input { width:66px; font-size:16px; padding:7px 8px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); text-align:center; }
        .ex-timed .ex-btn { padding:8px 14px; font-size:14px; }
        /* 시간 제한 시험 중 관리자 조작 막대 (화면 하단 고정) */
        .ex-tbar { position:fixed; left:0; right:0; bottom:0; z-index:9998; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--card); border-top:1px solid var(--line); box-shadow:0 -6px 18px rgba(0,0,0,.14); }
        .ex-tbar-in { max-width:980px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; }
        .ex-tbar-left { font-weight:900; font-size:15px; }
        .ex-tbar-left b { font-size:22px; font-variant-numeric:tabular-nums; margin-left:4px; color:var(--main); }
        .ex-tbar.low .ex-tbar-left b { color:#d9534f; }
        .ex-tbar-btns { display:flex; flex-wrap:wrap; gap:6px; }
        .ex-tbar-btns .ex-btn { padding:7px 12px; font-size:13.5px; }
        body.ex-has-tbar { padding-bottom:120px; }
        .ex-timed[hidden], .ex-tbar[hidden], .ex-btn[hidden] { display:none !important; }
        /* 🔢 문제 번호판 (시험 막대 안 · 누르면 펼침) */
        .ex-bar .ex-navbtn { padding:5px 10px; font-size:13px; font-weight:800; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); cursor:pointer; }
        .ex-nav { flex-basis:100%; display:flex; flex-wrap:wrap; gap:6px; padding-top:8px; border-top:1px solid var(--line); }
        .ex-nav[hidden] { display:none; }
        .ex-nav button { width:38px; height:34px; padding:0; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink-2); font-weight:800; font-size:13px; cursor:pointer; }
        .ex-nav button.wr { border-color:var(--main); color:var(--main); border-width:2px; }
        .ex-nav button.ok { background:#2e9d5b; border-color:#2e9d5b; color:#fff; }
        .ex-nav button.no { border:2px solid #d9534f; color:#d9534f; }
        .ex-nav-key i.no { border:2px solid #d9534f; }
        .ex-nav-key { flex-basis:100%; display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; font-size:12px; font-weight:600; color:var(--ink-2); }
        .ex-nav-key i { display:inline-block; width:11px; height:11px; border-radius:3px; border:1px solid var(--line); margin-right:4px; vertical-align:-1px; }
        .ex-nav-key i.ok { background:#2e9d5b; border-color:#2e9d5b; }
        .ex-nav-key i.wr { border:2px solid var(--main); }
        .ex-q { scroll-margin-top:150px; }
        /* 남은 시간 알림 · 시간 바뀜 알림 (화면 위쪽에 잠깐) */
        .ex-toast { position:fixed; left:50%; top:14px; z-index:10000; max-width:calc(100% - 32px); padding:12px 20px; border-radius:14px; background:#d9534f; color:#fff; font-weight:900; font-size:16px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.25); transform:translate(-50%,-160%); transition:transform .3s; pointer-events:none; }
        .ex-toast.on { transform:translate(-50%,0); }
        .ex-toast.info { background:#1f5aa6; }
        /* 📝 혼자 풀기 */
        .ex-bar .ex-solo { font-size:12.5px; padding:2px 9px; border-radius:999px; background:#8a5a00; color:#fff; }
        .ex-solo-note { margin:0 0 14px; padding:12px 14px; border:1px solid #8a5a00; border-radius:14px; background:rgba(138,90,0,.08); font-size:14px; line-height:1.7; }
        .ex-switch { margin:0 0 12px; padding:10px 12px; border-radius:12px; background:rgba(31,90,166,.1); font-size:14px; font-weight:700; }
        .ex-plan { margin:8px 0 4px; font-weight:800; }
        /* 맨 위 바로가기 버튼 3개 (중간고사 정리 · 사이트 홈 · 과목 페이지) — 다크 모드는 theme.js 의 .back-link 모양을 따름 */
        .ex-links { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
        .ex-link { display:inline-flex; align-items:center; padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--main); font-weight:800; font-size:14px; text-decoration:none; }
        .ex-link:hover { border-color:var(--main); }
        /* 관리자 입장 표: 혼자 푸는 사람 · 📣 부르기 */
        .ex-pill.solo { background:#8a5a00; color:#fff; }
        .ex-call { margin-left:6px; padding:3px 10px; font-size:12px; font-weight:800; border:0; border-radius:999px; background:var(--main); color:#fff; cursor:pointer; }
        .ex-call:disabled { opacity:.55; cursor:default; }
        .ex-solo-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin:0 0 8px; font-weight:800; }
        /* 👁 스터디원 화면 보기 (관리자) · 스터디원 화면 안내 */
        .ex-watch { margin:0 0 12px; padding:8px 12px; border-radius:12px; background:rgba(31,90,166,.1); font-size:13px; font-weight:700; }
        .ex-lv { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.55); }
        .ex-lv[hidden] { display:none; }
        .ex-lv-box { display:flex; flex-direction:column; width:100%; max-width:820px; height:min(90vh, 900px); background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.35); overflow:hidden; }
        .ex-lv-head { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:14px 16px 8px; border-bottom:1px solid var(--line); }
        .ex-lv-head b { font-size:17px; }
        .ex-lv-head .ex-lv-meta { font-size:13px; font-weight:700; color:var(--ink-2); }
        .ex-lv-head label { margin-left:auto; display:inline-flex; gap:4px; align-items:center; font-size:13px; font-weight:700; }
        .ex-lv-head .ex-btn { padding:6px 12px; font-size:13px; }
        .ex-lv-status { padding:8px 16px; font-weight:800; font-size:14px; }
        .ex-lv-status.away { color:#fff; background:#d9534f; }
        .ex-lv-nav { flex:none; padding:8px 16px; border-top:0; border-bottom:1px solid var(--line); }   /* 세로 칸 안에서 늘어나지 않게 */
        .ex-lv-head, .ex-lv-status { flex:none; }
        .ex-lv-nav button.cur { outline:3px solid #f0ad4e; outline-offset:1px; }
        .ex-lv-body { flex:1; overflow:auto; padding:12px 16px 24px; }
        .ex-lv-q { border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin:0 0 12px; scroll-margin-top:8px; }
        .ex-lv-q.cur { border:3px solid #f0ad4e; box-shadow:0 0 0 4px rgba(240,173,78,.2); }
        .ex-lv-qh { margin:0 0 6px; font-weight:800; }
        .ex-lv-qh small { color:var(--ink-2); margin:0 4px; }
        .ex-lv-st { float:right; font-size:12px; font-weight:800; }
        .ex-lv-q pre { max-height:240px; overflow:auto; font-size:12.5px; margin:6px 0; }
        .ex-lv-ans .lbl { font-size:12px; font-weight:800; color:var(--ink-2); }
        /* 쓴 답은 코드 블록(pre)이 아니라 글상자로 — pre 로 하면 사이트 코드 꾸미기가 '코드' 머리표를 붙이고 밝은 글자색이 연한 바탕에 묻힘 */
        .ex-lv-ans .ex-lv-text { margin:4px 0 0; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:rgba(31,90,166,.08); color:var(--ink); font-family:Consolas, "D2Coding", Menlo, monospace; font-size:13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-all; max-height:240px; overflow:auto; }
        .ex-lv-ans .none { font-size:13px; color:var(--ink-2); }
        /* 시험 방식 버튼 (혼자 풀기: 눌러서 고름 · 시험 대기실: 잠겨 있고 관리자가 고른 쪽에 실시간으로 색) */
        .ex-mode { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:12px 0 6px; }
        .ex-mode .ex-btn { transition:background-color .35s, color .35s, opacity .35s, box-shadow .35s; }
        .ex-mode.locked .ex-btn { background:var(--line); color:var(--ink-2); opacity:.6; cursor:not-allowed; }
        .ex-mode.locked .ex-btn.on { background:var(--main); color:#fff; opacity:1; box-shadow:0 0 0 3px rgba(31,90,166,.28); }
        .ex-wait-mode-note { margin:2px 0 8px; }
        #ex-solo-tbox { justify-content:center; }
        /* 결과 창: 문제별 정답률 · 복사 */
        .ex-modal-box { max-width:460px; }
        .ex-stats { margin-top:12px; }
        .ex-stats summary { cursor:pointer; font-weight:900; margin-bottom:6px; }
        .ex-modal-box .ex-stat td:nth-child(2) { text-align:left; font-size:13px; }
        .ex-stat tr.low td { color:#d9534f; font-weight:800; }
        .ex-stat small { font-weight:700; color:var(--ink-2); margin-right:4px; }
        .ex-copy { margin-top:10px; width:100%; }
        /* 스터디원 명단 (관리자가 입력 · 여기 있는 이름만 입장) */
        .ex-roster { margin:14px 0 6px; padding:12px; border:1px solid var(--line); border-radius:12px; }
        .ex-roster-head { margin:0 0 8px; font-weight:900; }
        .ex-roster-head small { font-weight:600; color:var(--ink-2); }
        .ex-roster-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
        .ex-chip { display:inline-flex; align-items:center; gap:2px; padding:4px 4px 4px 12px; border-radius:999px; background:var(--line); color:var(--ink); font-weight:800; font-size:14px; }
        .ex-chip.admin { background:#1f5aa6; color:#fff; padding-right:12px; }
        .ex-chip button { border:0; background:transparent; color:inherit; font-size:13px; cursor:pointer; padding:2px 8px; border-radius:999px; }
        .ex-chip button:hover { background:rgba(0,0,0,.12); }
        .ex-roster form { display:flex; gap:8px; flex-wrap:wrap; margin:0; }
        .ex-roster input { flex:1 1 200px; max-width:320px; font-size:15px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
        .ex-roster .ex-btn { padding:8px 14px; font-size:14px; }
        body.ex-has-tbar #mo-top { bottom:calc(110px + env(safe-area-inset-bottom,0px)); }
        .ex-note { font-size:13px; color:var(--ink-2); margin:6px 0 0; }
        .ex-board { width:100%; border-collapse:collapse; margin:12px 0 0; font-size:14px; }
        .ex-board th, .ex-board td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; }
        .ex-board th { font-size:12.5px; color:var(--ink-2); }
        .ex-board td.num { font-variant-numeric:tabular-nums; font-weight:800; }
        .ex-meter { display:inline-block; width:90px; height:8px; border-radius:99px; background:var(--line); vertical-align:middle; margin-left:8px; overflow:hidden; }
        .ex-meter i { display:block; height:100%; background:var(--main); }
        .ex-pill { display:inline-block; font-size:12px; font-weight:800; padding:1px 8px; border-radius:999px; background:var(--line); color:var(--ink-2); }
        .ex-pill.done { background:#2d6a4f; color:#fff; }
        .ex-rank { font-size:16px; font-weight:900; }
        .ex-danger { background:#d9534f !important; }
        .ex-pill.auto { background:#8a5a00; color:#fff; }
        .ex-pill.wait { background:#1f5aa6; color:#fff; }
        .ex-phase { font-size:13px; }
        .ex-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--main); margin-right:8px; vertical-align:1px; animation:exPulse 1.4s ease-in-out infinite; }
        @keyframes exPulse { 0%,100% { opacity:.25; transform:scale(.8); } 50% { opacity:1; transform:scale(1.1); } }
        /* 대기실 명단: 나 → 나머지 가나다순 · 접속 중 = 파란 점 깜빡 · 아직 = 회색 점 */
        .ex-members { list-style:none; padding:0; margin:14px auto 4px; max-width:230px; text-align:left; }
        .ex-members li { display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid var(--line); font-weight:700; }
        .ex-members li:last-child { border-bottom:0; }
        .ex-members li.admin { margin-bottom:12px; padding-bottom:12px; border-bottom:2px solid var(--line); }   /* 관리자와 스터디원 사이를 조금 더 띄움 (2026-10-07) */
        .ex-members small { color:var(--ink-2); font-weight:600; }
        .ex-pres { width:11px; height:11px; border-radius:50%; flex:none; }
        .ex-pres.on { animation:exBlink 1.2s ease-in-out infinite; }
        @keyframes exBlink { 0%,100% { opacity:1; } 50% { opacity:.2; } }
        @media (prefers-reduced-motion: reduce) { .ex-dot, .ex-pres.on { animation:none; } }
        .ex-conn { font-size:12.5px; font-weight:700; color:var(--ink-2); margin:10px 0 0; }
        .ex-conn.bad { color:#d9534f; }
        .ex-bar .ex-conn { margin:0; }
        .ex-ver { margin:10px 0 0; padding:8px 12px; border-radius:10px; background:rgba(217,83,79,.1); font-weight:700; font-size:13.5px; }
        .ex-board .bad { color:#d9534f; font-weight:700; }
        /* 🏁 시험 종료 → 결과 창 (순위 · 이름 · 점수) */
        .ex-modal { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.5); }
        .ex-modal[hidden] { display:none; }
        .ex-modal-box { display:flex; flex-direction:column; width:100%; max-width:400px; max-height:85vh; overflow:hidden; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:18px; padding:20px 18px 16px; box-shadow:0 18px 50px rgba(0,0,0,.3); }
        .ex-modal-box h2 { margin:0 0 4px; text-align:center; }
        #ex-modal-body { overflow:auto; min-height:0; }   /* 사람이 많아도 닫기 버튼은 항상 보이게 */
        .ex-modal-box .ex-board td, .ex-modal-box .ex-board th { text-align:center; }
        .ex-modal-box .ex-board td:nth-child(2) { text-align:left; }

let wakeLock = null, wantWake = false;
async function keepAwake(on) {
    wantWake = on;
    try {
        if (on && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
            wakeLock = await navigator.wakeLock.request("screen");
            wakeLock.addEventListener("release", () => { wakeLock = null; });
        } else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
    } catch (e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (wantWake && !document.hidden) keepAwake(true); });

// ---- 비밀번호로 문제 풀기 (PBKDF2 → AES-GCM) ----
async function decrypt(box, pass) {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(box.s), iterations: D.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.i) }, key, b64(box.c));
    return JSON.parse(new TextDecoder().decode(pt));
}

async function enterAs(P, name, note) {
    const msg = $("ex-name-msg"), btn = $("ex-name-form").querySelector("button");
    if (!name) return;
    if (P.adminName && name === P.adminName) {
        msg.className = "ex-msg no";
        msg.innerHTML = "⚠️ <b>" + esc(name) + "</b> 님은 비밀번호 칸에 <b>관리자 코드</b>를 치고 들어오세요 — 점수판과 문제가 한 화면에 같이 나와요.";
        $("ex-name-in").value = ""; $("ex-name-in").focus();
        return;
    }
    btn.disabled = true; msg.className = "ex-msg info"; msg.textContent = "명단 확인 중…";
    let roster = P.names, d = {};
    if (ONLINE) {
        try {
            await ensureUser();
            let x; try { x = await getDocFromServer(examRef()); } catch (e) { x = await getDoc(examRef()); }
            d = x.exists() ? x.data() : {};
            roster = Array.isArray(d.roster) ? d.roster : defaultRoster(P);   // 관리자가 명단을 안 바꿨으면 기본 명단
        } catch (err) { btn.disabled = false; msg.className = "ex-msg no"; msg.textContent = "서버에 연결하지 못했어요 — 잠시 뒤 다시 눌러 주세요. (" + (err.code || err.message) + ")"; return; }
    }
    if (!roster.length) {
        btn.disabled = false; msg.className = "ex-msg no";
        msg.textContent = "⚠️ 스터디 명단이 비어 있어요 — 관리자에게 이름을 추가해 달라고 말해 주세요.";
        return;
    }
    if (roster.indexOf(name) < 0) {
        btn.disabled = false; msg.className = "ex-msg no";
        msg.textContent = "⚠️ 스터디 명단에 없는 이름이에요. 이름을 정확히 다시 입력하거나, 관리자에게 명단에 추가해 달라고 말해 주세요.";
        try { sessionStorage.removeItem(RESUME); } catch (e) { }   // 명단에서 빠진 이름으로 자동 입장하지 않게
        if (note === undefined) alert("스터디 명단에 없는 이름이에요.\n이름을 정확히 다시 입력하거나 관리자에게 명단 추가를 부탁하세요.");   // 직접 입력했을 때만 (자동 입장이면 조용히)
        $("ex-name-in").value = ""; $("ex-name-in").focus();
        return;
    }
    ROSTER = roster;
    if (LAST_PIN) resumeSet(name);                 // 새로고침해도 바로 다시 들어오게
    msg.textContent = "서버에 연결하는 중…";
    try {
        if (!ONLINE) { await startExam(P, name, 1); return; }
        // 서버 시계 차이를 먼저 재고(관리자 접속 판단이 기기 시계에 안 흔들리게) 시험 문서를 다시 봄
        const t0 = Date.now();
        await setDoc(lobbyRef(name), { name, at: serverTimestamp(), st: "check", ver: BUILD });
        const t1 = Date.now();
        try { const x = await getDocFromServer(lobbyRef(name)); const t = x.exists() && x.data().at; if (t && t.toMillis) SKEW = t.toMillis() - (t0 + t1) / 2; } catch (e) { }
        try { const x = await getDocFromServer(examRef()); d = x.exists() ? x.data() : {}; } catch (e) { }
        // note: "solo" = 혼자 풀던 중 새로고침 · "left" = 대기실에서 관리자가 나감 · 그 밖의 글자 = 대기실 안내
        if (note === "solo") {                     // 혼자 풀던 중 새로고침 → 관리자가 접속해 있어도 부르기 전까지는 그대로 혼자 풀기
            let base = 0; try { base = Number(localStorage.getItem(soloBaseKey(name))) || 0; } catch (e) { }
            if (!(calledAt(d, name) > base)) { await startSolo(P, name); return; }
        }
        if (adminHere(d)) await enterLobby(P, name, note === "solo" || note === "left" ? "" : note);
        else offerSolo(P, name, note === "left");
    } catch (err) { btn.disabled = false; msg.className = "ex-msg no"; msg.textContent = "서버에 연결하지 못했어요 — 잠시 뒤 다시 눌러 주세요. (" + (err.code || err.message) + ")"; }
}

// ---- 관리자가 없을 때: "관리자가 접속하지 않았어요 · 혼자서 문제풀기 도전?" (2026-10-07 사용자가 정한 문구) ----

const adminHere = (d) => adminOnline(d) || (d.phase || "ready") === "live";
function watchAdmin(onCome) {                       // 관리자 접속 · 시험 시작을 실시간 + 5초마다 확인
    let done = false;
    const look = (s) => { if (done) return; const d = s.exists() ? s.data() : {}; if (adminHere(d)) { done = true; onCome(); } };
    const off = onSnapshot(examRef(), look, () => { });
    const iv = setInterval(() => getDocFromServer(examRef()).then(look, () => { }), 5000);
    return () => { done = true; off(); clearInterval(iv); };
}
function soloBeat(name, st) {                       // 관리자 화면 입장 표에 '혼자 풀기 · 도전 화면'으로 보이게 (30초마다 · 창을 닫으면 나감)
    const b = () => setDoc(lobbyRef(name), { name, at: serverTimestamp(), st: st || "solo", ver: BUILD }).catch(() => { });
    b();
    if (!soloBeat.bound) { soloBeat.bound = true; window.addEventListener("pagehide", () => { setDoc(lobbyRef(name), { name, at: null, st: "left", ver: BUILD }).catch(() => { }); }); }   // 도전 화면 · 혼자 풀기 창을 닫으면 '나감'
    return setInterval(b, 30000);
}
const tsMs = (t) => (t && t.toMillis ? t.toMillis() : 0);
// 관리자가 나를 대기실로 불렀는지 (📣 부르기 · 모두 부르기 · 시험 시작) — 혼자 풀기 시작한 뒤에 부른 것만
const calledAt = (d, name) => Math.max(tsMs(d.callAll), tsMs(d.calls && d.calls[name]));
const soloBaseKey = (name) => "ex-bk:" + EXAM + ":0:" + name + ":c";
function offerSolo(P, name, left) {
    $("ex-name").hidden = true;
    const w = $("ex-wait"); w.hidden = false;
    w.innerHTML = "<h2>" + (left ? "관리자가 나갔어요" : "관리자가 접속하지 않았어요") + '</h2><p class="ex-final" style="font-size:20px">혼자서 문제풀기 도전?</p>'
        + modeRow(false)
        + '<p class="ex-note">점수는 서버에 저장되지 않고 이 기기에만 남아요 · 제출하면 바로 정답과 풀이를 볼 수 있어요<br>관리자가 접속하면 시험 대기실로 바뀌어요.</p>';
    const beat = soloBeat(name, "offer");
    const stop = watchAdmin(() => {
        clearInterval(beat);
        w.innerHTML = '<h2>🛡️ 관리자가 접속하였어요!</h2><p class="ex-note"><span class="ex-dot"></span>잠시 뒤 시험 대기실로 바뀌어요…</p>';
        setTimeout(() => switchMode(name, ""), 3000);
    });
    const go = (limitSec) => { stop(); clearInterval(beat); startSolo(P, name, limitSec); };
    $("ex-solo-free").addEventListener("click", () => go(0));
    const SOLO_LIMIT = "ex-solo-limit";             // 지난번에 고른 시간 기억
    $("ex-solo-timed").addEventListener("click", () => {
        const box = $("ex-solo-tbox"); box.hidden = !box.hidden;
        if (box.hidden) return;
        let v = [0, 30, 0];
        try { const x = JSON.parse(localStorage.getItem(SOLO_LIMIT) || "null"); if (Array.isArray(x) && x.length === 3) v = x; } catch (e) { }
        $("ex-sh").value = v[0]; $("ex-sm").value = v[1]; $("ex-ss").value = v[2]; $("ex-sm").focus();
    });
    $("ex-solo-cancel").addEventListener("click", () => { $("ex-solo-tbox").hidden = true; });
    $("ex-solo-limit").addEventListener("click", () => {
        const num = (id, max) => { const n = Math.floor(Number($(id).value || 0)); return isNaN(n) || n < 0 ? -1 : Math.min(n, max); };
        const h = num("ex-sh", 23), m = num("ex-sm", 59), x = num("ex-ss", 59);
        if (h < 0 || m < 0 || x < 0) { alert("시간 · 분 · 초는 0 이상의 숫자로 입력해 주세요."); return; }
        const total = h * 3600 + m * 60 + x;
        if (total < 10) { alert("시험 시간은 10초 이상으로 정해 주세요."); return; }
        try { localStorage.setItem(SOLO_LIMIT, JSON.stringify([h, m, x])); } catch (e) { }
        go(total);
    });
}

// ---- 혼자 풀기: 바로 문제 · 관리자가 접속하거나 시험이 시작되면 "관리자가 접속하였어요!" 3초 → 시험 대기실 ----
async function startSolo(P, name, limitSec) {
    SOLO = true;
    const EK = "ex-bk:" + EXAM + ":0:" + name + ":e";   // 혼자 풀기 끝나는 시각 (이 기기 · 새로고침해도 이어서)
    try {
        if (limitSec === undefined) EXAM_ENDS = Number(localStorage.getItem(EK) || 0) || 0;
        else if (limitSec > 0) { EXAM_ENDS = Math.round(nowS() + limitSec * 1000); localStorage.setItem(EK, String(EXAM_ENDS)); }
        else { EXAM_ENDS = 0; localStorage.removeItem(EK); }
    } catch (e) { EXAM_ENDS = limitSec > 0 ? Math.round(nowS() + limitSec * 1000) : 0; }
    if (LAST_PIN) resumeSet(name, "solo");         // 새로고침해도 도전 화면 없이 바로 이어서
    // 부르기 기준 시각 = 혼자 풀기를 시작한 서버 시각 (새로고침으로 이어서 풀면 처음 시각 그대로)
    let base = 0;
    try { base = limitSec === undefined ? Number(localStorage.getItem(soloBaseKey(name))) || 0 : 0; if (!base) { base = Math.round(nowS()); localStorage.setItem(soloBaseKey(name), String(base)); } } catch (e) { base = Math.round(nowS()); }
    const exam = await startExam(P, name, 0);
    soloBeat(name, "solo");
    // 관리자가 들어와도 푸는 중에는 그대로 (사용자: '혼자 풀고 있는데 관리자가 들어오면 짜증') — 관리자가 📣 부르기 · 시험 시작을 눌러야 대기실로
    let told = false, called = false, banner = false, rang = false;
    const toLobbyBtn = (text, btnText) => {        // 제출하고 풀이를 보는 중이면 강제로 옮기지 않고 버튼으로
        if (!banner) {
            banner = true;
            $("ex-wait").insertAdjacentHTML("afterbegin", '<p class="ex-switch" id="ex-switch-msg"><span></span> <button class="ex-btn" type="button" id="ex-to-lobby" style="padding:6px 12px;font-size:13px"></button></p>');
            $("ex-to-lobby").addEventListener("click", () => switchMode(name, ""));
        }
        $("ex-switch-msg").firstChild.textContent = text; $("ex-to-lobby").textContent = btnText;
    };
    const look = (s) => {
        const d = s.exists() ? s.data() : {};
        const live = (d.phase || "ready") === "live";
        if (!called && calledAt(d, name) > base) {
            called = true;
            if (!exam.submitted()) {
                toast("📣 관리자가 시험 대기실로 불렀어요 — 잠시 뒤 이동해요 (푼 답은 이 기기에 남아요)", true);
                setTimeout(() => switchMode(name, ""), 3000);
                return;
            }
            toast("📣 관리자가 시험 대기실로 불렀어요", true);
            toLobbyBtn(live ? "🔔 시험이 시작됐어요!" : "📣 관리자가 시험 대기실로 불렀어요.", live ? "바로 들어가기" : "시험 대기실로 가기");
            return;
        }
        if (exam.submitted()) {                    // 풀이를 보는 중
            if (live && !rang) { rang = true; toast("🔔 관리자가 시험을 시작했어요!", true); toLobbyBtn("🔔 시험이 시작됐어요!", "바로 들어가기"); }
            else if (adminOnline(d) && !banner) toLobbyBtn("🛡️ 관리자가 접속하였어요! 풀이를 다 봤으면", "시험 대기실로 가기");
            return;
        }
        if (!told && adminOnline(d)) { told = true; toast("🛡️ 관리자가 접속했어요 — 계속 풀어도 돼요 (관리자가 부르면 시험 대기실로 가요)", true); }
    };
    onSnapshot(examRef(), look, () => { });
    setInterval(() => getDocFromServer(examRef()).then(look, () => { }), 5000);
}

// ---- 시험 ----
function loadScript(src) {
    return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = ASSET + src + "?v=" + VER; s.onload = ok; s.onerror = bad; document.body.appendChild(s); });
}
async function startExam(P, name, round) {
    // 서버에서 내 기록을 가져온다 — 다른 기기에서 풀던 것도 이어서
    // (round 는 화면에 안 보이는 시험 번호 — 관리자가 새로 시작하면 +1 → 열려 있던 기기가 새 시험에 옛 답을 쓰지 못하게 막는 용도)
    let att = null, ref = null;
    const SOLO_KEY = "ex-bk:" + EXAM + ":0:" + name;   // 혼자 풀기 답 · 맞힘 · 시작 시각 (이 기기에만)
    if (ONLINE && !SOLO) {
        ref = attRef(round, name);
        const snap = await getDoc(ref);
        if (snap.exists()) att = snap.data();
        else {
            att = { name, round, total: P.total, score: 0, solved: {}, answers: {}, submitted: false, startedAt: new Date().toISOString(), updatedAt: serverTimestamp() };
            await setDoc(ref, att);
        }
    } else {
        let t0 = new Date().toISOString(), sv = {}, wv = {};
        if (SOLO) { try { t0 = localStorage.getItem(SOLO_KEY + ":t") || t0; sv = JSON.parse(localStorage.getItem(SOLO_KEY + ":s") || "{}") || {}; wv = JSON.parse(localStorage.getItem(SOLO_KEY + ":w") || "{}") || {}; localStorage.setItem(SOLO_KEY + ":t", t0); } catch (e) { } }
        att = { name, round, total: P.total, score: 0, solved: sv, wrong: wv, answers: {}, submitted: false, startedAt: t0 };
    }
    clearLocalAnswers();                       // 이 기기에 남은 다른 사람의 답은 지우고, 서버 기록으로 채운다

    $("ex-name").hidden = true; $("ex-wait").hidden = true;
    const root = $("ex-exam");
    root.innerHTML = '<div class="ex-bar" id="ex-bar"><span>👤 ' + esc(name) + '</span>' + (SOLO ? '<span class="ex-solo">📝 혼자 풀기</span>' : "") + '<span class="ex-score" id="ex-score">✅ 0 / ' + P.total + '</span><span class="ex-time" id="ex-time">⏱ 00:00</span><span class="ex-sync" id="ex-sync"></span>' + (SOLO ? "" : '<span class="ex-conn short"></span>')
        + '<button class="ex-navbtn" type="button" id="ex-navbtn" aria-expanded="false">🔢 번호</button>'
        + (ADMIN_MODE ? '<a class="ex-to-admin" href="#ex-admin">🛡️ 점수판</a>' : "") + '<button class="ex-btn" type="button" id="ex-bar-submit">제출</button><div class="ex-nav" id="ex-nav" hidden></div></div>'
        + (SOLO ? '<div class="ex-solo-note">📝 <b>혼자 풀기</b> — 지금은 관리자가 접속해 있지 않아서 바로 풀 수 있어요. 점수는 서버에 저장되지 않고 <b>이 기기에만</b> 남아요 (새로고침해도 이어서). <b>제출하면 바로 정답과 풀이</b>를 볼 수 있어요. 관리자가 접속하면 시험 대기실로 바뀌어요.</div>' : "")
        + P.html;
    root.hidden = false;
    if (!att.submitted) document.body.classList.add("ex-live");
    if (!ONLINE) $("ex-sync").textContent = "○ 서버 연결 전 — 점수가 저장되지 않아요";
    else if (SOLO) $("ex-sync").textContent = "○ 이 기기에만 저장";
    setConn(false);
    // 쓴 답 임시 보관 (이 기기 · 이번 시험 동안만) — 인터넷이 끊긴 채 새로고침해도 서버에 없는 답은 되살림 · 시험이 끝나면 지움
    const BK = "ex-bk:" + EXAM + ":" + round + ":" + name;
    let bk = {};
    try {
        Object.keys(localStorage).forEach((k) => { if (k.indexOf("ex-bk:" + EXAM + ":") === 0 && k.indexOf(BK) !== 0 && k.split(":")[2] !== "0") localStorage.removeItem(k); });   // 이 시험의 지난 회차 것만 지움 (다른 과목 시험 · 혼자 풀기 답은 남김 — 한 기기를 여럿이 써도)
        bk = JSON.parse(localStorage.getItem(BK) || "{}") || {};
    } catch (e) { bk = {}; }
    const backup = (id, v) => { bk[id] = v; try { localStorage.setItem(BK, JSON.stringify(bk)); } catch (e) { } };
    const dropBackup = () => { try { localStorage.removeItem(BK); if (SOLO) { localStorage.removeItem(BK + ":s"); localStorage.removeItem(BK + ":t"); localStorage.removeItem(BK + ":e"); localStorage.removeItem(BK + ":c"); localStorage.removeItem(BK + ":w"); } } catch (e) { } };

    const started = new Date(att.startedAt).getTime();
    // 경과 시간: 시험 시작(서버 시각)부터 서버 시계로 → 모두 같은 숫자 · 제출했으면 제출할 때 잰 값 그대로
    const elapsed = () => {
        if (att.submitted && typeof att.elapsed === "number") return att.elapsed;
        if (EXAM_START) return Math.max(0, (nowS() - EXAM_START) / 1000);
        return ((att.submitted && att.submittedAt ? new Date(att.submittedAt).getTime() : Date.now()) - started) / 1000;   // 시작 시각을 아직 못 받았을 때만
    };
    const qs = () => [...root.querySelectorAll(".ex-q")];
    const isSolved = (q) => q.dataset.solved === "1" || q.dataset.passed === "1";
    const score = () => qs().filter(isSolved).length;
    const answerOf = (q) => {                  // 코드 작성 칸에 미리 써 둔 뼈대 그대로면 안 쓴 것으로 · 객관식은 고른 보기
        if (q.dataset.kind === "mcq") return q.dataset.ans || "";
        const el = q.querySelector(".oq-ans, .ct-code, .quiz-item input");
        return !el || (el.defaultValue.trim() && el.value.trim() === el.defaultValue.trim()) ? "" : el.value;
    };

    // ---- 서버에 저장 (답 · 맞힘 여부 · 점수) ----
    let pending = {}, timer = null;
    function queue(patch) {                    // 여러 문제의 답을 한 번에 보낼 때 answers 는 문제별로 합친다
        Object.keys(patch).forEach((k) => {
            if (k === "answers") pending.answers = Object.assign(pending.answers || {}, patch.answers);
            else pending[k] = patch[k];
        });
    }
    function save(patch) {
        if (!ONLINE || SOLO || att.submitted) return;
        queue(patch);
        clearTimeout(timer);
        timer = setTimeout(flush, 800);
    }
    async function flush() {
        const p = pending; pending = {};
        if (!Object.keys(p).length) return;
        p.updatedAt = serverTimestamp();
        try { await setDoc(ref, p, { merge: true }); $("ex-sync").textContent = "● 저장됨"; setConn(true); }
        catch (err) {
            $("ex-sync").textContent = "🔴 저장 안 됨 — 자동으로 다시 보내는 중 (" + (err.code || "") + ")";
            if (err.code === "permission-denied") return;   // 제출됐거나 초기화됨
            const later = pending; pending = {}; delete p.updatedAt; queue(p); queue(later);
            clearTimeout(timer); timer = setTimeout(flush, 3000);
        }
    }
    const kick = () => { if (Object.keys(pending).length && !att.submitted) { clearTimeout(timer); flush(); } };   // 인터넷이 돌아오거나 화면으로 돌아오면 바로 다시 보냄
    window.addEventListener("online", kick);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });
    let last = -1, lastW = "";
    // 틀림 = 확인했는데 틀린 문제 (문제마다 true/false 로 다 적음 — 서버가 지도(map)를 합쳐 저장해서 지운 키가 남지 않게)
    const wrongNow = () => { const w = {}; qs().forEach((q) => { w[q.id] = !isSolved(q) && q.dataset.wrong === "1"; }); return w; };
    function refresh() {
        if (att.submitted || !$("ex-score")) return;
        const s = score();
        const mq = qs().filter((q) => q.dataset.kind === "mcq");
        if (mq.length) {                       // 객관식은 맞았는지 숨김 (고르는 순간 알려 주면 하나씩 눌러 답을 알아낼 수 있어서) → 객관식 빼고 맞힌 수 + 객관식 답한 수
            const ok = qs().filter((q) => q.dataset.kind !== "mcq" && isSolved(q)).length;
            $("ex-score").textContent = "✅ " + ok + " / " + (P.total - mq.length) + " · ☑️ 객관식 " + mq.filter((q) => q.dataset.ans).length + " / " + mq.length;
        } else $("ex-score").textContent = "✅ " + s + " / " + P.total;
        const wrong = wrongNow(), ws = JSON.stringify(wrong);
        if (s !== last || ws !== lastW) {
            last = s; lastW = ws;
            const solved = {}; qs().forEach((q) => { solved[q.id] = isSolved(q); });
            save({ score: s, solved, wrong, elapsed: Math.round(elapsed()) });
            if (SOLO) try { localStorage.setItem(BK + ":s", JSON.stringify(solved)); localStorage.setItem(BK + ":w", ws); } catch (e) { }
        }
        navDraw();
    }
    // ---- 🔢 문제 번호판: 맞힘(초록) · 답 씀(테두리) · 안 씀 → 누르면 그 문제로 ----
    const numOf = (q) => ((q.querySelector(".oq-no, .ct-no, .quiz-cat") || {}).textContent || "").trim();
    function navDraw() {
        const box = $("ex-nav");
        if (!box || box.hidden) return;
        const LABEL = { ok: " · 맞힘", no: " · 틀림 (마지막 확인)", wr: " · 답 씀", "": " · 안 씀" };
        box.innerHTML = qs().map((q) => { const st = q.dataset.kind === "mcq" ? (answerOf(q) ? "wr" : "") : isSolved(q) ? "ok" : q.dataset.wrong === "1" ? "no" : answerOf(q).trim() ? "wr" : ""; return '<button type="button" class="' + st + '" data-go="' + q.id + '" title="' + numOf(q) + "번" + LABEL[st] + '">' + numOf(q) + "</button>"; }).join("")
            + '<span class="ex-nav-key"><span><i class="ok"></i>맞힘</span><span><i class="no"></i>틀림</span><span><i class="wr"></i>답 씀 (확인 전)</span><span><i></i>안 씀</span></span>';
    }
    function goQ(id) {
        const q = document.getElementById(id);
        if (!q) return;
        $("ex-nav").hidden = true; $("ex-navbtn").setAttribute("aria-expanded", "false");
        q.scrollIntoView({ behavior: "smooth", block: "start" });
        const f = q.querySelector(".oq-ans, .ct-code, .quiz-item input");
        if (f) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { } }, 450);
    }
    $("ex-navbtn").addEventListener("click", () => {
        const box = $("ex-nav"); box.hidden = !box.hidden;
        $("ex-navbtn").setAttribute("aria-expanded", box.hidden ? "false" : "true");
        navDraw();
    });
    $("ex-nav").addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) goQ(b.dataset.go); });
    let prevLeft = null;
    const tick = setInterval(() => {
        const t = $("ex-time");
        if (EXAM_ENDS && !att.submitted) {     // 시간 제한 시험: 남은 시간 (1분 안 남으면 빨간색)
            const left = (EXAM_ENDS - nowS()) / 1000;
            if (prevLeft !== null) {               // 5분 · 1분 남음 알림 (그 시점을 지날 때 한 번)
                if (prevLeft > 300 && left <= 300 && left > 60) toast("⏰ " + Math.ceil(left / 60) + "분 남았어요");
                else if (prevLeft > 60 && left <= 60 && left > 0) toast("⏰ 1분 남았어요 — 답을 확인하세요");
            }
            prevLeft = left;
            if (t) { t.textContent = "⏳ 남은 " + mmss(Math.max(0, left)); t.classList.toggle("low", left < 60); }
            if (left < -2 && !ended) end("time");  // 시간이 끝남 → 지금 답으로 자동 제출 (관리자 화면이 닫혀 있어도 · 2초 여유)
            return;
        }
        if (t) { t.textContent = "⏱ " + mmss(elapsed()); t.classList.remove("low"); }
    }, 1000);

    // 제출 · 종료 때 지금 화면의 답과 맞힘 여부를 기록 (풀이 보기용 — 어디에도 저장하지 않고 이 창의 메모리에만)
    let rec = null, mo = null, ended = false, stopView = () => { };
    function record() {
        const answers = Object.assign({}, att.answers || {}), solved = {};
        qs().forEach((q) => { const v = answerOf(q); if (v) answers[q.id] = v; solved[q.id] = isSolved(q); });
        return { name, total: P.total, score: att.score, auto: !!att.auto, answers, solved, round, at: new Date().toISOString() };
    }
    function closeOut() {                      // 시험 화면을 닫음 (임시 보관한 답도 지움 — 시험 뒤에는 아무것도 저장하지 않음)
        rec = record(); dropBackup(); clearLocalAnswers(); stopView();
        clearInterval(tick); clearTimeout(timer); if (mo) mo.disconnect();
        document.body.classList.remove("ex-live");
    }
    async function submit() {
        if (att.submitted) return;
        const s = score();
        const empty = qs().filter((q) => !answerOf(q).trim());    // 답을 안 쓴 문제
        const warn = empty.length ? "⚠️ 아직 답을 안 쓴 문제 " + empty.length + "개: " + empty.map(numOf).join(", ") + "번\n(취소하면 첫 번째 문제로 가요)\n\n" : "";
        if (!confirm(warn + "제출할까요?\n제출하면 답이 확정되고 더 이상 바꿀 수 없어요.\n" + (SOLO ? "혼자 풀기라 제출하면 바로 정답과 풀이를 볼 수 있어요." : "정답과 풀이는 시험이 끝나면 볼 수 있어요."))) {
            if (empty.length) goQ(empty[0].id);
            return;
        }
        const done = { submitted: true, score: s, submittedAt: new Date().toISOString(), elapsed: Math.round(elapsed()) };
        if (ONLINE && !SOLO) {
            clearTimeout(timer); await flush();
            try { await setDoc(ref, Object.assign({ updatedAt: serverTimestamp() }, done), { merge: true }); }
            catch (err) { alert("제출을 서버에 저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."); return; }
        }
        Object.assign(att, done);
        closeOut();
        if (SOLO) showFinished(P, rec, "📝 혼자 풀기 결과예요 (서버에는 저장되지 않아요)."); else showSubmitted(rec);
    }
    // 시험 종료 → (아직 안 냈으면 묻지 않고 지금 답으로 제출) → 🎉 수고하셨습니다
    async function end(why) {
        if (ended) return;
        ended = true;
        if (!att.submitted) {
            const done = { submitted: true, score: score(), submittedAt: new Date().toISOString(), elapsed: Math.round(elapsed()), auto: true };
            if (ONLINE && !SOLO) {
                clearTimeout(timer); await flush();
                try { await setDoc(ref, Object.assign({ updatedAt: serverTimestamp() }, done), { merge: true }); }
                catch (err) {                      // 관리자 화면이 먼저 제출 처리했으면 서버 기록을 그대로 씀
                    try { const x = await getDoc(ref); if (x.exists() && x.data().submitted) Object.assign(done, x.data()); } catch (e) { }
                }
            }
            Object.assign(att, done);
        }
        if (!rec) closeOut();
        showFinished(P, rec, (why === "time" ? "⏰ 정해진 시험 시간이 끝났어요." : "") + (SOLO ? " 📝 혼자 풀기 결과예요 (서버에는 저장되지 않아요)." : ""));
    }
    $("ex-bar-submit").addEventListener("click", () => { if (!att.submitted) $("ex-submit").scrollIntoView({ behavior: "smooth" }); });
    $("ex-submit-btn").addEventListener("click", submit);

    await loadScript("codetest.js"); await loadScript("outquiz.js"); await loadScript("quiz.js");
    root.querySelectorAll(".ct-code").forEach((ta) => ta.setAttribute("placeholder", ta.defaultValue.trim()
        ? "지우기를 누르면 " + (D.skelHint || "처음에 써 있던 코드") + "가 다시 나와요 (Tab 키 = 들여쓰기)"
        : "처음부터 끝까지 전체 코드를 쓰세요 (Tab 키 = 들여쓰기)"));

    // ---- 객관식: 보기를 누르면 고름 (바꿀 수 있음 · 맞았는지는 표시 안 함 — 점수판 · 풀이에만) ----
    function pickMcq(q, opt, byUser) {
        q.dataset.ans = opt;
        q.querySelectorAll(".exmcq-opt").forEach((x) => { x.classList.toggle("sel", x.dataset.opt === opt); x.setAttribute("aria-pressed", x.dataset.opt === opt ? "true" : "false"); });
        q.dataset.solved = opt === q.dataset.correct ? "1" : "";
        if (byUser) { backup(q.id, opt); save({ answers: { [q.id]: opt } }); navDraw(); refresh(); }
    }
    root.addEventListener("click", (e) => {
        const b = e.target.closest && e.target.closest(".exmcq-opt");
        if (!b || att.submitted) return;
        pickMcq(b.closest(".ex-q"), b.dataset.opt, true);
    });
    // ---- 서버 기록 되살리기 (다른 기기에서 쓴 답까지) + 서버에 없는 답은 이 기기 임시 보관에서 ----
    const answers = Object.assign({}, att.answers || {}), solved = att.solved || {}, wrongWas = att.wrong || {}, fromBk = {};
    if (!att.submitted) Object.keys(bk).forEach((id) => { if (bk[id] && !answers[id]) { answers[id] = bk[id]; fromBk[id] = bk[id]; } });
    qs().forEach((q) => {
        const v = answers[q.id];
        if (q.dataset.kind === "mcq") { if (typeof v === "string" && v) pickMcq(q, v, false); return; }
        const el = q.querySelector(".oq-ans, .ct-code, .quiz-item input");
        if (el && typeof v === "string" && v) {
            el.value = v;
            if (q.classList.contains("oq") && solved[q.id]) q.querySelector(".oq-check").click();
            else if (q.classList.contains("quiz-item") && solved[q.id]) q.querySelector(".check").click();
            else if (q.classList.contains("ct") && solved[q.id]) {
                q.dataset.passed = "1";
                q.querySelector(".ct-result").innerHTML = '<p class="ex-note">✅ 이전에 통과한 코드예요 (다시 채점하려면 ▶ 채점하기)</p>';
            }
        }
    });
    qs().forEach((q) => { if (!isSolved(q) && wrongWas[q.id]) q.dataset.wrong = "1"; });   // 확인해서 틀렸던 문제는 번호판에 '틀림' 그대로
    last = score(); lastW = JSON.stringify(wrongNow());
    if (Object.keys(fromBk).length) save({ answers: fromBk });
    root.addEventListener("input", (e) => {
        const q = e.target.closest(".ex-q");
        if (q && !att.submitted) { const v = answerOf(q); backup(q.id, v); save({ answers: { [q.id]: v } }); navDraw(); }
    });
    mo = new MutationObserver(refresh);
    mo.observe(root, { subtree: true, attributes: true, attributeFilter: ["data-solved", "data-passed", "data-wrong"] });
    refresh();
    // ---- 👁 관리자가 볼 수 있게: 지금 보는 문제 · 다른 화면 여부 (관리자가 진행하는 시험 중에만 · 혼자 풀기 X) ----
    //  화면에 가장 많이 보이는 문제(입력 중이면 그 문제) → 바뀔 때만, 3초 이상 묶어서 응시 기록 view 에 (다른 앱 · 탭으로 나가거나 돌아오면 바로)
    //  답은 원래대로 save() 로 저장되고 있음 → 관리자 화면은 이미 받는 응시 기록으로 다시 그림 (서버 쓰기 · 읽기 조금만 늘어남)
    if (ONLINE && !SOLO && !att.submitted) {
        root.querySelector(".ex-bar").insertAdjacentHTML("afterend", '<p class="ex-watch">👁 시험 중에는 관리자가 내 화면(보고 있는 문제 · 쓴 답)을 볼 수 있어요</p>');
        const seen = {};                           // 문제별로 화면에 보이는 높이(px)
        let focusQ = "", sent = { q: null, hidden: null }, lastSent = 0, vTimer = null, since = Math.round(nowS());
        const pick = () => { if (focusQ) return focusQ; let best = "", bv = 0; for (const id in seen) if (seen[id] > bv) { bv = seen[id]; best = id; } return best || sent.q || ""; };
        const sendView = (now) => {
            clearTimeout(vTimer);
            const q = pick(), hidden = document.hidden;
            if (q === sent.q && hidden === sent.hidden) return;
            const wait = now ? 0 : Math.max(0, 3000 - (Date.now() - lastSent));
            if (wait > 0) { vTimer = setTimeout(() => sendView(false), wait); return; }
            if (hidden !== sent.hidden) since = Math.round(nowS());   // 숨긴 · 돌아온 시각 (서버 시계)
            sent = { q, hidden }; lastSent = Date.now();
            save({ view: { q, hidden, since, at: serverTimestamp() } });
            if (now) kick();                       // 나가는 순간은 바로 보냄 (폰은 곧 멈추니까)
        };
        const io = new IntersectionObserver((ents) => {
            ents.forEach((e) => { seen[e.target.id] = e.isIntersecting ? e.intersectionRect.height : 0; });
            sendView(false);
        }, { threshold: [0, 0.1, 0.25, 0.5, 0.75, 1] });
        qs().forEach((q) => io.observe(q));
        const onFocus = (e) => { const q = e.target.closest && e.target.closest(".ex-q"); if (q) { focusQ = q.id; sendView(false); } };   // 입력칸에 들어감 · 글자를 침 = 그 문제를 보는 중
        const onBlur = () => { focusQ = ""; };
        const onVis = () => sendView(true);
        root.addEventListener("focusin", onFocus); root.addEventListener("focusout", onBlur); root.addEventListener("input", onFocus);
        document.addEventListener("visibilitychange", onVis);
        sendView(true);
        stopView = () => { io.disconnect(); clearTimeout(vTimer); root.removeEventListener("focusin", onFocus); root.removeEventListener("focusout", onBlur); root.removeEventListener("input", onFocus); document.removeEventListener("visibilitychange", onVis); };
    }
    if (att.submitted) { closeOut(); showSubmitted(rec); }     // 이미 낸 사람 (새로고침 · 다른 기기)
    return { submitted: () => att.submitted, end };
}

async function enterLobby(P, name, note) {

        }, () => { });

            const x = d.data(), t = x.at && x.at.toMillis ? x.at.toMillis() : 0;

        if (!box) return;
        // 순서: 관리자(맨 위 · 2026-10-06 사용자 요청) → 나 → 나머지 가나다순
        const admin = P.adminName || "";
        const others = (ROSTER || defaultRoster(P)).filter((n) => n !== name && n !== admin).sort((a, b) => a.localeCompare(b, "ko"));
        const order = (admin ? [admin] : []).concat(name === admin ? [] : [name], others);
        const tag = (n) => { const t = []; if (n === admin) t.push("관리자"); if (n === name) t.push("나"); return t.length ? " <small>(" + t.join(" · ") + ")</small>" : ""; };
        const on = (n) => n === name || (lobbyAt[n] && Date.now() + skew - lobbyAt[n] < 50000);
        box.innerHTML = order.map((n) => '<li' + (n === admin && order.length > 1 ? ' class="admin"' : "") + '><span class="ex-pres ' + (on(n) ? "on" : "off") + '" aria-label="' + (on(n) ? "접속 중" : "아직 접속 안 함") + '"></span>' + esc(n) + tag(n) + "</li>").join("");
    }
    const startBeat = () => {                      // 대기실 명단 (접속 점) — 실시간 + 15초마다 서버 직접 확인
        drawMembers();
        if (unsubLobby) return;
        ping();
        unsubLobby = onSnapshot(collection(db, "exams", EXAM, "lobby"), (qs) => takeLobby(qs.docs), () => drawMembers());   // 규칙이 옛날이면 다른 사람은 못 읽음 → 모두 회색
        lobbyPoll = setInterval(() => getDocsFromServer(collection(db, "exams", EXAM, "lobby")).then((qs) => takeLobby(qs.docs), () => { }), 15000);
        lobbyTick = setInterval(drawMembers, 10000);
    };
    const stopBeat = () => {                       // 명단만 멈춤 (접속 신호는 계속 — 관리자 화면에서 연결 상태를 보려고)
        if (unsubLobby) { unsubLobby(); unsubLobby = null; }
        clearInterval(lobbyTick); clearInterval(lobbyPoll);
    };
    window.addEventListener("pagehide", () => { clearInterval(beat); setDoc(lobbyRef(name), { name, at: null, st: "left", ver: BUILD }).catch(() => { }); });   // 창을 닫으면 바로 회색 (못 보내면 1분 뒤)
    window.addEventListener("pageshow", (e) => { if (e.persisted) location.reload(); });   // 뒤로 가기 캐시로 돌아오면 연결이 죽어 있으니 새로 열기
    let phaseNow = "", ran = false, offSince = 0, lastD = null;
    // 대기실에서 관리자가 나간 지 3초 → 혼자 풀기 도전 화면 (받아 둔 시험 문서로 1초마다 이 기기에서만 확인 — 서버에 더 묻지 않음)
    function adminGone(d) {
        if (ADMIN_MODE || !(state === "wait" || state === "ended") || (d.phase || "ready") === "live" || adminOnline(d)) { offSince = 0; return false; }
        if (!offSince) offSince = Date.now();
        if (Date.now() - offSince < 3000) return false;
        switchMode(name, "left");
        return true;
    }
    setInterval(() => { if (lastD) { adminGone(lastD); const g = $("ex-admin-gone"); if (g) g.hidden = adminOnline(lastD) || ADMIN_MODE; } }, 1000);
    async function onExam(s) {
        if (state === "out") return;               // 명단에서 빠져서 나감
        const d = s.exists() ? s.data() : {};
        const r = d.round || 1, phase = d.phase || "ready";
        const prevEnds = EXAM_ENDS;                // 시간 제한 시험이 시간이 다 돼서 끝났는지 (⏰ 안내용)
        if (phase === "live" && d.startedAt && d.startedAt.toMillis) EXAM_START = d.startedAt.toMillis();
        EXAM_ENDS = phase === "live" && typeof d.endsAt === "number" ? d.endsAt : 0;   // 관리자가 시간을 늘리거나 줄이면 바로 반영
        if (Array.isArray(d.roster)) { ROSTER = d.roster; drawMembers(); }               // 관리자가 명단을 바꾸면 대기실 명단도
        if (!ADMIN_MODE && Array.isArray(d.roster) && d.roster.indexOf(name) < 0 && state !== "exam" && state !== "done") {   // 대기 중에 명단에서 빠짐 → 나가기 (시험 중이면 끝까지)
            state = "out"; clearInterval(beat); stopBeat(); keepAwake(false);
            setDoc(lobbyRef(name), { name, at: null, st: "left", ver: BUILD }).catch(() => { });
            try { sessionStorage.removeItem(RESUME); } catch (e) { }
            $("ex-wait").hidden = false;
            $("ex-wait").innerHTML = '<h2>⚠️ 스터디 명단에서 빠졌어요</h2><p class="ex-note">관리자에게 이름을 다시 추가해 달라고 말해 주세요. 추가되면 새로고침해서 비밀번호 · 이름으로 다시 들어오면 돼요.</p>';
            return;
        }
        PLAN = typeof d.plannedSec === "number" ? d.plannedSec : 0; planDraw();           // 관리자가 정해 둔 시험 시간
        if (state === "exam" && prevEnds && EXAM_ENDS && Math.abs(EXAM_ENDS - prevEnds) > 1500) {   // 시험 중에 관리자가 시간을 바꿈
            const diff = Math.round((EXAM_ENDS - prevEnds) / 60000);
            toast("⏱ 시험 시간이 " + (EXAM_ENDS > prevEnds ? "늘었어요" : "줄었어요") + (diff ? " (" + (diff > 0 ? "+" : "") + diff + "분)" : "") + " · 남은 " + mmss(Math.max(0, (EXAM_ENDS - nowS()) / 1000)), true);
        }
        lastD = d;
        if (adminGone(d)) return;                  // 대기실에서 관리자가 나감 → "관리자가 나갔어요 · 혼자서 문제풀기 도전?"
        setConn(true); verNote(d.pageVer);
        { const g = $("ex-admin-gone"); if (g) g.hidden = adminOnline(d) || ADMIN_MODE; }   // 제출하고 기다리는데 관리자가 나갔으면 안내
        if (state === "exam") {                    // 문제를 푸는 중 · 제출하고 기다리는 중
            if (r !== round && phase === "live") { clearLocalAnswers(); switchMode(name, "🛡️ 관리자가 새 시험을 시작했어요."); return; }
            if (phase !== "live" || r !== round) { state = "done"; ping(); if (exam) await exam.end(prevEnds && nowS() >= prevEnds - 3000 ? "time" : ""); }   // 종료 (종료 알림을 놓치고 정리까지 끝났어도)
            return;
        }
        if (r === round && phase === phaseNow) return;                 // 바뀐 게 없음
        if (phase === "live" && ran) { await adminBusy; switchMode(name, ""); return; }    // 이 창에서 이미 시험을 봤으면 새 시험은 새로 열기 (비밀번호 · 이름 없이 · 관리자는 시작 정리가 끝난 뒤)
        round = r; phaseNow = phase;
        if (state === "done") return;              // 🎉 수고하셨습니다 화면은 그대로 (관리자가 기록을 정리해도)
        if (phase === "live") {
            stopBeat(); state = "exam"; ran = true; ping();
            try { exam = await startExam(P, name, r); verNote(d.pageVer); }
            catch (err) {                          // 문제를 못 띄움(서버 저장 실패 등) → 대기 화면으로 되돌리고 다음 확인(5초) 때 다시 시도
                state = "wait"; ran = false; phaseNow = ""; exam = null;
                $("ex-exam").hidden = true; showWait(name, "ready"); startBeat();
                $("ex-wait").insertAdjacentHTML("beforeend", '<p class="ex-note">⚠️ 문제를 불러오지 못해 다시 시도하는 중… (' + esc(err && (err.code || err.message) || err) + ")</p>");
            }
            return;
        }
        if (phase === "ended") {
            stopBeat();
            const mine = await getDoc(attRef(r, name));
            if (mine.exists()) { state = "exam"; ran = true; exam = await startExam(P, name, r); state = "done"; await exam.end(); return; }
        }
        if (phase === "ended") { state = "ended"; showWait(name, "ended"); return; }
        state = "wait"; showWait(name, "ready"); startBeat();
    }
    // 시험 상태는 실시간 알림 + 5초마다 서버 직접 확인 둘 다로 받음 (아이패드 Safari 는 탭 전환 · 화면 꺼짐 뒤 실시간 연결이 멈춰서 시작을 놓친 적 있음)
    //  단계 번호(시험 번호 × 3 + 대기 0 · 시험 중 1 · 종료 2)는 늘기만 하니, 늦게 도착한 예전 상태는 버림 (시험 중인데 '대기'가 늦게 와서 끝나 버리지 않게)
    let seen = -1;
    const stage = (s) => { const d = s.exists() ? s.data() : {}; return (d.round || 1) * 3 + ({ ready: 0, live: 1, ended: 2 }[d.phase || "ready"] || 0); };
    const feed = (s) => {
        const k = stage(s);
        if (k < seen) return Promise.resolve();
        seen = k;
        const run = chain.then(() => onExam(s));
        chain = run.catch(() => { });
        return run;
    };
    await new Promise((ok, bad) => {
        let first = true;
        onSnapshot(examRef(), (s) => {
            feed(s).then(() => { if (first) { first = false; ok(); } }, (err) => { if (first) { first = false; bad(err); } });
        }, (err) => { if (first) { first = false; bad(err); } });
    });
    const poll = () => getDocFromServer(examRef()).then((s) => feed(s).catch(() => { }), () => setConn(false));
    setInterval(poll, 5000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
}

// ---- 관리자 화면 (비밀번호 칸에 관리자 코드 → 서버 규칙이 관리자 계정인지 확인) ----
//  버튼 하나가 단계마다 바뀜: ▶️ 시험 시작 (대기) → 🏁 시험 종료 (시험 중)
//  종료하면: 푸는 중인 사람 자동 제출 → 결과 창(순위 · 이름 · 점수) → 기록을 지우고 다시 대기로 (다음엔 시작만 누르면 됨)
const medal = (p) => p === 1 ? "🥇" : p === 2 ? "🥈" : p === 3 ? "🥉" : p + "위";
function rankOf(rows) {                            // 점수 높은 순 → 같으면 빨리 푼 순 · 점수가 같으면 같은 등수
    let prev = null, place = 0;
    return rows.slice().sort((a, b) => b.score - a.score || (a.elapsed || 0) - (b.elapsed || 0)).map((r, i) => {
        if (!prev || prev.score !== r.score) place = i + 1;
        prev = r;
        return { place, name: r.name, score: r.score, total: r.total, elapsed: r.elapsed || 0, auto: !!r.auto };
    });
}
function showModal(res, note) {

        + res.list.map((r) => '<tr><td class="ex-rank">' + medal(r.place) + "</td><td><b>" + esc(r.name) + '</b></td><td class="num">' + r.score + " / " + r.total + "</td></tr>").join("")
        + "</table>"
        + (res.stats && res.stats.length ? '<details class="ex-stats" open><summary>📊 문제별 정답률 (낮은 순 · 관리자만)</summary><table class="ex-board ex-stat"><tr><th>번호</th><th>문제</th><th>정답률</th></tr>'
            + res.stats.slice().sort((a, b) => a.rate - b.rate || Number(a.no) - Number(b.no)).map((q) => '<tr class="' + (q.rate < 0.5 ? "low" : "") + '"><td>' + esc(q.no) + "</td><td>" + (q.kind ? "<small>" + esc(q.kind) + "</small>" : "") + esc(q.title) + '</td><td class="num">' + Math.round(q.rate * 100) + "%<br><small>" + q.ok + " / " + q.n + "</small></td></tr>").join("")
            + "</table></details>" : "")

        + foot;
    const cp = $("ex-copy");
    if (cp) cp.addEventListener("click", () => copyText(resultText(res)).then((ok) => { cp.textContent = ok ? "✅ 복사했어요" : "⚠️ 복사 실패 — 화면을 캡처해 주세요"; setTimeout(() => { cp.textContent = "📋 결과 복사 (카톡에 붙여넣기)"; }, 2500); }));
    $("ex-modal").hidden = false;
    $("ex-modal-close").focus();
}
function resultText(res) {
    const lines = [(D.resultName || "실제시험") + " 결과 · " + res.when + " · " + res.list.length + "명"];
    res.list.forEach((r) => lines.push(medal(r.place) + " " + r.name + " " + r.score + "/" + r.total + (r.elapsed ? " (" + mmss(r.elapsed) + ")" : "") + (r.auto ? " 자동 제출" : "")));
    if (res.stats && res.stats.length) {
        const low = res.stats.filter((q) => q.rate < 0.5).sort((a, b) => a.rate - b.rate).slice(0, 8);
        if (low.length) lines.push("", "📊 많이 틀린 문제: " + low.map((q) => q.no + "번 " + Math.round(q.rate * 100) + "%").join(" · "));
    }
    return lines.join("\n");
}
function copyText(text) {
    const old = () => { try { const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); const ok = document.execCommand("copy"); t.remove(); return ok; } catch (e) { return false; } };
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => old());
    return Promise.resolve(old());
}
// 문제별 정답률 (관리자 결과 창) — 응시 기록의 solved(문제마다 맞혔는지)로
function qStats(rows) {
    if (!rows.length) return [];
    let list = [];
    const bare = (el) => { if (!el) return ""; const c = el.cloneNode(true); c.querySelectorAll("span").forEach((x) => x.remove()); return c.textContent.trim(); };
    const KIND = { out: "출력", type: "작성", blank: "빈칸", err: "오류", mcq: "객관식", short: "주관식" };
    if (adminP) {
        const tpl = document.createElement("template"); tpl.innerHTML = adminP.html;
        list = [...tpl.content.querySelectorAll(".ex-q")].map((q) => {
            const kind = q.dataset.kind;
            const title = kind === "out" ? ((q.querySelector(".oq-tag") || {}).textContent || "") : bare(q.querySelector(".ct-q, .quiz-q"));
            return { id: q.id, no: ((q.querySelector(".oq-no, .ct-no, .quiz-cat") || {}).textContent || "").trim(), kind: KIND[kind] || "", title };
        });
    } else {
        const n = rows[0].total || 0;
        for (let i = 1; i <= n; i++) list.push({ id: "ex-q" + i, no: String(i), kind: "", title: "" });
    }
    return list.map((q) => { const ok = rows.filter((r) => r.solved && r.solved[q.id]).length; return Object.assign(q, { ok, n: rows.length, rate: ok / rows.length }); });
}

    const HELP = {
        ready: "관리자가 접속해 있는 동안 친구들은 혼자 풀기 대신 이 시험 대기실로 들어와요. 👥 명단에 있는 친구만 비밀번호 · 이름까지 입력하고 기다려요. <b>▶️ 시간 제한 없이 시작</b> 또는 <b>⏱ 시간 정해서 시작</b>(시간 · 분 · 초 → 시간이 지나면 자동 종료)을 누르면 모두의 화면에 문제가 한꺼번에 나와요 (나는 이 화면 아래에서 같이 풀어요).",

    function setPhaseUI() {
        const b = $("ex-go");

        b.textContent = finishing || phase === "ended" ? "⏳ 정리 중…" : phase === "ready" ? "▶️ 시간 제한 없이 시작" : "🏁 시험 종료";

    // 새 시험 번호로 넘기고 지난 기록을 지움 (시작할 때 · 종료 정리할 때) · 대기실 신호는 안 지움 (15초마다 다시 오고, 오래된 건 화면에서 숨김)
    //  시험 문서만 바뀌면 시작 · 대기 전환은 끝난 것 — 지난 기록 지우기가 실패해도 시험에는 영향 없으니 경고만 돌려줌
    async function freshRound(nextPhase, extra) {
        let free;
        adminBusy = new Promise((r) => { free = r; });
        try { return await freshRoundNow(nextPhase, extra); } finally { free(); }
    }
    async function freshRoundNow(nextPhase, extra) {
        const next = round + 1;
        const patch = Object.assign({ round: next, phase: nextPhase, revealed: false, endsAt: null, limitSec: null }, extra || {});
        patch[nextPhase === "live" ? "startedAt" : "readyAt"] = serverTimestamp();
        if (BUILD && BUILD > pageVer) patch.pageVer = BUILD;
        await updateDoc(examRef(), patch);
        let warn = "";
        try {
            const refs = (await getDocs(collection(db, "exams", EXAM, "attempts"))).docs.filter((d) => d.data().round !== next).map((d) => d.ref);
            for (let i = 0; i < refs.length; i += 400) {
                const b = writeBatch(db);
                refs.slice(i, i + 400).forEach((r) => b.delete(r));
                await b.commit();
            }
        } catch (e) { warn = e.code || e.message; }
        clearLocalAnswers();
        return warn;
    }
    // 🏁 종료: 종료 알림 → 친구 화면이 스스로 제출할 시간 → 남은 사람(창을 닫았거나 인터넷이 끊김)은 마지막 저장 점수로 제출
    //        → 결과 창 → 결과 보관(📋 지난 결과) → 기록 정리 후 대기로

        b.disabled = true; $("ex-go-timed").disabled = true; msg.textContent = "시작하는 중…";
        try {

            extra.callAll = serverTimestamp();     // 혼자 푸는 사람도 모두 불러옴 (시험을 놓치지 않게)

            msg.textContent = "✅ 시험을 시작했어요" + (limitSec ? " (⏱ " + hms(limitSec).trim() + ")" : "") + (w ? " (지난 기록 정리는 일부 실패 — 시험에는 영향 없어요 · " + w + ")" : "");
        }
        catch (err) { msg.textContent = "⚠️ 시작 실패 (" + (err.code || err.message) + ") — 인터넷을 확인하고 다시 눌러 주세요."; b.disabled = false; }

    // ⏱ 시간 정해서 시작 → 시간 · 분 · 초 입력칸 (지난번에 쓴 시간을 기억)
    const LIMIT_KEY = "ex-limit";

    function planSec() { const n = (id, max) => Math.min(Math.max(Math.floor(Number($(id).value || 0)) || 0, 0), max); return n("ex-th", 23) * 3600 + n("ex-tm", 59) * 60 + n("ex-ts", 59); }

        if (phase !== "ready" && d.startedAt && d.startedAt.toMillis) examStart = d.startedAt.toMillis();
        setPhaseUI();
        if (firstSnap && phase === "ready" && typeof d.plannedSec === "number" && d.plannedSec > 0 && $("ex-timed").hidden) {
            const v = d.plannedSec; $("ex-th").value = Math.floor(v / 3600); $("ex-tm").value = Math.floor(v % 3600 / 60); $("ex-ts").value = v % 60; $("ex-timed").hidden = false;
        }
        const nr = Array.isArray(d.roster) ? d.roster : null;
        if (JSON.stringify(nr) !== JSON.stringify(roster)) { roster = nr; renderRoster(); draw(); }
        if ((d.round || 1) !== round || !unsubRows) {
            round = d.round || 1; rows = [];
            if (unsubRows) unsubRows();
            unsubRows = onSnapshot(query(collection(db, "exams", EXAM, "attempts"), where("round", "==", round)), (qs) => {
                rows = qs.docs.map((x) => x.data());
                draw(); lvUpdate();
            }, (err) => { $("ex-admin-status").textContent = "○ 점수판을 불러오지 못했어요 (" + (err.code || err.message) + ")"; });
        }
        draw();
        // 종료 정리 중에 창을 닫았으면, 다시 열었을 때 이어서 정리
        if (firstSnap && phase === "ended") finishExam(false);
        firstSnap = false;
    }
    onSnapshot(examRef(), applyExam);
    // 관리자 접속 신호 (15초마다 · 창을 닫으면 지움) → 친구들: 접속해 있으면 시험 대기실, 없으면 혼자 풀기
    const beatAdmin = () => updateDoc(examRef(), { ["admins." + ADMIN_DEV]: { at: serverTimestamp(), ttl: document.hidden ? 180 : 30 } }).catch(() => { });
    setInterval(beatAdmin, 10000);
    document.addEventListener("visibilitychange", beatAdmin);   // 탭이 가려지면 넉넉히(180초) · 다시 보이면 바로 신호
    window.addEventListener("pagehide", () => { updateDoc(examRef(), { ["admins." + ADMIN_DEV]: deleteField() }).catch(() => { }); });   // 창을 닫으면 내 칸만 지움
    adminPlay().catch((err) => {                   // 점수판 아래에서 내 이름으로 같이 풀기
        const box = $("ex-play-setup"); box.hidden = false;
        box.innerHTML = '<p class="ex-msg no">⚠️ 같이 풀기를 열지 못했어요 (' + esc(err && (err.code || err.message) || err) + ') — 새로고침해 주세요. 점수판 · 시작 · 종료는 그대로 돼요.</p>';
    });
    setInterval(async () => {
        try {
            applyExam(await getDocFromServer(examRef()));
            rows = (await getDocsFromServer(query(collection(db, "exams", EXAM, "attempts"), where("round", "==", round)))).docs.map((x) => x.data());
            try { lobby = (await getDocsFromServer(collection(db, "exams", EXAM, "lobby"))).docs.map((x) => x.data()).sort((a, b) => String(a.name).localeCompare(String(b.name), "ko")); lobbyErr = ""; }
            catch (e) { lobbyErr = e.code || e.message; }
            draw(); lvUpdate();
        } catch (e) { $("ex-admin-status").textContent = "🔴 서버 연결 끊김 — 다시 연결하는 중 (" + (e.code || e.message) + ")"; }
    }, 5000);
}
</script>
</body>
</html>
