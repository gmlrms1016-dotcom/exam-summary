<html lang="ko">

    <title>자바프로그래밍 · 중간고사 실제시험</title>
    <link rel="stylesheet" href="style.css?v=202609291739">
    <style>
        pre.io { background:#0f1b14; }
        pre.io::before { content:"▶ 실행 화면"; color:#7fd49a; }
        pre.io code { color:#dff5e6; }
        .ex-lock { max-width:440px; margin:26px auto; text-align:center; }
        .ex-lock form { display:flex; gap:8px; justify-content:center; margin:14px 0 6px; }
        .ex-lock input { flex:1 1 auto; min-width:0; max-width:240px; font-size:18px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); text-align:center; }
        .ex-btn, .ex-lock button { font-size:15px; font-weight:800; padding:10px 18px; border:0; border-radius:12px; background:var(--main); color:#fff; cursor:pointer; }
        .ex-btn:disabled, .ex-lock button:disabled { opacity:.55; cursor:default; }
        .ex-msg { min-height:22px; font-weight:800; margin:6px 0 0; }
        .ex-msg.no { color:#d9534f; }
        .ex-msg.info { color:var(--ink-2); font-weight:600; }
        .ex-bar { position:sticky; top:62px; z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin:0 0 14px; padding:10px 14px; padding-right:62px; border:1px solid var(--line); border-radius:14px; background:var(--card); box-shadow:0 6px 18px rgba(0,0,0,.08); font-weight:800; font-size:14px; }
        .ex-bar .ex-score { color:var(--main); }
        .ex-bar .ex-time { font-variant-numeric:tabular-nums; color:var(--ink-2); }
        .ex-bar .ex-sync { font-weight:600; font-size:12px; color:var(--ink-2); }
        .ex-bar .ex-btn { margin-left:auto; padding:7px 14px; font-size:13px; }
        .ex-kind { display:inline-block; font-size:12px; font-weight:900; padding:1px 9px; border-radius:999px; margin-right:6px; vertical-align:1px; color:#fff; }
        .ex-kind.out { background:#2d6a4f; }
        .ex-kind.type { background:#1f5aa6; }
        .ex-kind.blank { background:#8a5a00; }
        .ex-desc { margin:4px 0 8px; line-height:1.7; }
        .ex-file { font-size:12px; font-weight:800; color:var(--ink-2); margin-left:6px; }
        .quiz-item.ex-q .quiz-cat { display:inline-block; min-width:26px; height:24px; line-height:24px; text-align:center; background:var(--main); color:#fff; border-radius:6px; font-size:13px; margin-right:8px; padding:0 4px; }
        .quiz-item.ex-q pre { margin:6px 0 10px; }
        .ex-live .quiz-btn.show, .ex-live .oq-show, .ex-live .ct-show { display:none !important; }
        .ex-rules ul { margin:6px 0 0; padding-left:20px; line-height:1.8; }
        #ex-result .ex-final { font-size:22px; font-weight:900; color:var(--main); margin:12px 0 4px; }
        .ex-admin-head { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
        .ex-admin-head .ex-btn { margin-left:auto; }
        .ex-note { font-size:13px; color:var(--ink-2); margin:6px 0 0; }
        .ex-board { width:100%; border-collapse:collapse; margin:12px 0 0; font-size:14px; }
        .ex-board th, .ex-board td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; }
        .ex-board th { font-size:12.5px; color:var(--ink-2); }
        .ex-board td.num { font-variant-numeric:tabular-nums; font-weight:800; }
        .ex-meter { display:inline-block; width:90px; height:8px; border-radius:99px; background:var(--line); vertical-align:middle; margin-left:8px; overflow:hidden; }
        .ex-meter i { display:block; height:100%; background:var(--main); }
        .ex-pill { display:inline-block; font-size:12px; font-weight:800; padding:1px 8px; border-radius:999px; background:var(--line); color:var(--ink-2); }
        .ex-pill.done { background:#2d6a4f; color:#fff; }
        .ex-rank { font-size:16px; font-weight:900; }
    </style>

<script>
(function () {
    "use strict";
    var D = window.EX_DATA;
    var $ = function (id) { return document.getElementById(id); };
    var VER = (document.querySelector('script[src^="theme.js"]').getAttribute("src").split("v=")[1] || "");
    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
    function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
    function mmss(sec) { sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(s).padStart(2, "0"); }

    // ---- 비밀번호로 문제 풀기 (PBKDF2 → AES-GCM) ----
    function decrypt(box, pass) {
        var enc = new TextEncoder();
        return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]).then(function (km) {
            return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(box.s), iterations: D.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        }).then(function (key) {
            return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.i) }, key, b64(box.c));
        }).then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); });
    }

    $("ex-pin-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var pin = $("ex-pin").value.trim(), msg = $("ex-pin-msg"), btn = this.querySelector("button");
        if (!pin) return;
        if (!window.crypto || !crypto.subtle) { msg.className = "ex-msg no"; msg.textContent = "이 브라우저에서는 열 수 없어요 (https 주소로 열어 주세요)"; return; }
        btn.disabled = true; msg.className = "ex-msg info"; msg.textContent = "확인 중…";
        decrypt(D.exam, pin).then(function (P) { btn.disabled = false; msg.textContent = ""; askName(P); })
            .catch(function () {
                return decrypt(D.admin, pin).then(function (A) { btn.disabled = false; msg.textContent = ""; openAdmin(A); })
                    .catch(function () { btn.disabled = false; msg.className = "ex-msg no"; msg.textContent = "비밀번호가 틀렸어요."; $("ex-pin").select(); });
            });
    });

    // ---- 이름 확인 (스터디 명단과 하나라도 다르면 다시 입력) ----
    function askName(P) {
        $("ex-lock").hidden = true;
        $("ex-name").hidden = false;
        var sess = store("javaexam:" + P.examId);
        if (sess && sess.name) $("ex-name-in").value = sess.name;
        $("ex-name-in").focus();
        $("ex-name-form").addEventListener("submit", function (e) {
            e.preventDefault();
            var name = $("ex-name-in").value.replace(/\s+/g, "");
            var msg = $("ex-name-msg");
            if (P.names.indexOf(name) < 0) {
                msg.className = "ex-msg no";
                msg.textContent = "⚠️ 스터디 명단에 없는 이름이에요. 이름을 다시 입력해 주세요.";
                alert("스터디 명단에 없는 이름이에요.\n이름을 정확히 다시 입력해 주세요.");
                $("ex-name-in").value = "";
                $("ex-name-in").focus();
                return;
            }
            startExam(P, name);
        });
    }

    // ---- 시험 ----
    function loadScript(src) {
        return new Promise(function (ok, bad) { var s = document.createElement("script"); s.src = src + "?v=" + VER; s.onload = ok; s.onerror = bad; document.body.appendChild(s); });
    }
    function startExam(P, name) {
        var key = "javaexam:" + P.examId;
        var sess = store(key);
        if (!sess || sess.name !== name) {
            // 새 응시자 → 이 기기에 남아 있던 다른 사람의 답을 지운다
            try { Object.keys(localStorage).forEach(function (k) { if (/^(oq|ct):/.test(k) && k.indexOf(location.pathname) >= 0) localStorage.removeItem(k); }); } catch (e) { }
            sess = { sid: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), name: name, startedAt: new Date().toISOString(), submitted: false };
            store(key, sess);
        }
        $("ex-name").hidden = true;
        var root = $("ex-exam");
        root.innerHTML = '<div class="ex-bar" id="ex-bar"><span>👤 ' + esc(name) + '</span><span class="ex-score" id="ex-score">✅ 0 / ' + P.total + '</span><span class="ex-time" id="ex-time">⏱ 00:00</span><span class="ex-sync" id="ex-sync"></span><button class="ex-btn" type="button" id="ex-bar-submit">제출</button></div>' + P.html;
        root.hidden = false;
        if (!sess.submitted) document.body.classList.add("ex-live");

        var started = new Date(sess.startedAt).getTime();
        function elapsed() { return ((sess.submitted ? new Date(sess.submittedAt).getTime() : Date.now()) - started) / 1000; }
        function score() {
            return root.querySelectorAll('.oq[data-solved="1"], .quiz-item[data-solved="1"], .ct[data-passed="1"]').length;
        }
        var last = -1, timer = null;
        function payload(status) {
            return { exam: P.examId, sid: sess.sid, name: sess.name, score: sess.submitted ? sess.finalScore : score(), total: P.total, status: status, startedAt: sess.startedAt, elapsed: Math.round(elapsed()) };
        }
        function send(status, beacon) {
            if (!P.endpoint) { $("ex-sync").textContent = ""; return; }
            var body = JSON.stringify(payload(status));
            if (beacon && navigator.sendBeacon) { navigator.sendBeacon(P.endpoint, new Blob([body], { type: "text/plain" })); return; }
            fetch(P.endpoint, { method: "POST", body: body }).then(function () { $("ex-sync").textContent = "● 점수 전송됨"; })
                .catch(function () { $("ex-sync").textContent = "○ 전송 실패 (다시 시도해요)"; });
        }
        function refresh() {
            var s = sess.submitted ? sess.finalScore : score();
            $("ex-score").textContent = "✅ " + s + " / " + P.total;
            if (!sess.submitted && s !== last) { last = s; clearTimeout(timer); timer = setTimeout(function () { send("진행중"); }, 1200); }
        }
        setInterval(function () { $("ex-time").textContent = "⏱ " + mmss(elapsed()); }, 1000);
        if (!sess.submitted) {
            setInterval(function () { send("진행중"); }, 60000);
            document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden" && !sess.submitted) send("진행중", true); });
        }

        function submit() {
            if (sess.submitted) return;
            var s = score();
            if (!confirm("제출할까요?\n현재 점수 " + s + " / " + P.total + "\n제출하면 점수가 확정되고 더 이상 바뀌지 않아요.")) return;
            sess.submitted = true; sess.finalScore = s; sess.submittedAt = new Date().toISOString();
            store(key, sess);
            send("제출");
            showResult();
        }
        function showResult() {
            document.body.classList.remove("ex-live");
            $("ex-bar-submit").disabled = true; $("ex-bar-submit").textContent = "제출 완료";
            var b = $("ex-submit-btn"); if (b) { b.disabled = true; b.textContent = "제출 완료"; }
            $("ex-result").innerHTML = '<p class="ex-final">' + esc(sess.name) + ' · ' + sess.finalScore + ' / ' + P.total + '점</p><p class="ex-note">걸린 시간 ' + mmss(elapsed()) + ' · 이제 각 문제의 <b>정답 보기</b>로 풀이를 확인할 수 있어요.</p>';
            refresh();
        }
        $("ex-bar-submit").addEventListener("click", function () { if (sess.submitted) return; $("ex-submit").scrollIntoView({ behavior: "smooth" }); });
        $("ex-submit-btn").addEventListener("click", submit);

        loadScript("codetest.js").then(function () { return loadScript("outquiz.js"); }).then(function () { return loadScript("quiz.js"); }).then(function () {
            new MutationObserver(refresh).observe(root, { subtree: true, attributes: true, attributeFilter: ["data-solved", "data-passed"] });
            if (sess.submitted) showResult();
            else send("진행중");
            refresh();
        });
    }

    // ---- 관리자 점수판 (관리자 코드로만 열림) ----
    function openAdmin(A) {
        $("ex-lock").hidden = true;
        var root = $("ex-admin");
        root.hidden = false;
        var revealKey = "javaexam-reveal:" + A.examId;
        var revealed = !!store(revealKey);
        root.innerHTML = '<section class="card"><div class="ex-admin-head"><h2 style="margin:0">🛡️ 관리자 · 실시간 점수판</h2>'
            + '<button class="ex-btn" type="button" id="ex-reveal"></button></div>'
            + '<p class="ex-note" id="ex-admin-status">불러오는 중…</p><div id="ex-admin-board"></div>'
            + '<p class="ex-note">시험 중에는 <b>점수만</b> 보여요 (이름은 가림). 모두 제출하거나 <b>시험 종료</b>를 누르면 이름 · 순위 · 점수가 보여요. 이 화면은 관리자 코드로만 열려요.</p></section>';
        var rows = [];
        function setBtn() { $("ex-reveal").textContent = revealed ? "🙈 다시 가리기" : "🏁 시험 종료 · 결과 공개"; }
        $("ex-reveal").addEventListener("click", function () { revealed = !revealed; store(revealKey, revealed || null); setBtn(); draw(); });
        setBtn();
        function draw() {
            var box = $("ex-admin-board");
            if (!rows.length) { box.innerHTML = '<p class="ex-note">아직 시험을 시작한 사람이 없어요.</p>'; return; }
            var allDone = rows.every(function (r) { return r.status === "제출"; });
            var show = revealed || allDone;
            var h = '<table class="ex-board">';
            if (!show) {
                var list = rows.slice().sort(function (a, b) { return String(a.startedAt).localeCompare(String(b.startedAt)); });
                h += "<tr><th>응시자</th><th>점수</th><th>상태</th><th>갱신</th></tr>";
                list.forEach(function (r, i) {
                    var pct = r.total ? Math.round(r.score / r.total * 100) : 0;
                    h += "<tr><td>응시자 " + (i + 1) + '</td><td class="num">' + r.score + " / " + r.total + '<span class="ex-meter"><i style="width:' + pct + '%"></i></span></td><td>' + pill(r.status) + "</td><td>" + ago(r.updatedAt) + "</td></tr>";
                });
            } else {
                var rank = rows.slice().sort(function (a, b) { return b.score - a.score || a.elapsed - b.elapsed; });
                h += "<tr><th>순위</th><th>이름</th><th>점수</th><th>걸린 시간</th><th>상태</th></tr>";
                var prev = null, place = 0;
                rank.forEach(function (r, i) {
                    if (!prev || prev.score !== r.score) place = i + 1;
                    prev = r;
                    h += '<tr><td class="ex-rank">' + (place === 1 ? "🥇" : place === 2 ? "🥈" : place === 3 ? "🥉" : place + "위") + "</td><td><b>" + esc(r.name) + '</b></td><td class="num">' + r.score + " / " + r.total + "</td><td>" + mmss(r.elapsed) + "</td><td>" + pill(r.status) + "</td></tr>";
                });
            }
            box.innerHTML = h + "</table>" + (show ? "" : '<p class="ex-note">제출 ' + rows.filter(function (r) { return r.status === "제출"; }).length + " / " + rows.length + "명</p>");
        }
        function pill(s) { return '<span class="ex-pill' + (s === "제출" ? " done" : "") + '">' + (s === "제출" ? "제출" : "푸는 중") + "</span>"; }
        function ago(t) { var s = (Date.now() - new Date(t).getTime()) / 1000; return isNaN(s) ? "-" : s < 60 ? Math.max(0, Math.round(s)) + "초 전" : Math.round(s / 60) + "분 전"; }
        function poll() {
            if (!A.endpoint) { $("ex-admin-status").innerHTML = "⚠️ 점수판 서버(구글 Apps Script)가 아직 연결되지 않았어요 — 연결하면 친구들 점수가 여기에 실시간으로 떠요."; draw(); return; }
            fetch(A.endpoint + "?key=" + encodeURIComponent(A.key) + "&exam=" + encodeURIComponent(A.examId) + "&t=" + Date.now())
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    if (!j.ok) throw new Error(j.error || "응답 오류");
                    rows = j.rows || [];
                    $("ex-admin-status").textContent = "● 실시간 · 5초마다 갱신 · 마지막 " + new Date().toLocaleTimeString() + " · " + rows.length + "명";
                    draw();
                })
                .catch(function (e) { $("ex-admin-status").textContent = "○ 불러오지 못했어요 (" + e.message + ") — 5초 뒤 다시 시도"; });
        }
        poll();
        setInterval(poll, 5000);
    }
})();
</script>
</body>
</html>
