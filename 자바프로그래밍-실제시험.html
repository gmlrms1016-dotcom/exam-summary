<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="theme.js?v=202610062029"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>자바프로그래밍 · 중간고사 실제시험</title>
    <link rel="stylesheet" href="style.css?v=202610062029">
    <style>
        pre.io { background:#0f1b14; }
        pre.io::before { content:"▶ 실행 화면"; color:#7fd49a; }
        pre.io code { color:#dff5e6; }
        .ex-lock { max-width:440px; margin:26px auto; text-align:center; }
        .ex-lock form { display:flex; gap:8px; justify-content:center; margin:14px 0 6px; }
        .ex-lock input { flex:1 1 auto; min-width:0; max-width:240px; font-size:18px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); text-align:center; }
        /* 비밀번호 칸을 type=password 로 두면 브라우저가 "비밀번호 저장" → 다음에 자동으로 채워 넣어서, 그 뒤에 친 숫자가 이어 붙음 → 틀림. 그래서 text 칸 + 점 가리기 */
        #ex-pin, #ex-play-pin { -webkit-text-security:disc; text-security:disc; }
        .ex-bar .ex-to-admin { font-size:13px; font-weight:800; color:var(--main); text-decoration:none; }
        #ex-pin.show { -webkit-text-security:none; text-security:none; }
        .ex-lock .ex-eye { padding:10px 12px; background:var(--card); color:var(--ink); border:1px solid var(--line); font-size:16px; }
        .ex-lock .ex-eye.on { background:var(--main); color:#fff; border-color:var(--main); }
        .ex-btn, .ex-lock button { font-size:15px; font-weight:800; padding:10px 18px; border:0; border-radius:12px; background:var(--main); color:#fff; cursor:pointer; }
        .ex-btn:disabled, .ex-lock button:disabled { opacity:.55; cursor:default; }
        .ex-msg { min-height:22px; font-weight:800; margin:6px 0 0; }
        .ex-msg.no { color:#d9534f; }
        .ex-msg.info { color:var(--ink-2); font-weight:600; }
        .ex-bar { position:sticky; top:62px; z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin:0 0 14px; padding:10px 14px; padding-right:62px; border:1px solid var(--line); border-radius:14px; background:var(--card); box-shadow:0 6px 18px rgba(0,0,0,.08); font-weight:800; font-size:14px; }
        .ex-bar .ex-score { color:var(--main); }
        .ex-bar .ex-time { font-variant-numeric:tabular-nums; color:var(--ink-2); }
        .ex-bar .ex-sync { font-weight:600; font-size:12px; color:var(--ink-2); }
        .ex-bar .ex-btn { margin-left:auto; padding:7px 14px; font-size:13px; }
        .ex-kind { display:inline-block; font-size:12px; font-weight:900; padding:1px 9px; border-radius:999px; margin-right:6px; vertical-align:1px; color:#fff; }
        .ex-kind.out { background:#2d6a4f; }
        .ex-kind.type { background:#1f5aa6; }
        .ex-kind.blank { background:#8a5a00; }
        .ex-kind.err { background:#a12d2d; }
        .ex-desc { margin:4px 0 8px; line-height:1.7; }
        .ex-file { font-size:12px; font-weight:800; color:var(--ink-2); margin-left:6px; }
        .quiz-item.ex-q .quiz-cat { display:inline-block; min-width:26px; height:24px; line-height:24px; text-align:center; background:var(--main); color:#fff; border-radius:6px; font-size:13px; margin-right:8px; padding:0 4px; }
        .quiz-item.ex-q pre { margin:6px 0 10px; }
        .ex-live .quiz-btn.show, .ex-live .oq-show, .ex-live .ct-show { display:none !important; }
        .ex-rules ul { margin:6px 0 0; padding-left:20px; line-height:1.8; }
        #ex-result .ex-final { font-size:22px; font-weight:900; color:var(--main); margin:12px 0 4px; }
        .ex-admin-head { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
        .ex-admin-head .ex-go-btns { margin-left:auto; display:flex; flex-wrap:wrap; gap:8px; }
        .ex-btn.ghost { background:var(--line); color:var(--ink); }
        .ex-bar .ex-time.low { color:#d9534f; }
        /* 시험 시간 정하기 (관리자 대기 화면) */
        .ex-timed { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin:12px 0 4px; padding:12px; border:1px dashed var(--line); border-radius:12px; }
        .ex-timed label { display:inline-flex; align-items:center; gap:5px; font-weight:800; font-size:14px; }
        .ex-timed input { width:66px; font-size:16px; padding:7px 8px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); text-align:center; }
        .ex-timed .ex-btn { padding:8px 14px; font-size:14px; }
        /* 시간 제한 시험 중 관리자 조작 막대 (화면 하단 고정) */
        .ex-tbar { position:fixed; left:0; right:0; bottom:0; z-index:9998; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--card); border-top:1px solid var(--line); box-shadow:0 -6px 18px rgba(0,0,0,.14); }
        .ex-tbar-in { max-width:980px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; }
        .ex-tbar-left { font-weight:900; font-size:15px; }
        .ex-tbar-left b { font-size:22px; font-variant-numeric:tabular-nums; margin-left:4px; color:var(--main); }
        .ex-tbar.low .ex-tbar-left b { color:#d9534f; }
        .ex-tbar-btns { display:flex; flex-wrap:wrap; gap:6px; }
        .ex-tbar-btns .ex-btn { padding:7px 12px; font-size:13.5px; }
        body.ex-has-tbar { padding-bottom:120px; }
        .ex-timed[hidden], .ex-tbar[hidden], .ex-btn[hidden] { display:none !important; }
        /* 🔢 문제 번호판 (시험 막대 안 · 누르면 펼침) */
        .ex-bar .ex-navbtn { padding:5px 10px; font-size:13px; font-weight:800; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); cursor:pointer; }
        .ex-nav { flex-basis:100%; display:flex; flex-wrap:wrap; gap:6px; padding-top:8px; border-top:1px solid var(--line); }
        .ex-nav[hidden] { display:none; }
        .ex-nav button { width:38px; height:34px; padding:0; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink-2); font-weight:800; font-size:13px; cursor:pointer; }
        .ex-nav button.wr { border-color:var(--main); color:var(--main); border-width:2px; }
        .ex-nav button.ok { background:#2e9d5b; border-color:#2e9d5b; color:#fff; }
        .ex-nav button.no { border:2px solid #d9534f; color:#d9534f; }
        .ex-nav-key i.no { border:2px solid #d9534f; }
        .ex-nav-key { flex-basis:100%; display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; font-size:12px; font-weight:600; color:var(--ink-2); }
        .ex-nav-key i { display:inline-block; width:11px; height:11px; border-radius:3px; border:1px solid var(--line); margin-right:4px; vertical-align:-1px; }
        .ex-nav-key i.ok { background:#2e9d5b; border-color:#2e9d5b; }
        .ex-nav-key i.wr { border:2px solid var(--main); }
        .ex-q { scroll-margin-top:150px; }
        /* 남은 시간 알림 · 시간 바뀜 알림 (화면 위쪽에 잠깐) */
        .ex-toast { position:fixed; left:50%; top:14px; z-index:10000; max-width:calc(100% - 32px); padding:12px 20px; border-radius:14px; background:#d9534f; color:#fff; font-weight:900; font-size:16px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.25); transform:translate(-50%,-160%); transition:transform .3s; pointer-events:none; }
        .ex-toast.on { transform:translate(-50%,0); }
        .ex-toast.info { background:#1f5aa6; }
        /* 📝 혼자 풀기 */
        .ex-bar .ex-solo { font-size:12.5px; padding:2px 9px; border-radius:999px; background:#8a5a00; color:#fff; }
        .ex-solo-note { margin:0 0 14px; padding:12px 14px; border:1px solid #8a5a00; border-radius:14px; background:rgba(138,90,0,.08); font-size:14px; line-height:1.7; }
        .ex-switch { margin:0 0 12px; padding:10px 12px; border-radius:12px; background:rgba(31,90,166,.1); font-size:14px; font-weight:700; }
        .ex-plan { margin:8px 0 4px; font-weight:800; }
        /* 시험 방식 버튼 (혼자 풀기: 눌러서 고름 · 시험 대기실: 잠겨 있고 관리자가 고른 쪽에 실시간으로 색) */
        .ex-mode { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:12px 0 6px; }
        .ex-mode .ex-btn { transition:background-color .35s, color .35s, opacity .35s, box-shadow .35s; }
        .ex-mode.locked .ex-btn { background:var(--line); color:var(--ink-2); opacity:.6; cursor:not-allowed; }
        .ex-mode.locked .ex-btn.on { background:var(--main); color:#fff; opacity:1; box-shadow:0 0 0 3px rgba(31,90,166,.28); }
        .ex-wait-mode-note { margin:2px 0 8px; }
        #ex-solo-tbox { justify-content:center; }
        /* 결과 창: 문제별 정답률 · 복사 */
        .ex-modal-box { max-width:460px; }
        .ex-stats { margin-top:12px; }
        .ex-stats summary { cursor:pointer; font-weight:900; margin-bottom:6px; }
        .ex-modal-box .ex-stat td:nth-child(2) { text-align:left; font-size:13px; }
        .ex-stat tr.low td { color:#d9534f; font-weight:800; }
        .ex-stat small { font-weight:700; color:var(--ink-2); margin-right:4px; }
        .ex-copy { margin-top:10px; width:100%; }
        /* 스터디원 명단 (관리자가 입력 · 여기 있는 이름만 입장) */
        .ex-roster { margin:14px 0 6px; padding:12px; border:1px solid var(--line); border-radius:12px; }
        .ex-roster-head { margin:0 0 8px; font-weight:900; }
        .ex-roster-head small { font-weight:600; color:var(--ink-2); }
        .ex-roster-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
        .ex-chip { display:inline-flex; align-items:center; gap:2px; padding:4px 4px 4px 12px; border-radius:999px; background:var(--line); color:var(--ink); font-weight:800; font-size:14px; }
        .ex-chip.admin { background:#1f5aa6; color:#fff; padding-right:12px; }
        .ex-chip button { border:0; background:transparent; color:inherit; font-size:13px; cursor:pointer; padding:2px 8px; border-radius:999px; }
        .ex-chip button:hover { background:rgba(0,0,0,.12); }
        .ex-roster form { display:flex; gap:8px; flex-wrap:wrap; margin:0; }
        .ex-roster input { flex:1 1 200px; max-width:320px; font-size:15px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
        .ex-roster .ex-btn { padding:8px 14px; font-size:14px; }
        body.ex-has-tbar #mo-top { bottom:calc(110px + env(safe-area-inset-bottom,0px)); }
        .ex-note { font-size:13px; color:var(--ink-2); margin:6px 0 0; }
        .ex-board { width:100%; border-collapse:collapse; margin:12px 0 0; font-size:14px; }
        .ex-board th, .ex-board td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; }
        .ex-board th { font-size:12.5px; color:var(--ink-2); }
        .ex-board td.num { font-variant-numeric:tabular-nums; font-weight:800; }
        .ex-meter { display:inline-block; width:90px; height:8px; border-radius:99px; background:var(--line); vertical-align:middle; margin-left:8px; overflow:hidden; }
        .ex-meter i { display:block; height:100%; background:var(--main); }
        .ex-pill { display:inline-block; font-size:12px; font-weight:800; padding:1px 8px; border-radius:999px; background:var(--line); color:var(--ink-2); }
        .ex-pill.done { background:#2d6a4f; color:#fff; }
        .ex-rank { font-size:16px; font-weight:900; }
        .ex-danger { background:#d9534f !important; }
        .ex-pill.auto { background:#8a5a00; color:#fff; }
        .ex-pill.wait { background:#1f5aa6; color:#fff; }
        .ex-phase { font-size:13px; }
        .ex-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--main); margin-right:8px; vertical-align:1px; animation:exPulse 1.4s ease-in-out infinite; }
        @keyframes exPulse { 0%,100% { opacity:.25; transform:scale(.8); } 50% { opacity:1; transform:scale(1.1); } }
        /* 대기실 명단: 나 → 나머지 가나다순 · 접속 중 = 파란 점 깜빡 · 아직 = 회색 점 */
        .ex-members { list-style:none; padding:0; margin:14px auto 4px; max-width:230px; text-align:left; }
        .ex-members li { display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid var(--line); font-weight:700; }
        .ex-members li:last-child { border-bottom:0; }
        .ex-members li.admin { margin-bottom:12px; padding-bottom:12px; border-bottom:2px solid var(--line); }   /* 관리자와 스터디원 사이를 조금 더 띄움 (2026-10-07) */
        .ex-members small { color:var(--ink-2); font-weight:600; }
        .ex-pres { width:11px; height:11px; border-radius:50%; flex:none; }
        .ex-pres.on { animation:exBlink 1.2s ease-in-out infinite; }
        @keyframes exBlink { 0%,100% { opacity:1; } 50% { opacity:.2; } }
        @media (prefers-reduced-motion: reduce) { .ex-dot, .ex-pres.on { animation:none; } }
        .ex-conn { font-size:12.5px; font-weight:700; color:var(--ink-2); margin:10px 0 0; }
        .ex-conn.bad { color:#d9534f; }
        .ex-bar .ex-conn { margin:0; }
        .ex-ver { margin:10px 0 0; padding:8px 12px; border-radius:10px; background:rgba(217,83,79,.1); font-weight:700; font-size:13.5px; }
        .ex-board .bad { color:#d9534f; font-weight:700; }
        /* 🏁 시험 종료 → 결과 창 (순위 · 이름 · 점수) */
        .ex-modal { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.5); }
        .ex-modal[hidden] { display:none; }
        .ex-modal-box { display:flex; flex-direction:column; width:100%; max-width:400px; max-height:85vh; overflow:hidden; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:18px; padding:20px 18px 16px; box-shadow:0 18px 50px rgba(0,0,0,.3); }
        .ex-modal-box h2 { margin:0 0 4px; text-align:center; }
        #ex-modal-body { overflow:auto; min-height:0; }   /* 사람이 많아도 닫기 버튼은 항상 보이게 */
        .ex-modal-box .ex-board td, .ex-modal-box .ex-board th { text-align:center; }
        .ex-modal-box .ex-board td:nth-child(2) { text-align:left; }
        .ex-modal-box #ex-modal-close { display:block; flex:none; width:100%; margin-top:14px; padding:11px; font-size:15px; }
        /* 시험이 끝난 뒤 📖 내가 푼 문제 보기 (1학기 '시험 종료 · 복습 모드' 모양) */
        .ex-rv-banner { background:#176c3a; color:#fff; border-radius:12px; padding:14px 18px; margin:0 0 16px; font-weight:800; text-align:center; line-height:1.7; }
        .ex-rv-banner label { font-weight:600; font-size:14px; color:#d8efe2; cursor:pointer; }
        .ex-rq { border:1px solid var(--line); border-left:5px solid var(--line); border-radius:12px; padding:14px 16px; margin:14px 0; background:var(--card); }
        .ex-rq.ok { border-left-color:#2e9d5b; }
        .ex-rq.no { border-left-color:#d9534f; }
        .ex-rq-q { font-weight:800; margin:0 0 6px; line-height:1.6; }
        .ex-rq-no { display:inline-block; min-width:26px; height:24px; line-height:24px; text-align:center; background:var(--main); color:#fff; border-radius:6px; font-size:13px; margin-right:8px; padding:0 4px; }
        .ex-rq-tag { font-size:12px; font-weight:800; color:var(--ink-2); margin-left:6px; }
        .ex-rq pre { margin:6px 0; }
        .ex-rq-panel pre { max-height:340px; overflow:auto; }   /* 긴 코드 답만 스크롤 (문제 코드는 다 보이게) */
        .ex-rq-io { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .ex-rq-io b { font-size:12.5px; color:var(--ink-2); }
        .ex-rq-panel { margin-top:10px; padding:10px 12px; border-radius:10px; background:rgba(46,157,91,.09); }
        .ex-rq.no .ex-rq-panel { background:rgba(217,83,79,.09); }
        .ex-rq-verdict { font-weight:900; font-size:15.5px; margin:0 0 4px; }
        .ex-rq.ok .ex-rq-verdict { color:#2e9d5b; }
        .ex-rq.no .ex-rq-verdict { color:#d9534f; }
        .ex-rq-label { font-size:13px; font-weight:800; margin:10px 0 2px; color:var(--ink-2); }
        .ex-rq-why { line-height:1.8; }
        .ex-rv-only .ex-rq.ok, .ex-rv-only section.allok { display:none; }
        @media (max-width:640px) { .ex-rq-io { grid-template-columns:1fr; } }
    </style>
    <style data-theme-skip>
        /* 접속 점 색은 다크 모드 색 바꾸기에서 뺌 (회색이 카드 배경에 묻혀서) */
        .ex-pres.on { background:#1f7ae0; }
        .ex-pres.off { background:#8e949b; }
    </style>
</head>
<body>
<div class="wrap">

    <a class="back-link" href="weeks/자바프로그래밍-8주차-중간고사.html" style="display:inline-block;margin-bottom:14px;color:var(--main);font-weight:800;text-decoration:none;font-size:14px;">← 중간고사 정리로 돌아가기</a>

    <header class="page-head">
        <h1>☕ 자바프로그래밍 · 중간고사 실제시험</h1>
        <p>전공 스터디 · 1~6주차 · 29문제</p>
    </header>

    <section class="card ex-lock" id="ex-lock">
        <h2>🔒 비밀번호</h2>
        <p>스터디원만 풀 수 있어요. 비밀번호를 입력하세요.</p>
        <form id="ex-pin-form" autocomplete="off">
            <input id="ex-pin" type="text" name="ex-code" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="비밀번호" aria-label="비밀번호">
            <button type="button" class="ex-eye" id="ex-eye" aria-label="입력한 숫자 보기" title="입력한 숫자 보기">👁</button>
            <button type="submit">확인</button>
        </form>
        <p class="ex-msg" id="ex-pin-msg"></p>
        <div class="ex-note" id="ex-admin-resume" hidden></div>
    </section>

    <section class="card ex-lock" id="ex-name" hidden>
        <h2>👤 이름 확인</h2>
        <p>스터디원 이름을 입력하고 입장하세요. 관리자가 접속해 있으면 <b>시험 대기실</b>(관리자가 시작을 누르면 문제가 나와요), 없으면 <b>혼자 풀기</b>로 바로 풀 수 있어요.</p>
        <form id="ex-name-form" autocomplete="off">
            <input id="ex-name-in" type="text" placeholder="이름" aria-label="이름" autocapitalize="off">
            <button type="submit">입장</button>
        </form>
        <p class="ex-msg" id="ex-name-msg"></p>
    </section>

    <div id="ex-admin" hidden></div>
    <section class="card ex-lock" id="ex-wait" hidden></section>

    <div id="ex-exam" hidden></div>

    <div class="ex-modal" id="ex-modal" hidden>
        <div class="ex-modal-box" role="dialog" aria-modal="true" aria-labelledby="ex-modal-title">
            <h2 id="ex-modal-title">🏁 시험 결과</h2>
            <div id="ex-modal-body"></div>
            <button class="ex-btn" type="button" id="ex-modal-close">닫기</button>
        </div>
    </div>

    <footer class="page-head" style="margin-top:30px;">
        <p>COPYRIGHT © 2026 HEEGEUN YOON. ALL RIGHTS RESERVED.</p>

async function decrypt(box, pass) {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);

    return JSON.parse(new TextDecoder().decode(pt));
}

function soloBeat(name) {                           // 관리자 화면 대기실 표에 '혼자 풀기'로 보이게 (1분마다)

function offerSolo(P, name, left) {

        $("ex-sh").value = v[0]; $("ex-sm").value = v[1]; $("ex-ss").value = v[2]; $("ex-sm").focus();
    });
    $("ex-solo-cancel").addEventListener("click", () => { $("ex-solo-tbox").hidden = true; });
    $("ex-solo-limit").addEventListener("click", () => {
        const num = (id, max) => { const n = Math.floor(Number($(id).value || 0)); return isNaN(n) || n < 0 ? -1 : Math.min(n, max); };
        const h = num("ex-sh", 23), m = num("ex-sm", 59), x = num("ex-ss", 59);
        if (h < 0 || m < 0 || x < 0) { alert("시간 · 분 · 초는 0 이상의 숫자로 입력해 주세요."); return; }
        const total = h * 3600 + m * 60 + x;
        if (total < 10) { alert("시험 시간은 10초 이상으로 정해 주세요."); return; }
        try { localStorage.setItem(SOLO_LIMIT, JSON.stringify([h, m, x])); } catch (e) { }
        go(total);
    });
}

// ---- 혼자 풀기: 바로 문제 · 관리자가 접속하거나 시험이 시작되면 "관리자가 접속하였어요!" 3초 → 시험 대기실 ----
async function startSolo(P, name, limitSec) {
    SOLO = true;
    const EK = "ex-bk:" + EXAM + ":0:" + name + ":e";   // 혼자 풀기 끝나는 시각 (이 기기 · 새로고침해도 이어서)
    try {
        if (limitSec === undefined) EXAM_ENDS = Number(localStorage.getItem(EK) || 0) || 0;
        else if (limitSec > 0) { EXAM_ENDS = Math.round(nowS() + limitSec * 1000); localStorage.setItem(EK, String(EXAM_ENDS)); }
        else { EXAM_ENDS = 0; localStorage.removeItem(EK); }
    } catch (e) { EXAM_ENDS = limitSec > 0 ? Math.round(nowS() + limitSec * 1000) : 0; }
    if (LAST_PIN) resumeSet(name, "solo");         // 새로고침해도 도전 화면 없이 바로 이어서
    const exam = await startExam(P, name, 0);
    soloBeat(name);
    watchAdmin(() => {
        if (!exam.submitted()) {                   // 푸는 중 → 알림 3초 뒤 대기실 (혼자 풀던 답은 이 기기에 남음 → 다음에 혼자 풀기로 오면 이어서)
            toast("🛡️ 관리자가 접속하였어요! 잠시 뒤 시험 대기실로 바뀌어요", true);
            setTimeout(() => switchMode(name, ""), 3000);
            return;
        }
        // 제출하고 풀이를 보는 중이면 강제로 바꾸지 않고 버튼으로
        $("ex-wait").insertAdjacentHTML("afterbegin", '<p class="ex-switch" id="ex-switch-msg">🛡️ 관리자가 접속하였어요! 풀이를 다 봤으면 <button class="ex-btn" type="button" id="ex-to-lobby" style="padding:6px 12px;font-size:13px">시험 대기실로 가기</button></p>');
        $("ex-to-lobby").addEventListener("click", () => switchMode(name, ""));
        // 그사이 관리자가 시험을 시작하면 → 알림 + 버튼 글자 바꿈 (풀이를 보던 중이라 강제로 옮기지는 않음)
        let rang = false;
        const live = (s) => {
            const d = s.exists() ? s.data() : {};
            if (rang || (d.phase || "ready") !== "live") return;
            rang = true;
            toast("🔔 관리자가 시험을 시작했어요!", true);
            const m = $("ex-switch-msg"); if (m) m.firstChild.textContent = "🔔 시험이 시작됐어요! ";
            const b = $("ex-to-lobby"); if (b) b.textContent = "바로 들어가기";
        };
        onSnapshot(examRef(), live, () => { });
        setInterval(() => getDocFromServer(examRef()).then(live, () => { }), 5000);
    });
}

function loadScript(src) {
    return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src + "?v=" + VER; s.onload = ok; s.onerror = bad; document.body.appendChild(s); });
}
async function startExam(P, name, round) {
    // 서버에서 내 기록을 가져온다 — 다른 기기에서 풀던 것도 이어서
    // (round 는 화면에 안 보이는 시험 번호 — 관리자가 새로 시작하면 +1 → 열려 있던 기기가 새 시험에 옛 답을 쓰지 못하게 막는 용도)
    let att = null, ref = null;
    const SOLO_KEY = "ex-bk:" + EXAM + ":0:" + name;   // 혼자 풀기 답 · 맞힘 · 시작 시각 (이 기기에만)
    if (ONLINE && !SOLO) {
        ref = attRef(round, name);
        const snap = await getDoc(ref);
        if (snap.exists()) att = snap.data();
        else {
            att = { name, round, total: P.total, score: 0, solved: {}, answers: {}, submitted: false, startedAt: new Date().toISOString(), updatedAt: serverTimestamp() };
            await setDoc(ref, att);
        }
    } else {
        let t0 = new Date().toISOString(), sv = {};
        if (SOLO) { try { t0 = localStorage.getItem(SOLO_KEY + ":t") || t0; sv = JSON.parse(localStorage.getItem(SOLO_KEY + ":s") || "{}") || {}; localStorage.setItem(SOLO_KEY + ":t", t0); } catch (e) { } }
        att = { name, round, total: P.total, score: 0, solved: sv, answers: {}, submitted: false, startedAt: t0 };
    }
    clearLocalAnswers();                       // 이 기기에 남은 다른 사람의 답은 지우고, 서버 기록으로 채운다

    $("ex-name").hidden = true; $("ex-wait").hidden = true;
    const root = $("ex-exam");
    root.innerHTML = '<div class="ex-bar" id="ex-bar"><span>👤 ' + esc(name) + '</span>' + (SOLO ? '<span class="ex-solo">📝 혼자 풀기</span>' : "") + '<span class="ex-score" id="ex-score">✅ 0 / ' + P.total + '</span><span class="ex-time" id="ex-time">⏱ 00:00</span><span class="ex-sync" id="ex-sync"></span>' + (SOLO ? "" : '<span class="ex-conn short"></span>')
        + '<button class="ex-navbtn" type="button" id="ex-navbtn" aria-expanded="false">🔢 번호</button>'
        + (ADMIN_MODE ? '<a class="ex-to-admin" href="#ex-admin">🛡️ 점수판</a>' : "") + '<button class="ex-btn" type="button" id="ex-bar-submit">제출</button><div class="ex-nav" id="ex-nav" hidden></div></div>'
        + (SOLO ? '<div class="ex-solo-note">📝 <b>혼자 풀기</b> — 지금은 관리자가 접속해 있지 않아서 바로 풀 수 있어요. 점수는 서버에 저장되지 않고 <b>이 기기에만</b> 남아요 (새로고침해도 이어서). <b>제출하면 바로 정답과 풀이</b>를 볼 수 있어요. 관리자가 접속하면 시험 대기실로 바뀌어요.</div>' : "")
        + P.html;
    root.hidden = false;
    if (!att.submitted) document.body.classList.add("ex-live");
    if (!ONLINE) $("ex-sync").textContent = "○ 서버 연결 전 — 점수가 저장되지 않아요";
    else if (SOLO) $("ex-sync").textContent = "○ 이 기기에만 저장";
    setConn(false);
    // 쓴 답 임시 보관 (이 기기 · 이번 시험 동안만) — 인터넷이 끊긴 채 새로고침해도 서버에 없는 답은 되살림 · 시험이 끝나면 지움
    const BK = "ex-bk:" + EXAM + ":" + round + ":" + name;
    let bk = {};
    try {
        Object.keys(localStorage).forEach((k) => { if (k.indexOf("ex-bk:") === 0 && k !== BK && k.indexOf(SOLO_KEY) !== 0) localStorage.removeItem(k); });   // 지난 시험 것은 지움 (혼자 풀기 답은 남김)
        bk = JSON.parse(localStorage.getItem(BK) || "{}") || {};
    } catch (e) { bk = {}; }
    const backup = (id, v) => { bk[id] = v; try { localStorage.setItem(BK, JSON.stringify(bk)); } catch (e) { } };
    const dropBackup = () => { try { localStorage.removeItem(BK); if (SOLO) { localStorage.removeItem(BK + ":s"); localStorage.removeItem(BK + ":t"); localStorage.removeItem(BK + ":e"); } } catch (e) { } };

    const started = new Date(att.startedAt).getTime();
    // 경과 시간: 시험 시작(서버 시각)부터 서버 시계로 → 모두 같은 숫자 · 제출했으면 제출할 때 잰 값 그대로
    const elapsed = () => {
        if (att.submitted && typeof att.elapsed === "number") return att.elapsed;
        if (EXAM_START) return Math.max(0, (nowS() - EXAM_START) / 1000);
        return ((att.submitted && att.submittedAt ? new Date(att.submittedAt).getTime() : Date.now()) - started) / 1000;   // 시작 시각을 아직 못 받았을 때만
    };
    const qs = () => [...root.querySelectorAll(".ex-q")];
    const isSolved = (q) => q.dataset.solved === "1" || q.dataset.passed === "1";
    const score = () => qs().filter(isSolved).length;
    const answerOf = (q) => {                  // 코드 작성 칸에 미리 써 둔 뼈대 그대로면 안 쓴 것으로
        const el = q.querySelector(".oq-ans, .ct-code, .quiz-item input");
        return !el || (el.defaultValue.trim() && el.value.trim() === el.defaultValue.trim()) ? "" : el.value;
    };

    // ---- 서버에 저장 (답 · 맞힘 여부 · 점수) ----
    let pending = {}, timer = null;
    function queue(patch) {                    // 여러 문제의 답을 한 번에 보낼 때 answers 는 문제별로 합친다
        Object.keys(patch).forEach((k) => {
            if (k === "answers") pending.answers = Object.assign(pending.answers || {}, patch.answers);
            else pending[k] = patch[k];
        });
    }
    function save(patch) {
        if (!ONLINE || SOLO || att.submitted) return;
        queue(patch);
        clearTimeout(timer);
        timer = setTimeout(flush, 800);
    }
    async function flush() {
        const p = pending; pending = {};
        if (!Object.keys(p).length) return;
        p.updatedAt = serverTimestamp();
        try { await setDoc(ref, p, { merge: true }); $("ex-sync").textContent = "● 저장됨"; setConn(true); }
        catch (err) {
            $("ex-sync").textContent = "🔴 저장 안 됨 — 자동으로 다시 보내는 중 (" + (err.code || "") + ")";
            if (err.code === "permission-denied") return;   // 제출됐거나 초기화됨
            const later = pending; pending = {}; delete p.updatedAt; queue(p); queue(later);
            clearTimeout(timer); timer = setTimeout(flush, 3000);
        }
    }
    const kick = () => { if (Object.keys(pending).length && !att.submitted) { clearTimeout(timer); flush(); } };   // 인터넷이 돌아오거나 화면으로 돌아오면 바로 다시 보냄
    window.addEventListener("online", kick);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });
    let last = -1;
    function refresh() {
        if (att.submitted || !$("ex-score")) return;
        const s = score();
        $("ex-score").textContent = "✅ " + s + " / " + P.total;
        if (s !== last) {
            last = s;
            const solved = {}; qs().forEach((q) => { solved[q.id] = isSolved(q); });
            save({ score: s, solved, elapsed: Math.round(elapsed()) });
            if (SOLO) try { localStorage.setItem(BK + ":s", JSON.stringify(solved)); } catch (e) { }
        }
        navDraw();
    }
    // ---- 🔢 문제 번호판: 맞힘(초록) · 답 씀(테두리) · 안 씀 → 누르면 그 문제로 ----
    const numOf = (q) => ((q.querySelector(".oq-no, .ct-no, .quiz-cat") || {}).textContent || "").trim();
    function navDraw() {
        const box = $("ex-nav");
        if (!box || box.hidden) return;
        const LABEL = { ok: " · 맞힘", no: " · 틀림 (마지막 확인)", wr: " · 답 씀", "": " · 안 씀" };
        box.innerHTML = qs().map((q) => { const st = isSolved(q) ? "ok" : q.dataset.wrong === "1" ? "no" : answerOf(q).trim() ? "wr" : ""; return '<button type="button" class="' + st + '" data-go="' + q.id + '" title="' + numOf(q) + "번" + LABEL[st] + '">' + numOf(q) + "</button>"; }).join("")
            + '<span class="ex-nav-key"><span><i class="ok"></i>맞힘</span><span><i class="no"></i>틀림</span><span><i class="wr"></i>답 씀 (확인 전)</span><span><i></i>안 씀</span></span>';
    }
    function goQ(id) {
        const q = document.getElementById(id);
        if (!q) return;
        $("ex-nav").hidden = true; $("ex-navbtn").setAttribute("aria-expanded", "false");
        q.scrollIntoView({ behavior: "smooth", block: "start" });
        const f = q.querySelector(".oq-ans, .ct-code, .quiz-item input");
        if (f) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { } }, 450);
    }
    $("ex-navbtn").addEventListener("click", () => {
        const box = $("ex-nav"); box.hidden = !box.hidden;
        $("ex-navbtn").setAttribute("aria-expanded", box.hidden ? "false" : "true");
        navDraw();
    });
    $("ex-nav").addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) goQ(b.dataset.go); });
    let prevLeft = null;
    const tick = setInterval(() => {
        const t = $("ex-time");
        if (EXAM_ENDS && !att.submitted) {     // 시간 제한 시험: 남은 시간 (1분 안 남으면 빨간색)
            const left = (EXAM_ENDS - nowS()) / 1000;
            if (prevLeft !== null) {               // 5분 · 1분 남음 알림 (그 시점을 지날 때 한 번)
                if (prevLeft > 300 && left <= 300 && left > 60) toast("⏰ " + Math.ceil(left / 60) + "분 남았어요");
                else if (prevLeft > 60 && left <= 60 && left > 0) toast("⏰ 1분 남았어요 — 답을 확인하세요");
            }
            prevLeft = left;
            if (t) { t.textContent = "⏳ 남은 " + mmss(Math.max(0, left)); t.classList.toggle("low", left < 60); }
            if (left < -2 && !ended) end("time");  // 시간이 끝남 → 지금 답으로 자동 제출 (관리자 화면이 닫혀 있어도 · 2초 여유)
            return;
        }
        if (t) { t.textContent = "⏱ " + mmss(elapsed()); t.classList.remove("low"); }
    }, 1000);

    // 제출 · 종료 때 지금 화면의 답과 맞힘 여부를 기록 (풀이 보기용 — 어디에도 저장하지 않고 이 창의 메모리에만)
    let rec = null, mo = null, ended = false;
    function record() {
        const answers = Object.assign({}, att.answers || {}), solved = {};
        qs().forEach((q) => { const v = answerOf(q); if (v) answers[q.id] = v; solved[q.id] = isSolved(q); });
        return { name, total: P.total, score: att.score, auto: !!att.auto, answers, solved, round, at: new Date().toISOString() };
    }
    function closeOut() {                      // 시험 화면을 닫음 (임시 보관한 답도 지움 — 시험 뒤에는 아무것도 저장하지 않음)
        rec = record(); dropBackup(); clearLocalAnswers();
        clearInterval(tick); clearTimeout(timer); if (mo) mo.disconnect();
        document.body.classList.remove("ex-live");
    }
    async function submit() {
        if (att.submitted) return;
        const s = score();
        const empty = qs().filter((q) => !answerOf(q).trim());    // 답을 안 쓴 문제
        const warn = empty.length ? "⚠️ 아직 답을 안 쓴 문제 " + empty.length + "개: " + empty.map(numOf).join(", ") + "번\n(취소하면 첫 번째 문제로 가요)\n\n" : "";
        if (!confirm(warn + "제출할까요?\n제출하면 답이 확정되고 더 이상 바꿀 수 없어요.\n" + (SOLO ? "혼자 풀기라 제출하면 바로 정답과 풀이를 볼 수 있어요." : "정답과 풀이는 시험이 끝나면 볼 수 있어요."))) {
            if (empty.length) goQ(empty[0].id);
            return;
        }
        const done = { submitted: true, score: s, submittedAt: new Date().toISOString(), elapsed: Math.round(elapsed()) };
        if (ONLINE && !SOLO) {
            clearTimeout(timer); await flush();
            try { await setDoc(ref, Object.assign({ updatedAt: serverTimestamp() }, done), { merge: true }); }
            catch (err) { alert("제출을 서버에 저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."); return; }
        }
        Object.assign(att, done);
        closeOut();
        if (SOLO) showFinished(P, rec, "📝 혼자 풀기 결과예요 (서버에는 저장되지 않아요)."); else showSubmitted(rec);
    }
    // 시험 종료 → (아직 안 냈으면 묻지 않고 지금 답으로 제출) → 🎉 수고하셨습니다
    async function end(why) {
        if (ended) return;
        ended = true;
        if (!att.submitted) {
            const done = { submitted: true, score: score(), submittedAt: new Date().toISOString(), elapsed: Math.round(elapsed()), auto: true };
            if (ONLINE && !SOLO) {
                clearTimeout(timer); await flush();
                try { await setDoc(ref, Object.assign({ updatedAt: serverTimestamp() }, done), { merge: true }); }

    return { submitted: () => att.submitted, end };
}

        }, () => { });

                $("ex-wait").insertAdjacentHTML("beforeend", '<p class="ex-note">⚠️ 문제를 불러오지 못해 다시 시도하는 중… (' + esc(err && (err.code || err.message) || err) + ")</p>");
            }
            return;
        }
        if (phase === "ended") {
            stopBeat();
            const mine = await getDoc(attRef(r, name));
            if (mine.exists()) { state = "exam"; ran = true; exam = await startExam(P, name, r); state = "done"; await exam.end(); return; }
        }
        if (phase === "ended") { state = "ended"; showWait(name, "ended"); return; }

    }
    // 시험 상태는 실시간 알림 + 5초마다 서버 직접 확인 둘 다로 받음 (아이패드 Safari 는 탭 전환 · 화면 꺼짐 뒤 실시간 연결이 멈춰서 시작을 놓친 적 있음)
    //  단계 번호(시험 번호 × 3 + 대기 0 · 시험 중 1 · 종료 2)는 늘기만 하니, 늦게 도착한 예전 상태는 버림 (시험 중인데 '대기'가 늦게 와서 끝나 버리지 않게)
    let seen = -1;
    const stage = (s) => { const d = s.exists() ? s.data() : {}; return (d.round || 1) * 3 + ({ ready: 0, live: 1, ended: 2 }[d.phase || "ready"] || 0); };
    const feed = (s) => {

        const run = chain.then(() => onExam(s));

    };
    await new Promise((ok, bad) => {
        let first = true;
        onSnapshot(examRef(), (s) => {
            feed(s).then(() => { if (first) { first = false; ok(); } }, (err) => { if (first) { first = false; bad(err); } });
        }, (err) => { if (first) { first = false; bad(err); } });
    });
    const poll = () => getDocFromServer(examRef()).then((s) => feed(s).catch(() => { }), () => setConn(false));
    setInterval(poll, 5000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
}

            });
        }
        box.innerHTML = h + "</table>" + (show ? "" : '<p class="ex-note">제출 ' + rows.filter((r) => r.submitted).length + " / " + rows.length + "명</p>");
    }
    onSnapshot(collection(db, "exams", EXAM, "lobby"), (qs) => {
        lobby = qs.docs.map((x) => x.data()).sort((a, b) => String(a.name).localeCompare(String(b.name), "ko"));
        lobbyErr = ""; draw();
    }, (err) => { lobbyErr = err.code || err.message; draw(); });
    setInterval(draw, 10000);                      // '…초 전' · 연결 상태 갱신
    // 시험 문서: 실시간 + 5초마다 서버 직접 확인 (관리자 기기도 실시간 연결이 멈출 수 있음) · 늦게 온 예전 상태는 버림
    function applyExam(s) {
        const d = s.data() || {};
        const k = (d.round || 1) * 3 + ({ ready: 0, live: 1, ended: 2 }[d.phase || "ready"] || 0);
        if (k < seenStage) return;
        seenStage = k;
        phase = d.phase || "ready"; pageVer = d.pageVer || ""; endsAt = phase === "live" && typeof d.endsAt === "number" ? d.endsAt : 0;
        if (phase !== "ready" && d.startedAt && d.startedAt.toMillis) examStart = d.startedAt.toMillis();
        setPhaseUI();
        if (firstSnap && phase === "ready" && typeof d.plannedSec === "number" && d.plannedSec > 0 && $("ex-timed").hidden) {
            const v = d.plannedSec; $("ex-th").value = Math.floor(v / 3600); $("ex-tm").value = Math.floor(v % 3600 / 60); $("ex-ts").value = v % 60; $("ex-timed").hidden = false;
        }
        const nr = Array.isArray(d.roster) ? d.roster : null;
        if (JSON.stringify(nr) !== JSON.stringify(roster)) { roster = nr; renderRoster(); draw(); }
        if ((d.round || 1) !== round || !unsubRows) {
            round = d.round || 1; rows = [];
            if (unsubRows) unsubRows();
            unsubRows = onSnapshot(query(collection(db, "exams", EXAM, "attempts"), where("round", "==", round)), (qs) => {
                rows = qs.docs.map((x) => x.data());
                draw();
            }, (err) => { $("ex-admin-status").textContent = "○ 점수판을 불러오지 못했어요 (" + (err.code || err.message) + ")"; });
        }
        draw();
        // 종료 정리 중에 창을 닫았으면, 다시 열었을 때 이어서 정리
        if (firstSnap && phase === "ended") finishExam(false);
        firstSnap = false;
    }
    onSnapshot(examRef(), applyExam);
    // 관리자 접속 신호 (15초마다 · 창을 닫으면 지움) → 친구들: 접속해 있으면 시험 대기실, 없으면 혼자 풀기
    const beatAdmin = () => updateDoc(examRef(), { ["admins." + ADMIN_DEV]: { at: serverTimestamp(), ttl: document.hidden ? 180 : 30 } }).catch(() => { });
    setInterval(beatAdmin, 10000);
    document.addEventListener("visibilitychange", beatAdmin);   // 탭이 가려지면 넉넉히(180초) · 다시 보이면 바로 신호
    window.addEventListener("pagehide", () => { updateDoc(examRef(), { ["admins." + ADMIN_DEV]: deleteField() }).catch(() => { }); });   // 창을 닫으면 내 칸만 지움
    adminPlay().catch((err) => {                   // 점수판 아래에서 내 이름으로 같이 풀기
        const box = $("ex-play-setup"); box.hidden = false;
        box.innerHTML = '<p class="ex-msg no">⚠️ 같이 풀기를 열지 못했어요 (' + esc(err && (err.code || err.message) || err) + ') — 새로고침해 주세요. 점수판 · 시작 · 종료는 그대로 돼요.</p>';
    });
    setInterval(async () => {
        try {
            applyExam(await getDocFromServer(examRef()));
            rows = (await getDocsFromServer(query(collection(db, "exams", EXAM, "attempts"), where("round", "==", round)))).docs.map((x) => x.data());
            try { lobby = (await getDocsFromServer(collection(db, "exams", EXAM, "lobby"))).docs.map((x) => x.data()).sort((a, b) => String(a.name).localeCompare(String(b.name), "ko")); lobbyErr = ""; }
            catch (e) { lobbyErr = e.code || e.message; }
            draw();
        } catch (e) { $("ex-admin-status").textContent = "🔴 서버 연결 끊김 — 다시 연결하는 중 (" + (e.code || e.message) + ")"; }
    }, 5000);
}
</script>
</body>
</html>
