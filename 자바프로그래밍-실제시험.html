<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="theme.js?v=202609301805"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>자바프로그래밍 · 중간고사 실제시험</title>
    <link rel="stylesheet" href="style.css?v=202609301805">
    <style>
        pre.io { background:#0f1b14; }
        pre.io::before { content:"▶ 실행 화면"; color:#7fd49a; }
        pre.io code { color:#dff5e6; }
        .ex-lock { max-width:440px; margin:26px auto; text-align:center; }
        .ex-lock form { display:flex; gap:8px; justify-content:center; margin:14px 0 6px; }
        .ex-lock input { flex:1 1 auto; min-width:0; max-width:240px; font-size:18px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); text-align:center; }
        /* 비밀번호 칸을 type=password 로 두면 브라우저가 "비밀번호 저장" → 다음에 자동으로 채워 넣어서, 그 뒤에 친 숫자가 이어 붙음 → 틀림. 그래서 text 칸 + 점 가리기 */
        #ex-pin { -webkit-text-security:disc; text-security:disc; }
        #ex-pin.show { -webkit-text-security:none; text-security:none; }
        .ex-lock .ex-eye { padding:10px 12px; background:var(--card); color:var(--ink); border:1px solid var(--line); font-size:16px; }
        .ex-lock .ex-eye.on { background:var(--main); color:#fff; border-color:var(--main); }
        .ex-btn, .ex-lock button { font-size:15px; font-weight:800; padding:10px 18px; border:0; border-radius:12px; background:var(--main); color:#fff; cursor:pointer; }
        .ex-btn:disabled, .ex-lock button:disabled { opacity:.55; cursor:default; }
        .ex-msg { min-height:22px; font-weight:800; margin:6px 0 0; }
        .ex-msg.no { color:#d9534f; }
        .ex-msg.info { color:var(--ink-2); font-weight:600; }
        .ex-bar { position:sticky; top:62px; z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin:0 0 14px; padding:10px 14px; padding-right:62px; border:1px solid var(--line); border-radius:14px; background:var(--card); box-shadow:0 6px 18px rgba(0,0,0,.08); font-weight:800; font-size:14px; }
        .ex-bar .ex-score { color:var(--main); }
        .ex-bar .ex-time { font-variant-numeric:tabular-nums; color:var(--ink-2); }
        .ex-bar .ex-sync { font-weight:600; font-size:12px; color:var(--ink-2); }
        .ex-bar .ex-btn { margin-left:auto; padding:7px 14px; font-size:13px; }
        .ex-kind { display:inline-block; font-size:12px; font-weight:900; padding:1px 9px; border-radius:999px; margin-right:6px; vertical-align:1px; color:#fff; }
        .ex-kind.out { background:#2d6a4f; }
        .ex-kind.type { background:#1f5aa6; }
        .ex-kind.blank { background:#8a5a00; }
        .ex-desc { margin:4px 0 8px; line-height:1.7; }
        .ex-file { font-size:12px; font-weight:800; color:var(--ink-2); margin-left:6px; }
        .quiz-item.ex-q .quiz-cat { display:inline-block; min-width:26px; height:24px; line-height:24px; text-align:center; background:var(--main); color:#fff; border-radius:6px; font-size:13px; margin-right:8px; padding:0 4px; }
        .quiz-item.ex-q pre { margin:6px 0 10px; }
        .ex-live .quiz-btn.show, .ex-live .oq-show, .ex-live .ct-show { display:none !important; }
        .ex-rules ul { margin:6px 0 0; padding-left:20px; line-height:1.8; }
        #ex-result .ex-final { font-size:22px; font-weight:900; color:var(--main); margin:12px 0 4px; }
        .ex-admin-head { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
        .ex-admin-head .ex-btn { margin-left:auto; }
        .ex-note { font-size:13px; color:var(--ink-2); margin:6px 0 0; }
        .ex-board { width:100%; border-collapse:collapse; margin:12px 0 0; font-size:14px; }
        .ex-board th, .ex-board td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; }
        .ex-board th { font-size:12.5px; color:var(--ink-2); }
        .ex-board td.num { font-variant-numeric:tabular-nums; font-weight:800; }
        .ex-meter { display:inline-block; width:90px; height:8px; border-radius:99px; background:var(--line); vertical-align:middle; margin-left:8px; overflow:hidden; }
        .ex-meter i { display:block; height:100%; background:var(--main); }
        .ex-pill { display:inline-block; font-size:12px; font-weight:800; padding:1px 8px; border-radius:999px; background:var(--line); color:var(--ink-2); }
        .ex-pill.done { background:#2d6a4f; color:#fff; }
        .ex-rank { font-size:16px; font-weight:900; }
        .ex-danger { background:#d9534f !important; }
        .ex-pill.auto { background:#8a5a00; color:#fff; }
        .ex-pill.wait { background:#1f5aa6; color:#fff; }
        .ex-phase { font-size:13px; }
        .ex-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--main); margin-right:8px; vertical-align:1px; animation:exPulse 1.4s ease-in-out infinite; }
        @keyframes exPulse { 0%,100% { opacity:.25; transform:scale(.8); } 50% { opacity:1; transform:scale(1.1); } }
        @media (prefers-reduced-motion: reduce) { .ex-dot { animation:none; } }
        /* 🏁 시험 종료 → 결과 창 (순위 · 이름 · 점수) */
        .ex-modal { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.5); }
        .ex-modal[hidden] { display:none; }
        .ex-modal-box { display:flex; flex-direction:column; width:100%; max-width:400px; max-height:85vh; overflow:hidden; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:18px; padding:20px 18px 16px; box-shadow:0 18px 50px rgba(0,0,0,.3); }
        .ex-modal-box h2 { margin:0 0 4px; text-align:center; }
        #ex-modal-body { overflow:auto; min-height:0; }   /* 사람이 많아도 닫기 버튼은 항상 보이게 */
        .ex-modal-box .ex-board td, .ex-modal-box .ex-board th { text-align:center; }
        .ex-modal-box .ex-board td:nth-child(2) { text-align:left; }
        .ex-modal-box #ex-modal-close { display:block; flex:none; width:100%; margin-top:14px; padding:11px; font-size:15px; }
        .ex-admin-head .ex-last { margin-left:0; background:var(--card); color:var(--ink); border:1px solid var(--line); }
    </style>
</head>

<div class="wrap">

    <a class="back-link" href="weeks/자바프로그래밍-8주차-중간고사.html" style="display:inline-block;margin-bottom:14px;color:var(--main);font-weight:800;text-decoration:none;font-size:14px;">← 중간고사 정리로 돌아가기</a>

    <header class="page-head">
        <h1>☕ 자바프로그래밍 · 중간고사 실제시험</h1>
        <p>전공 스터디 · 1~6주차 · 27문제</p>
    </header>

    <section class="card ex-lock" id="ex-lock">
        <h2>🔒 비밀번호</h2>
        <p>스터디원만 풀 수 있어요. 비밀번호를 입력하세요.</p>
        <form id="ex-pin-form" autocomplete="off">
            <input id="ex-pin" type="text" name="ex-code" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="비밀번호" aria-label="비밀번호">
            <button type="button" class="ex-eye" id="ex-eye" aria-label="입력한 숫자 보기" title="입력한 숫자 보기">👁</button>
            <button type="submit">확인</button>
        </form>
        <p class="ex-msg" id="ex-pin-msg"></p>
        <div class="ex-note" id="ex-admin-resume" hidden></div>
    </section>

    <section class="card ex-lock" id="ex-name" hidden>
        <h2>👤 이름 확인</h2>
        <p>스터디원 이름을 입력하고 입장하세요. 관리자가 <b>시험 시작</b>을 누르면 문제가 나와요. 다른 기기에서 풀던 시험도 같은 이름으로 이어서 풀 수 있어요.</p>
        <form id="ex-name-form" autocomplete="off">
            <input id="ex-name-in" type="text" placeholder="이름" aria-label="이름" autocapitalize="off">
            <button type="submit">입장</button>
        </form>
        <p class="ex-msg" id="ex-name-msg"></p>
    </section>

    <section class="card ex-lock" id="ex-wait" hidden></section>

    <div id="ex-exam" hidden></div>
    <div id="ex-admin" hidden></div>

    <div class="ex-modal" id="ex-modal" hidden>
        <div class="ex-modal-box" role="dialog" aria-modal="true" aria-labelledby="ex-modal-title">
            <h2 id="ex-modal-title">🏁 시험 결과</h2>
            <div id="ex-modal-body"></div>
            <button class="ex-btn" type="button" id="ex-modal-close">닫기</button>
        </div>
    </div>

    <footer class="page-head" style="margin-top:30px;">
        <p>COPYRIGHT © 2026 HEEGEUN YOON. ALL RIGHTS RESERVED.</p>
    </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, query, where, getDocs, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const D = window.EX_DATA, FB = window.EX_FB || {};
const $ = (id) => document.getElementById(id);
const VER = (document.querySelector('script[src^="theme.js"]').getAttribute("src").split("v=")[1] || "");
const EXAM = D.examId;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function mmss(sec) { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(s).padStart(2, "0"); }
function b64(s) { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

// ---- Firebase (서버) ----
const ONLINE = !!(FB.config && FB.config.apiKey);
let auth = null, db = null;
if (ONLINE) {
    const app = initializeApp(FB.config);
    auth = getAuth(app);
    db = getFirestore(app);
}
const examRef = () => doc(db, "exams", EXAM);
const attRef = (round, name) => doc(db, "exams", EXAM, "attempts", round + "_" + name);
const lobbyRef = (name) => doc(db, "exams", EXAM, "lobby", name);   // 대기실 (입장했다는 표시 — 관리자만 목록을 봄)
function authReady() { return new Promise((res) => { const off = onAuthStateChanged(auth, (u) => { off(); res(u); }); }); }
async function ensureUser() {
    const u = await authReady();
    if (u) return u;
    return (await signInAnonymously(auth)).user;
}
function clearLocalAnswers() {
    try { Object.keys(localStorage).forEach((k) => { if (/^(oq|ct):/.test(k) && k.indexOf(location.pathname) >= 0) localStorage.removeItem(k); }); } catch (e) { }
}

// ---- 비밀번호로 문제 풀기 (PBKDF2 → AES-GCM) ----
async function decrypt(box, pass) {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(box.s), iterations: D.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.i) }, key, b64(box.c));
    return JSON.parse(new TextDecoder().decode(pt));
}
// 브라우저가 예전에 저장한 값을 채워 넣었을 수 있으니 페이지를 열 때마다 비움 (뒤로 가기로 돌아와도)
function clearPin() { const i = $("ex-pin"); if (i && !$("ex-lock").hidden) i.value = ""; }
clearPin(); setTimeout(clearPin, 300); window.addEventListener("pageshow", clearPin);
$("ex-eye").addEventListener("click", () => { const on = $("ex-pin").classList.toggle("show"); $("ex-eye").classList.toggle("on", on); $("ex-pin").focus(); });
// ---- 이 기기에 관리자 로그인이 남아 있으면 코드를 다시 치지 않고 바로 열기 ----
//  Firebase 가 로그인 상태를 기기에 저장해 둠. 서버의 관리자 계정이 바뀌면(비밀번호 변경 · 삭제 후 다시 만듦 · 삭제) 이 저장이 저절로 풀림
//  → 로그아웃을 누르지 않았는데 풀렸으면 "서버 계정이 바뀌었다"는 뜻이라 화면에 알려 줌 (코드가 틀렸다고 나올 때 원인 찾기용)
const ADMIN_SEEN = "ex-admin-seen";
const seen = (v) => { try { if (v === undefined) return localStorage.getItem(ADMIN_SEEN); if (v) localStorage.setItem(ADMIN_SEEN, v); else localStorage.removeItem(ADMIN_SEEN); } catch (e) { } };
function isAdminUser(u) { return !!u && !u.isAnonymous && u.email === FB.adminEmail; }
function lostNote(why) {
    const box = $("ex-admin-resume"); box.hidden = false;
    box.innerHTML = "⚠️ 이 기기에 저장돼 있던 관리자 로그인이 풀렸어요" + (why ? " (" + esc(why) + ")" : "") + " — 로그아웃을 누르지 않았다면 <b>서버의 관리자 계정이 바뀐 것</b>(비밀번호 변경 · 삭제 · 다시 만듦)이에요. 관리자 코드를 다시 치고, 그래도 틀리면 콘솔 사용자 목록의 <b>생성 날짜 · 최종 로그인 날짜</b>를 확인하세요. (마지막 성공: " + esc(seen() || "-") + ")";
}
if (ONLINE) authReady().then((u) => {
    if (!isAdminUser(u)) { if (seen()) lostNote(""); return; }
    const box = $("ex-admin-resume"); box.hidden = false;
    box.innerHTML = '<button class="ex-btn" type="button" id="ex-admin-go" style="margin-top:8px">🛡️ 관리자 화면 열기</button><br>이 기기에 관리자로 로그인돼 있어요 · 학교 컴퓨터라면 쓰고 나서 맨 아래 <b>로그아웃</b>';
    $("ex-admin-go").addEventListener("click", async () => {
        try { await u.getIdToken(true); openAdmin(u); }          // 서버에 아직 유효한지 확인 (계정이 바뀌었으면 여기서 실패)
        catch (err) { await signOut(auth).catch(() => { }); lostNote(err.code || err.message); }
    });
});
$("ex-pin-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pin = $("ex-pin").value.trim(), msg = $("ex-pin-msg"), btn = e.target.querySelector("button[type=submit]");
    if (!pin) return;
    if (!window.crypto || !crypto.subtle) { msg.className = "ex-msg no"; msg.textContent = "이 브라우저에서는 열 수 없어요 (https 주소로 열어 주세요)"; return; }
    btn.disabled = true; msg.className = "ex-msg info"; msg.textContent = "확인 중…";
    let P = null, adminErr = "";
    try { P = await decrypt(D.exam, pin); } catch (err) { }
    if (P) { btn.disabled = false; msg.textContent = ""; askName(P); return; }
    // 시험 비밀번호가 아니면 관리자 코드인지 확인 (관리자 코드 = 서버의 관리자 계정 비밀번호 — 페이지에는 없음)
    if (ONLINE && pin.length >= 6) {
        try {
            const u = (await signInWithEmailAndPassword(auth, FB.adminEmail, pin)).user;
            btn.disabled = false; msg.textContent = ""; seen(new Date().toLocaleString("ko-KR")); openAdmin(u); return;
        } catch (err) {
            adminErr = (err.code || err.message) + " · " + new Date().toLocaleTimeString("ko-KR");
            if (err.code === "auth/too-many-requests") { btn.disabled = false; msg.className = "ex-msg no"; msg.textContent = "너무 여러 번 틀려서 잠시 막혔어요. 몇 분 뒤 다시 해 주세요."; return; }
            if (err.code === "auth/network-request-failed") { btn.disabled = false; msg.className = "ex-msg no"; msg.textContent = "서버에 연결하지 못했어요 — 인터넷 연결을 확인해 주세요."; return; }
            if (err.code === "auth/operation-not-allowed") { btn.disabled = false; msg.className = "ex-msg no"; msg.textContent = "관리자 로그인이 꺼져 있어요 — Firebase Authentication → 로그인 방법에서 '이메일/비밀번호'를 켜 주세요."; return; }
            if (!/invalid-credential|wrong-password|user-not-found|invalid-login-credentials|invalid-password/.test(err.code || "")) {
                btn.disabled = false; msg.className = "ex-msg no"; msg.textContent = "관리자 로그인 실패 (" + (err.code || err.message) + ")"; return;
            }
        }
    }
    btn.disabled = false; msg.className = "ex-msg no"; msg.textContent = "비밀번호가 틀렸어요. (👁 를 눌러 입력한 숫자를 확인해 보세요)"; if (adminErr) msg.insertAdjacentHTML("beforeend", '<br><span class="ex-note">서버 응답: ' + esc(adminErr) + "</span>"); $("ex-pin").select();
});

// ---- 이름 확인 (스터디 명단과 하나라도 다르면 다시 입력) ----
function askName(P) {
    $("ex-lock").hidden = true;
    $("ex-name").hidden = false;
    $("ex-name-in").focus();
    $("ex-name-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = $("ex-name-in").value.replace(/\s+/g, "");

// ---- 시험 ----
function loadScript(src) {
    return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src + "?v=" + VER; s.onload = ok; s.onerror = bad; document.body.appendChild(s); });
}
async function startExam(P, name, round) {
    // 서버에서 내 기록을 가져온다 — 다른 기기에서 풀던 것도 이어서
    // (round 는 화면에 안 보이는 시험 번호 — 관리자가 새로 시작하면 +1 → 열려 있던 기기가 새 시험에 옛 답을 쓰지 못하게 막는 용도)
    let att = null, ref = null;
    if (ONLINE) {
        ref = attRef(round, name);
        const snap = await getDoc(ref);
        if (snap.exists()) att = snap.data();
        else {
            att = { name, round, total: P.total, score: 0, solved: {}, answers: {}, submitted: false, startedAt: new Date().toISOString(), updatedAt: serverTimestamp() };
            await setDoc(ref, att);
        }
    } else {
        att = { name, round, total: P.total, score: 0, solved: {}, answers: {}, submitted: false, startedAt: new Date().toISOString() };
    }
    clearLocalAnswers();                       // 이 기기에 남은 다른 사람의 답은 지우고, 서버 기록으로 채운다

    $("ex-name").hidden = true; $("ex-wait").hidden = true;
    const root = $("ex-exam");
    root.innerHTML = '<div class="ex-bar" id="ex-bar"><span>👤 ' + esc(name) + '</span><span class="ex-score" id="ex-score">✅ 0 / ' + P.total + '</span><span class="ex-time" id="ex-time">⏱ 00:00</span><span class="ex-sync" id="ex-sync"></span><button class="ex-btn" type="button" id="ex-bar-submit">제출</button></div>' + P.html;
    root.hidden = false;
    if (!att.submitted) document.body.classList.add("ex-live");
    if (!ONLINE) $("ex-sync").textContent = "○ 서버 연결 전 — 점수가 저장되지 않아요";

    const started = new Date(att.startedAt).getTime();
    const elapsed = () => ((att.submitted && att.submittedAt ? new Date(att.submittedAt).getTime() : Date.now()) - started) / 1000;
    const qs = () => [...root.querySelectorAll(".ex-q")];
    const isSolved = (q) => q.dataset.solved === "1" || q.dataset.passed === "1";
    const score = () => qs().filter(isSolved).length;
    const answerOf = (q) => { const el = q.querySelector(".oq-ans, .ct-code, .quiz-item input"); return el ? el.value : ""; };

    // ---- 서버에 저장 (답 · 맞힘 여부 · 점수) ----
    let pending = {}, timer = null;
    function queue(patch) {                    // 여러 문제의 답을 한 번에 보낼 때 answers 는 문제별로 합친다
        Object.keys(patch).forEach((k) => {
            if (k === "answers") pending.answers = Object.assign(pending.answers || {}, patch.answers);
            else pending[k] = patch[k];
        });
    }
    function save(patch) {
        if (!ONLINE || att.submitted) return;
        queue(patch);
        clearTimeout(timer);
        timer = setTimeout(flush, 800);
    }
    async function flush() {
        const p = pending; pending = {};
        if (!Object.keys(p).length) return;
        p.updatedAt = serverTimestamp();
        try { await setDoc(ref, p, { merge: true }); $("ex-sync").textContent = "● 저장됨"; }
        catch (err) {
            $("ex-sync").textContent = "○ 저장 실패 — 다시 시도 중 (" + (err.code || "") + ")";
            if (err.code === "permission-denied") return;   // 제출됐거나 초기화됨
            const later = pending; pending = {}; delete p.updatedAt; queue(p); queue(later);
            clearTimeout(timer); timer = setTimeout(flush, 3000);
        }
    }
    let last = -1;
    function refresh() {
        const s = att.submitted ? att.score : score();
        $("ex-score").textContent = "✅ " + s + " / " + P.total;
        if (!att.submitted && s !== last) {
            last = s;
            const solved = {}; qs().forEach((q) => { solved[q.id] = isSolved(q); });
            save({ score: s, solved, elapsed: Math.round(elapsed()) });
        }
    }
    setInterval(() => { $("ex-time").textContent = "⏱ " + mmss(elapsed()); }, 1000);

    async function submit() {
        if (att.submitted) return;
        const s = score();
        if (!confirm("제출할까요?\n현재 점수 " + s + " / " + P.total + "\n제출하면 점수가 확정되고 더 이상 바뀌지 않아요.")) return;
        const done = { submitted: true, score: s, submittedAt: new Date().toISOString(), elapsed: Math.round(elapsed()) };
        if (ONLINE) {
            clearTimeout(timer); await flush();
            try { await setDoc(ref, Object.assign({ updatedAt: serverTimestamp() }, done), { merge: true }); }
            catch (err) { alert("제출을 서버에 저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."); return; }
        }
        Object.assign(att, done);
        showResult();
    }
    // 관리자가 🏁 시험 종료 → 묻지 않고 지금 점수로 제출
    async function endByAdmin() {
        if (att.submitted) return;
        const done = { submitted: true, score: score(), submittedAt: new Date().toISOString(), elapsed: Math.round(elapsed()), auto: true };
        if (ONLINE) {
            clearTimeout(timer); await flush();
            try { await setDoc(ref, Object.assign({ updatedAt: serverTimestamp() }, done), { merge: true }); }
            catch (err) {                          // 관리자 화면이 먼저 제출 처리했으면 서버 기록을 그대로 씀
                try { const x = await getDoc(ref); if (x.exists() && x.data().submitted) Object.assign(done, x.data()); } catch (e) { }
            }
        }
        Object.assign(att, done);
        showResult();
        alert("⏹ 관리자가 시험을 종료했어요.\n지금까지 푼 것으로 자동 제출됐어요 (" + att.score + " / " + P.total + "점).");
    }
    function showResult() {
        document.body.classList.remove("ex-live");
        $("ex-bar-submit").disabled = true; $("ex-bar-submit").textContent = "제출 완료";
        const b = $("ex-submit-btn"); if (b) { b.disabled = true; b.textContent = "제출 완료"; }
        $("ex-result").innerHTML = '<p class="ex-final">' + esc(att.name) + " · " + att.score + " / " + P.total + '점</p><p class="ex-note">걸린 시간 ' + mmss(elapsed()) + " · 이제 각 문제의 <b>정답 보기</b>로 풀이를 확인할 수 있어요.</p>";
        refresh();
    }
    $("ex-bar-submit").addEventListener("click", () => { if (!att.submitted) $("ex-submit").scrollIntoView({ behavior: "smooth" }); });
    $("ex-submit-btn").addEventListener("click", submit);

    await loadScript("codetest.js"); await loadScript("outquiz.js"); await loadScript("quiz.js");

    // ---- 서버 기록 되살리기 (다른 기기에서 쓴 답까지) ----
    const answers = att.answers || {}, solved = att.solved || {};
    qs().forEach((q) => {
        const v = answers[q.id];
        const el = q.querySelector(".oq-ans, .ct-code, .quiz-item input");
        if (el && typeof v === "string" && v) {
            el.value = v;
            if (q.classList.contains("oq") && solved[q.id]) q.querySelector(".oq-check").click();
            else if (q.classList.contains("quiz-item") && solved[q.id]) q.querySelector(".check").click();
            else if (q.classList.contains("ct") && solved[q.id]) {
                q.dataset.passed = "1";
                q.querySelector(".ct-result").innerHTML = '<p class="ex-note">✅ 이전에 통과한 코드예요 (다시 채점하려면 ▶ 채점하기)</p>';
            }
        }
    });
    last = score();
    root.addEventListener("input", (e) => {
        const q = e.target.closest(".ex-q");
        if (q && !att.submitted) save({ answers: { [q.id]: answerOf(q) } });
    });
    new MutationObserver(refresh).observe(root, { subtree: true, attributes: true, attributeFilter: ["data-solved", "data-passed"] });
    if (att.submitted) showResult();
    refresh();
    return { submitted: () => att.submitted, endByAdmin };
}

// ---- 대기실 → 시험 → 종료 (관리자의 ▶️ 시험 시작 · 🏁 시험 종료를 따라감) ----
//  exams/{시험}.phase : "ready"(대기) → "live"(시험 중) → "ended"(종료)   · 없으면 "ready"
function showWait(name, kind) {
    $("ex-name").hidden = true;
    const w = $("ex-wait"); w.hidden = false;
    w.innerHTML = kind === "ended"
        ? '<h2>⏹ 시험이 끝났어요</h2><p><b>' + esc(name) + '</b> 님은 이번 시험 기록이 없어요.</p><p class="ex-note">관리자가 새 시험을 시작하면 이 화면에 바로 문제가 나와요.</p>'
        : '<h2><span class="ex-dot"></span>시험 시작을 기다리는 중</h2><p><b>' + esc(name) + '</b> 님 입장 완료 ✅</p><p class="ex-note">관리자가 <b>시험 시작</b>을 누르면 이 화면에 바로 문제가 나와요. 새로고침하지 않아도 돼요.</p>';
}
async function enterLobby(P, name) {
    if (!ONLINE) { await startExam(P, name, 1); return; }
    await ensureUser();
    let state = "", round = 0, exam = null, beat = null, chain = Promise.resolve();
    const ping = () => setDoc(lobbyRef(name), { name, at: serverTimestamp() }).catch(() => { });
    const startBeat = () => { if (!beat) { ping(); beat = setInterval(ping, 30000); } };
    const stopBeat = () => { if (beat) { clearInterval(beat); beat = null; } };
    async function onExam(s) {
        const d = s.exists() ? s.data() : {};
        const r = d.round || 1, phase = d.phase || "ready";
        if (state === "exam") {                    // 문제를 푸는 중 · 결과를 보는 중
            if (r !== round) {                     // 관리자가 종료 뒤 기록을 정리했거나 새 시험을 시작함
                if (exam.submitted() && phase !== "live") return;      // 제출하고 결과를 보는 중이면 이 화면은 그대로
                clearLocalAnswers();
                alert(phase === "live" ? "관리자가 새 시험을 시작했어요.\n처음부터 다시 들어와 주세요." : "시험이 끝났어요.\n처음 화면으로 돌아가요.");
                location.reload(); return;
            }
            if (phase === "ended") await exam.endByAdmin();
            return;
        }
        round = r;
        if (phase === "live") { stopBeat(); state = "exam"; exam = await startExam(P, name, r); return; }
        if (phase === "ended") {
            stopBeat();
            const mine = await getDoc(attRef(r, name));
            if (mine.exists()) { state = "exam"; exam = await startExam(P, name, r); await exam.endByAdmin(); return; }
            state = "ended"; showWait(name, "ended"); return;
        }
        state = "wait"; showWait(name, "ready"); startBeat();
    }
    await new Promise((ok, bad) => {
        let first = true;
        onSnapshot(examRef(), (s) => {
            chain = chain.then(() => onExam(s)).then(() => { if (first) { first = false; ok(); } }, (err) => { if (first) { first = false; bad(err); } });
        }, (err) => { if (first) { first = false; bad(err); } });
    });
}

// ---- 관리자 화면 (비밀번호 칸에 관리자 코드 → 서버 규칙이 관리자 계정인지 확인) ----
//  버튼 하나가 단계마다 바뀜: ▶️ 시험 시작 (대기) → 🏁 시험 종료 (시험 중)
//  종료하면: 푸는 중인 사람 자동 제출 → 결과 창(순위 · 이름 · 점수) → 기록을 지우고 다시 대기로 (다음엔 시작만 누르면 됨)
const LAST_KEY = "ex-last-result:" + EXAM;
const medal = (p) => p === 1 ? "🥇" : p === 2 ? "🥈" : p === 3 ? "🥉" : p + "위";
function rankOf(rows) {                            // 점수 높은 순 → 같으면 빨리 푼 순 · 점수가 같으면 같은 등수
    let prev = null, place = 0;
    return rows.slice().sort((a, b) => b.score - a.score || (a.elapsed || 0) - (b.elapsed || 0)).map((r, i) => {
        if (!prev || prev.score !== r.score) place = i + 1;
        prev = r;
        return { place, name: r.name, score: r.score, total: r.total, elapsed: r.elapsed || 0, auto: !!r.auto };
    });
}
function showModal(res, note) {
    const body = $("ex-modal-body");
    const foot = note ? '<p class="ex-note" style="text-align:center">' + note + "</p>" : "";
    if (!res) body.innerHTML = '<p class="ex-note" style="text-align:center;margin:14px 0"><span class="ex-dot"></span>' + note + "</p>";
    else if (!res.list.length) body.innerHTML = '<p class="ex-note" style="text-align:center">' + esc(res.when) + ' · 응시한 사람이 없어요.</p>' + foot;
    else body.innerHTML = '<p class="ex-note" style="text-align:center">' + esc(res.when) + " · " + res.list.length + "명</p>"
        + '<table class="ex-board"><tr><th>순위</th><th>이름</th><th>점수</th></tr>'
        + res.list.map((r) => '<tr><td class="ex-rank">' + medal(r.place) + "</td><td><b>" + esc(r.name) + '</b></td><td class="num">' + r.score + " / " + r.total + "</td></tr>").join("")
        + "</table>" + foot;
    $("ex-modal").hidden = false;
    $("ex-modal-close").focus();
}

async function openAdmin(u) {
    $("ex-lock").hidden = true;
    const root = $("ex-admin");
    root.hidden = false;
    root.innerHTML = '<section class="card"><div class="ex-admin-head"><h2 style="margin:0">🛡️ 관리자 · 실시간 점수판</h2><span class="ex-pill ex-phase" id="ex-phase"></span>'
        + '<button class="ex-btn ex-last" type="button" id="ex-last" hidden>📋 지난 결과</button>'
        + '<button class="ex-btn" type="button" id="ex-go" disabled>…</button></div>'
        + '<p class="ex-note" id="ex-admin-status">불러오는 중…</p><div id="ex-admin-board"></div>'
        + '<p class="ex-note" id="ex-admin-help"></p><p class="ex-note" id="ex-go-msg"></p></section>'
        + '<p class="ex-note" style="text-align:center">로그인: ' + esc(u.email) + ' · <a href="#" id="ex-logout">로그아웃</a></p>';

    // 시험 문서가 없으면 만든다 (처음엔 대기)
    const first = await getDoc(examRef());
    if (!first.exists()) await setDoc(examRef(), { round: 1, phase: "ready", createdAt: serverTimestamp() });

    let round = 1, phase = "ready", rows = [], lobby = [], lobbyErr = "", unsubRows = null, finishing = false, firstSnap = true, last = null;
    // 지난 결과 — 서버(관리자만 읽기)에 있으면 그것, 없으면 이 기기에 저장된 것
    try { const x = await getDoc(doc(db, "exams", EXAM, "results", "last")); if (x.exists()) last = x.data(); } catch (e) { }

    const HELP = {

        live: "이름 · 점수 · 상태가 실시간으로 보여요 (친구가 문제를 맞히는 순간 바뀜). <b>🏁 시험 종료</b>를 누르면 푸는 중인 사람은 지금 점수로 자동 제출되고, 결과 창(순위 · 이름 · 점수)이 뜬 뒤 기록이 정리돼서 바로 다시 시작할 수 있어요.",

    function setPhaseUI() {

        b.textContent = finishing || phase === "ended" ? "⏳ 정리 중…" : phase === "ready" ? "▶️ 시험 시작" : "🏁 시험 종료";
        const p = $("ex-phase");

    }
    // 🏁 종료: 종료 알림 → 친구 화면이 스스로 제출할 시간 → 남은 사람(창을 닫았거나 인터넷이 끊김)은 마지막 저장 점수로 제출
    //        → 결과 창 → 결과 보관(📋 지난 결과) → 기록 정리 후 대기로
    async function finishExam(fromButton) {

            const docs = (await getDocs(query(collection(db, "exams", EXAM, "attempts"), where("round", "==", round)))).docs;
            const now = Date.now(), b = writeBatch(db);
            let n = 0;
            const all = docs.map((d) => {
                const r = d.data();

                const patch = { submitted: true, auto: true, submittedAt: new Date(now).toISOString(), elapsed: isNaN(t) ? (r.elapsed || 0) : Math.max(r.elapsed || 0, t) };

            try { await setDoc(doc(db, "exams", EXAM, "results", "last"), Object.assign({ at: serverTimestamp() }, last)); } catch (e) { }

            showModal(last, "⏳ 다음 시험을 위해 기록을 정리하는 중…");
            await freshRound("ready");
            showModal(last, "✅ 기록을 정리했어요 — 다음엔 <b>▶️ 시험 시작</b>만 누르면 돼요.<br>창을 닫아도 <b>📋 지난 결과</b>로 다시 볼 수 있어요.");
            msg.textContent = "";
        } catch (err) {
            showModal(last, "⚠️ 정리하다 멈췄어요 (" + esc(err.code || err.message) + ") — 새로고침하면 이어서 해요.");
        } finally { finishing = false; setPhaseUI(); }
    }
    $("ex-go").addEventListener("click", async () => {
        const b = $("ex-go"), msg = $("ex-go-msg");
        if (phase === "live") {
            const doing = rows.filter((r) => !r.submitted).map((r) => r.name);
            if (!confirm("시험을 종료할까요?\n" + (doing.length ? "푸는 중인 " + doing.length + "명(" + doing.join(", ") + ")은 지금 점수로 자동 제출돼요." : "모두 제출했어요.") + "\n결과 창이 뜬 뒤 기록이 정리돼요 (되돌릴 수 없음).")) return;
            finishExam(true);
            return;
        }
        if (phase !== "ready") return;
        const waiting = lobby.map((x) => x.name);
        if (!confirm("시험을 시작할까요?\n" + (waiting.length ? "입장한 사람 " + waiting.length + "명: " + waiting.join(", ") : "아직 입장한 사람이 없어요 (나중에 들어와도 바로 풀 수 있어요).") + "\n모든 친구 화면에 문제가 바로 나와요.")) return;
        b.disabled = true; msg.textContent = "시작하는 중…";
        try { await freshRound("live"); msg.textContent = "✅ 시험을 시작했어요"; }
        catch (err) { msg.textContent = "⚠️ 시작 실패 (" + (err.code || err.message) + ")"; b.disabled = false; }
    });
    $("ex-logout").addEventListener("click", async (e) => { e.preventDefault(); seen(null); await signOut(auth); location.reload(); });

    function pill(r) { return r.submitted ? (r.auto ? '<span class="ex-pill auto">자동 제출</span>' : '<span class="ex-pill done">제출</span>') : '<span class="ex-pill">푸는 중</span>'; }
    function ago(t) { const ms = t && t.toMillis ? t.toMillis() : NaN; const s = (Date.now() - ms) / 1000; return isNaN(s) ? "-" : s < 60 ? Math.max(0, Math.round(s)) + "초 전" : Math.round(s / 60) + "분 전"; }
    function draw() {
        const box = $("ex-admin-board");
        if (phase === "ready") {                   // 대기실: 입장한 사람
            $("ex-admin-status").textContent = "⏳ 입장 " + lobby.length + "명";
            if (lobbyErr) { box.innerHTML = '<p class="ex-note">⚠️ 입장한 사람 목록을 불러오지 못했어요 (' + esc(lobbyErr) + ') — Firestore 규칙을 새로 게시해야 보여요. 시작 · 종료는 그대로 돼요.</p>'; return; }
            if (!lobby.length) { box.innerHTML = '<p class="ex-note">아직 입장한 사람이 없어요.</p>'; return; }
            box.innerHTML = '<table class="ex-board"><tr><th>이름</th><th>상태</th><th>마지막 확인</th></tr>'
                + lobby.map((x) => "<tr><td><b>" + esc(x.name) + '</b></td><td><span class="ex-pill wait">입장</span></td><td>' + ago(x.at) + "</td></tr>").join("") + "</table>";
            return;
        }
        $("ex-admin-status").textContent = (phase === "live" ? "● 실시간 · " : "⏹ 종료 · ") + rows.length + "명";
        if (!rows.length) { box.innerHTML = '<p class="ex-note">' + (phase === "live" ? "아직 문제를 받은 사람이 없어요." : "이번 시험 기록이 없어요.") + "</p>"; return; }
        const show = phase === "ended" || rows.every((r) => r.submitted);
        let h = '<table class="ex-board">';
        if (!show) {
            const list = rows.slice().sort((a, b) => String(a.startedAt).localeCompare(String(b.startedAt)));
            h += "<tr><th>이름</th><th>점수</th><th>상태</th><th>갱신</th></tr>";
            list.forEach((r) => {
                const pct = r.total ? Math.round(r.score / r.total * 100) : 0;
                h += "<tr><td><b>" + esc(r.name) + '</b></td><td class="num">' + r.score + " / " + r.total + '<span class="ex-meter"><i style="width:' + pct + '%"></i></span></td><td>' + pill(r) + "</td><td>" + ago(r.updatedAt) + "</td></tr>";
            });
        } else {
            h += "<tr><th>순위</th><th>이름</th><th>점수</th><th>걸린 시간</th><th>상태</th></tr>";
            rankOf(rows).forEach((r) => {
                h += '<tr><td class="ex-rank">' + medal(r.place) + "</td><td><b>" + esc(r.name) + '</b></td><td class="num">' + r.score + " / " + r.total + "</td><td>" + mmss(r.elapsed) + "</td><td>" + pill(r) + "</td></tr>";
            });
        }
        box.innerHTML = h + "</table>" + (show ? "" : '<p class="ex-note">제출 ' + rows.filter((r) => r.submitted).length + " / " + rows.length + "명</p>");
    }
    onSnapshot(collection(db, "exams", EXAM, "lobby"), (qs) => {
        lobby = qs.docs.map((x) => x.data()).sort((a, b) => String(a.name).localeCompare(String(b.name), "ko"));
        lobbyErr = ""; draw();
    }, (err) => { lobbyErr = err.code || err.message; draw(); });
    setInterval(() => { if (phase === "ready") draw(); }, 15000);   // '마지막 확인 N초 전' 갱신
    onSnapshot(examRef(), (s) => {
        const d = s.data() || {};
        phase = d.phase || "ready"; setPhaseUI();
        if ((d.round || 1) !== round || !unsubRows) {
            round = d.round || 1;
            if (unsubRows) unsubRows();
            unsubRows = onSnapshot(query(collection(db, "exams", EXAM, "attempts"), where("round", "==", round)), (qs) => {
                rows = qs.docs.map((x) => x.data());
                draw();
            }, (err) => { $("ex-admin-status").textContent = "○ 점수판을 불러오지 못했어요 (" + (err.code || err.message) + ")"; });
        }
        draw();
        // 종료 정리 중에 창을 닫았으면, 다시 열었을 때 이어서 정리
        if (firstSnap && phase === "ended") finishExam(false);
        firstSnap = false;
    });
}
</script>
</body>
</html>
