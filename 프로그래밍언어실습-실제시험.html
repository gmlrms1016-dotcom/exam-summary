<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="theme.js?v=202610071644"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>프로그래밍언어실습 · 중간고사 실제시험</title>
    <link rel="stylesheet" href="style.css?v=202610071644">
    <style>
        pre.io { background:#0f1b14; }
        pre.io::before { content:"▶ 실행 화면"; color:#7fd49a; }
        pre.io code { color:#dff5e6; }
        .ex-lock { max-width:440px; margin:26px auto; text-align:center; }
        .ex-lock form { display:flex; gap:8px; justify-content:center; margin:14px 0 6px; }
        .ex-lock input { flex:1 1 auto; min-width:0; max-width:240px; font-size:18px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); text-align:center; }
        /* 비밀번호 칸을 type=password 로 두면 브라우저가 "비밀번호 저장" → 다음에 자동으로 채워 넣어서, 그 뒤에 친 숫자가 이어 붙음 → 틀림. 그래서 text 칸 + 점 가리기 */
        #ex-pin, #ex-play-pin { -webkit-text-security:disc; text-security:disc; }
        .ex-bar .ex-to-admin { font-size:13px; font-weight:800; color:var(--main); text-decoration:none; }
        #ex-pin.show { -webkit-text-security:none; text-security:none; }
        .ex-lock .ex-eye { padding:10px 12px; background:var(--card); color:var(--ink); border:1px solid var(--line); font-size:16px; }
        .ex-lock .ex-eye.on { background:var(--main); color:#fff; border-color:var(--main); }
        .ex-btn, .ex-lock button { font-size:15px; font-weight:800; padding:10px 18px; border:0; border-radius:12px; background:var(--main); color:#fff; cursor:pointer; }
        .ex-btn:disabled, .ex-lock button:disabled { opacity:.55; cursor:default; }
        .ex-msg { min-height:22px; font-weight:800; margin:6px 0 0; }
        .ex-msg.no { color:#d9534f; }
        .ex-msg.info { color:var(--ink-2); font-weight:600; }
        .ex-bar { position:sticky; top:62px; z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin:0 0 14px; padding:10px 14px; padding-right:62px; border:1px solid var(--line); border-radius:14px; background:var(--card); box-shadow:0 6px 18px rgba(0,0,0,.08); font-weight:800; font-size:14px; }
        .ex-bar .ex-score { color:var(--main); }
        .ex-bar .ex-time { font-variant-numeric:tabular-nums; color:var(--ink-2); }
        .ex-bar .ex-sync { font-weight:600; font-size:12px; color:var(--ink-2); }
        .ex-bar .ex-btn { margin-left:auto; padding:7px 14px; font-size:13px; }
        .ex-kind { display:inline-block; font-size:12px; font-weight:900; padding:1px 9px; border-radius:999px; margin-right:6px; vertical-align:1px; color:#fff; }
        .ex-kind.out { background:#2d6a4f; }
        .ex-kind.type { background:#1f5aa6; }
        .ex-kind.blank { background:#8a5a00; }
        .ex-kind.err { background:#a12d2d; }
        .ex-kind.kmcq { background:#6b4fa0; }   /* 'mcq' 는 quiz.js 의 객관식 카드 이름이라 겹치지 않게 k 붙임 */
        .ex-kind.kshort { background:#8a5a00; }
        /* 객관식 (시험 모드: 고른 답만 표시 · 맞았는지는 시험이 끝난 뒤 풀이에서) */
        .exmcq { border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0; background:var(--card); }
        .exmcq .quiz-q { font-weight:700; }
        .exmcq .quiz-cat { display:inline-block; min-width:26px; height:24px; line-height:24px; text-align:center; background:var(--main); color:#fff; border-radius:6px; font-size:13px; margin-right:8px; padding:0 4px; }
        .exmcq-opts { display:grid; gap:8px; margin:10px 0 4px; }
        .exmcq-opt { display:block; width:100%; text-align:left; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font-size:15px; line-height:1.55; cursor:pointer; }
        .exmcq-opt:hover { border-color:var(--main); }
        .exmcq-opt.sel { border:2px solid var(--main); background:rgba(45,106,79,.10); font-weight:700; }
        .exmcq-opt.sel::after { content:"  ✓ 고름"; font-size:12px; font-weight:800; color:var(--main); }
        .ex-rv-opts { display:grid; gap:6px; margin:8px 0; }
        .ex-rv-opt { padding:8px 12px; border:1px solid var(--line); border-radius:10px; }
        .ex-rv-opt.ok { border:2px solid #2e9d5b; }
        .ex-rv-opt.ok::after { content:"  ✅ 정답"; font-size:12px; font-weight:800; color:#2e9d5b; }
        .ex-rv-opt.mine:not(.ok) { border:2px solid #d9534f; }
        .ex-desc { margin:4px 0 8px; line-height:1.7; }
        .ex-file { font-size:12px; font-weight:800; color:var(--ink-2); margin-left:6px; }
        .quiz-item.ex-q .quiz-cat { display:inline-block; min-width:26px; height:24px; line-height:24px; text-align:center; background:var(--main); color:#fff; border-radius:6px; font-size:13px; margin-right:8px; padding:0 4px; }
        .quiz-item.ex-q pre { margin:6px 0 10px; }
        .ex-live .quiz-btn.show, .ex-live .oq-show, .ex-live .ct-show { display:none !important; }
        .ex-rules ul { margin:6px 0 0; padding-left:20px; line-height:1.8; }
        #ex-result .ex-final { font-size:22px; font-weight:900; color:var(--main); margin:12px 0 4px; }
        .ex-admin-head { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
        .ex-admin-head .ex-go-btns { margin-left:auto; display:flex; flex-wrap:wrap; gap:8px; }
        .ex-btn.ghost { background:var(--line); color:var(--ink); }
        .ex-bar .ex-time.low { color:#d9534f; }
        /* 시험 시간 정하기 (관리자 대기 화면) */
        .ex-timed { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin:12px 0 4px; padding:12px; border:1px dashed var(--line); border-radius:12px; }
        .ex-timed label { display:inline-flex; align-items:center; gap:5px; font-weight:800; font-size:14px; }
        .ex-timed input { width:66px; font-size:16px; padding:7px 8px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); text-align:center; }
        .ex-timed .ex-btn { padding:8px 14px; font-size:14px; }
        /* 시간 제한 시험 중 관리자 조작 막대 (화면 하단 고정) */
        .ex-tbar { position:fixed; left:0; right:0; bottom:0; z-index:9998; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--card); border-top:1px solid var(--line); box-shadow:0 -6px 18px rgba(0,0,0,.14); }
        .ex-tbar-in { max-width:980px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; }
        .ex-tbar-left { font-weight:900; font-size:15px; }
        .ex-tbar-left b { font-size:22px; font-variant-numeric:tabular-nums; margin-left:4px; color:var(--main); }
        .ex-tbar.low .ex-tbar-left b { color:#d9534f; }
        .ex-tbar-btns { display:flex; flex-wrap:wrap; gap:6px; }
        .ex-tbar-btns .ex-btn { padding:7px 12px; font-size:13.5px; }
        body.ex-has-tbar { padding-bottom:120px; }
        .ex-timed[hidden], .ex-tbar[hidden], .ex-btn[hidden] { display:none !important; }
        /* 🔢 문제 번호판 (시험 막대 안 · 누르면 펼침) */
        .ex-bar .ex-navbtn { padding:5px 10px; font-size:13px; font-weight:800; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); cursor:pointer; }
        .ex-nav { flex-basis:100%; display:flex; flex-wrap:wrap; gap:6px; padding-top:8px; border-top:1px solid var(--line); }
        .ex-nav[hidden] { display:none; }
        .ex-nav button { width:38px; height:34px; padding:0; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink-2); font-weight:800; font-size:13px; cursor:pointer; }
        .ex-nav button.wr { border-color:var(--main); color:var(--main); border-width:2px; }
        .ex-nav button.ok { background:#2e9d5b; border-color:#2e9d5b; color:#fff; }
        .ex-nav button.no { border:2px solid #d9534f; color:#d9534f; }
        .ex-nav-key i.no { border:2px solid #d9534f; }
        .ex-nav-key { flex-basis:100%; display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; font-size:12px; font-weight:600; color:var(--ink-2); }
        .ex-nav-key i { display:inline-block; width:11px; height:11px; border-radius:3px; border:1px solid var(--line); margin-right:4px; vertical-align:-1px; }
        .ex-nav-key i.ok { background:#2e9d5b; border-color:#2e9d5b; }
        .ex-nav-key i.wr { border:2px solid var(--main); }
        .ex-q { scroll-margin-top:150px; }
        /* 남은 시간 알림 · 시간 바뀜 알림 (화면 위쪽에 잠깐) */
        .ex-toast { position:fixed; left:50%; top:14px; z-index:10000; max-width:calc(100% - 32px); padding:12px 20px; border-radius:14px; background:#d9534f; color:#fff; font-weight:900; font-size:16px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.25); transform:translate(-50%,-160%); transition:transform .3s; pointer-events:none; }
        .ex-toast.on { transform:translate(-50%,0); }
        .ex-toast.info { background:#1f5aa6; }
        /* 📝 혼자 풀기 */
        .ex-bar .ex-solo { font-size:12.5px; padding:2px 9px; border-radius:999px; background:#8a5a00; color:#fff; }
        .ex-solo-note { margin:0 0 14px; padding:12px 14px; border:1px solid #8a5a00; border-radius:14px; background:rgba(138,90,0,.08); font-size:14px; line-height:1.7; }
        .ex-switch { margin:0 0 12px; padding:10px 12px; border-radius:12px; background:rgba(31,90,166,.1); font-size:14px; font-weight:700; }
        .ex-plan { margin:8px 0 4px; font-weight:800; }
        /* 맨 위 바로가기 버튼 3개 (중간고사 정리 · 사이트 홈 · 과목 페이지) — 다크 모드는 theme.js 의 .back-link 모양을 따름 */
        .ex-links { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
        .ex-link { display:inline-flex; align-items:center; padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--main); font-weight:800; font-size:14px; text-decoration:none; }
        .ex-link:hover { border-color:var(--main); }
        /* 관리자 입장 표: 혼자 푸는 사람 · 📣 부르기 */
        .ex-pill.solo { background:#8a5a00; color:#fff; }
        .ex-call { margin-left:6px; padding:3px 10px; font-size:12px; font-weight:800; border:0; border-radius:999px; background:var(--main); color:#fff; cursor:pointer; }
        .ex-call:disabled { opacity:.55; cursor:default; }
        .ex-solo-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin:0 0 8px; font-weight:800; }
        /* 👁 스터디원 화면 보기 (관리자) · 스터디원 화면 안내 */
        .ex-watch { margin:0 0 12px; padding:8px 12px; border-radius:12px; background:rgba(31,90,166,.1); font-size:13px; font-weight:700; }
        .ex-lv { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.55); }
        .ex-lv[hidden] { display:none; }
        .ex-lv-box { display:flex; flex-direction:column; width:100%; max-width:820px; height:min(90vh, 900px); background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.35); overflow:hidden; }
        .ex-lv-head { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:14px 16px 8px; border-bottom:1px solid var(--line); }
        .ex-lv-head b { font-size:17px; }
        .ex-lv-head .ex-lv-meta { font-size:13px; font-weight:700; color:var(--ink-2); }
        .ex-lv-head label { margin-left:auto; display:inline-flex; gap:4px; align-items:center; font-size:13px; font-weight:700; }
        .ex-lv-head .ex-btn { padding:6px 12px; font-size:13px; }
        .ex-lv-status { padding:8px 16px; font-weight:800; font-size:14px; }
        .ex-lv-status.away { color:#fff; background:#d9534f; }
        .ex-lv-nav { flex:none; padding:8px 16px; border-top:0; border-bottom:1px solid var(--line); }   /* 세로 칸 안에서 늘어나지 않게 */
        .ex-lv-head, .ex-lv-status { flex:none; }
        .ex-lv-nav button.cur { outline:3px solid #f0ad4e; outline-offset:1px; }
        .ex-lv-body { flex:1; overflow:auto; padding:12px 16px 24px; }
        .ex-lv-q { border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin:0 0 12px; scroll-margin-top:8px; }
        .ex-lv-q.cur { border:3px solid #f0ad4e; box-shadow:0 0 0 4px rgba(240,173,78,.2); }
        .ex-lv-qh { margin:0 0 6px; font-weight:800; }
        .ex-lv-qh small { color:var(--ink-2); margin:0 4px; }
        .ex-lv-st { float:right; font-size:12px; font-weight:800; }
        .ex-lv-q pre { max-height:240px; overflow:auto; font-size:12.5px; margin:6px 0; }
        .ex-lv-ans .lbl { font-size:12px; font-weight:800; color:var(--ink-2); }
        /* 쓴 답은 코드 블록(pre)이 아니라 글상자로 — pre 로 하면 사이트 코드 꾸미기가 '코드' 머리표를 붙이고 밝은 글자색이 연한 바탕에 묻힘 */
        .ex-lv-ans .ex-lv-text { margin:4px 0 0; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:rgba(31,90,166,.08); color:var(--ink); font-family:Consolas, "D2Coding", Menlo, monospace; font-size:13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-all; max-height:240px; overflow:auto; }
        .ex-lv-ans .none { font-size:13px; color:var(--ink-2); }
        /* 시험 방식 버튼 (혼자 풀기: 눌러서 고름 · 시험 대기실: 잠겨 있고 관리자가 고른 쪽에 실시간으로 색) */
        .ex-mode { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:12px 0 6px; }
        .ex-mode .ex-btn { transition:background-color .35s, color .35s, opacity .35s, box-shadow .35s; }
        .ex-mode.locked .ex-btn { background:var(--line); color:var(--ink-2); opacity:.6; cursor:not-allowed; }
        .ex-mode.locked .ex-btn.on { background:var(--main); color:#fff; opacity:1; box-shadow:0 0 0 3px rgba(31,90,166,.28); }
        /* 문제 방식 (📝 실제시험 · 💡 힌트 모드) — 2026-10-07 */
        .ex-mode-lbl { margin:12px 0 0; font-size:13px; font-weight:800; color:var(--ink-2); text-align:center; }
        .ex-qtoggle { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; margin:8px 0 4px; }
        .ex-qtoggle[hidden] { display:none !important; }
        .ex-qtoggle .ex-btn { background:var(--card); color:var(--ink); border:1px solid var(--line); transition:background-color .25s, color .25s, box-shadow .25s; }
        .ex-qtoggle .ex-btn.on { background:var(--main); color:#fff; border-color:var(--main); box-shadow:0 0 0 3px rgba(45,106,79,.22); }
        .ex-qdesc { text-align:center; margin:4px 0 0; }
        .ex-admin-qm { justify-content:flex-start; margin:12px 0 0; }
        .ex-admin-qm .ex-btn { padding:7px 14px; font-size:14px; }
        .ex-qm-lbl { font-weight:800; font-size:14px; }
        /* 💡 힌트 모드: 문제마다 힌트 상자 · 정답 보기 버튼 보이기 · 객관식 바로 채점 */
        body.ex-live.ex-hint .quiz-btn.show, body.ex-live.ex-hint .oq-show, body.ex-live.ex-hint .ct-show { display:inline-block !important; }
        .ex-bar .ex-hintchip { background:#b8860b; }
        .ex-hint-note { border-color:#b8860b; background:rgba(184,134,11,.08); }
        .ex-hintbox { margin-top:10px; padding:10px 12px; border:1px dashed #b8860b; border-radius:12px; background:rgba(184,134,11,.06); }
        .ex-hintbtns { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
        .ex-hintbtn, .ex-revealbtn { font-size:13.5px; font-weight:800; padding:6px 12px; border-radius:10px; border:1px solid #b8860b; background:var(--card); color:#8a5a00; cursor:pointer; }
        .ex-revealbtn { border-color:#6b4fa0; color:#6b4fa0; }
        .ex-hintbtn:disabled, .ex-revealbtn:disabled { opacity:.55; cursor:default; }
        .ex-hintnote { font-size:12.5px; color:var(--ink-2); }
        .ex-hints { margin:8px 0 0; padding-left:22px; font-size:14px; line-height:1.75; }
        .ex-hints:empty { display:none; }
        .ex-hints li { margin:4px 0; }
        .ex-hints pre { margin:6px 0; }
        .ex-learn { margin-top:10px; padding:10px 12px; border-left:4px solid #2e9d5b; border-radius:8px; background:rgba(46,157,91,.08); font-size:14px; line-height:1.7; font-weight:500; color:var(--ink); }
        body:not(.ex-hint) .ex-hintonly, body:not(.ex-hint) .ex-hintbox, body:not(.ex-hint) .ex-learn { display:none !important; }   /* 시험 중에 실제시험으로 바꾸면 숨김 */
        body.ex-hint .exmcq-opt.cut { opacity:.4; text-decoration:line-through; cursor:not-allowed; }
        .exmcq-opt.x { border:2px solid #d9534f; }
        .exmcq-opt.x::after { content:"  ❌"; font-size:12px; }
        .exmcq-opt.ok { border:2px solid #2e9d5b; background:rgba(46,157,91,.10); }
        .exmcq-opt.ok::after { content:"  ⭕ 정답"; font-size:12px; font-weight:800; color:#2e9d5b; }
        .ex-mcq-exp { margin-top:8px; padding:10px 12px; border-left:4px solid #2e9d5b; border-radius:8px; background:rgba(46,157,91,.08); font-size:14px; line-height:1.7; font-weight:500; color:var(--ink); }
        .ex-bar .ex-qm-toggle { border-color:#b8860b; color:#8a5a00; }
        .ex-mcq-fb { margin:8px 0 0; font-weight:800; }
        .ex-mcq-fb.no { color:#d9534f; }
        .ex-mcq-fb.ok, .ex-mcq-fb.rv { color:#2e9d5b; }
        .ex-nav button.rv { border:2px dashed #6b4fa0; color:#6b4fa0; }
        .ex-nav-key i.rv { border:2px dashed #6b4fa0; }
        .ex-hintn { display:block; font-size:11.5px; font-weight:700; color:#8a5a00; }
        .ex-rq-hint { font-size:12px; font-weight:800; color:#8a5a00; margin-left:6px; }
        .ex-wait-mode-note { margin:2px 0 8px; }
        #ex-solo-tbox { justify-content:center; }
        /* 결과 창: 문제별 정답률 · 복사 */
        .ex-modal-box { max-width:460px; }
        .ex-stats { margin-top:12px; }
        .ex-stats summary { cursor:pointer; font-weight:900; margin-bottom:6px; }
        .ex-modal-box .ex-stat td:nth-child(2) { text-align:left; font-size:13px; }
        .ex-stat tr.low td { color:#d9534f; font-weight:800; }
        .ex-stat small { font-weight:700; color:var(--ink-2); margin-right:4px; }
        .ex-copy { margin-top:10px; width:100%; }
        /* 스터디원 명단 (관리자가 입력 · 여기 있는 이름만 입장) */
        .ex-roster { margin:14px 0 6px; padding:12px; border:1px solid var(--line); border-radius:12px; }
        .ex-roster-head { margin:0 0 8px; font-weight:900; }
        .ex-roster-head small { font-weight:600; color:var(--ink-2); }
        .ex-roster-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
        .ex-chip { display:inline-flex; align-items:center; gap:2px; padding:4px 4px 4px 12px; border-radius:999px; background:var(--line); color:var(--ink); font-weight:800; font-size:14px; }
        .ex-chip.admin { background:#1f5aa6; color:#fff; padding-right:12px; }
        .ex-chip button { border:0; background:transparent; color:inherit; font-size:13px; cursor:pointer; padding:2px 8px; border-radius:999px; }
        .ex-chip button:hover { background:rgba(0,0,0,.12); }
        .ex-roster form { display:flex; gap:8px; flex-wrap:wrap; margin:0; }

        /* 대기실 명단: 나 → 나머지 가나다순 · 접속 중 = 파란 점 깜빡 · 아직 = 회색 점 */

let wakeLock = null, wantWake = false;
async function keepAwake(on) {
    wantWake = on;
    try {
        if (on && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
            wakeLock = await navigator.wakeLock.request("screen");
            wakeLock.addEventListener("release", () => { wakeLock = null; });
        } else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
    } catch (e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (wantWake && !document.hidden) keepAwake(true); });

// ---- 비밀번호로 문제 풀기 (PBKDF2 → AES-GCM) ----
async function decrypt(box, pass) {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(box.s), iterations: D.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.i) }, key, b64(box.c));
    return JSON.parse(new TextDecoder().decode(pt));
}

async function enterAs(P, name, note) {

        $("ex-name-in").value = ""; $("ex-name-in").focus();
        return;
    }
    btn.disabled = true; msg.className = "ex-msg info"; msg.textContent = "명단 확인 중…";
    let roster = P.names, d = {};
    if (ONLINE) {
        try {
            await ensureUser();
            let x; try { x = await getDocFromServer(examRef()); } catch (e) { x = await getDoc(examRef()); }
            d = x.exists() ? x.data() : {};
            if (rosterRef()) { let y; try { y = await getDocFromServer(rosterRef()); } catch (e) { y = await getDoc(rosterRef()); } roster = rosterOf(y) || defaultRoster(P); }   // 과목끼리 같이 쓰는 명단
            else roster = Array.isArray(d.roster) ? d.roster : defaultRoster(P);   // 관리자가 명단을 안 바꿨으면 기본 명단
        } catch (err) { btn.disabled = false; msg.className = "ex-msg no"; msg.textContent = "서버에 연결하지 못했어요 — 잠시 뒤 다시 눌러 주세요. (" + (err.code || err.message) + ")"; return; }
    }
    if (!roster.length) {
        btn.disabled = false; msg.className = "ex-msg no";
        msg.textContent = "⚠️ 스터디 명단이 비어 있어요 — 관리자에게 이름을 추가해 달라고 말해 주세요.";
        return;

        msg.textContent = "⚠️ 스터디 명단에 없는 이름이에요. 이름을 정확히 다시 입력하거나, 관리자에게 명단에 추가해 달라고 말해 주세요.";

        if (note === undefined) alert("스터디 명단에 없는 이름이에요.\n이름을 정확히 다시 입력하거나 관리자에게 명단 추가를 부탁하세요.");   // 직접 입력했을 때만 (자동 입장이면 조용히)
        $("ex-name-in").value = ""; $("ex-name-in").focus();
        return;
    }
    ROSTER = roster;
    if (LAST_PIN) resumeSet(name);                 // 새로고침해도 바로 다시 들어오게
    msg.textContent = "서버에 연결하는 중…";
    try {
        if (!ONLINE) { await startExam(P, name, 1); return; }
        // 서버 시계 차이를 먼저 재고(관리자 접속 판단이 기기 시계에 안 흔들리게) 시험 문서를 다시 봄

        try { const x = await getDocFromServer(examRef()); d = x.exists() ? x.data() : {}; } catch (e) { }

        if (note === "solo") {                     // 혼자 풀던 중 새로고침 → 관리자가 접속해 있어도 부르기 전까지는 그대로 혼자 풀기
            let base = 0; try { base = Number(localStorage.getItem(soloBaseKey(name))) || 0; } catch (e) { }

        }

function soloBeat(name, st) {                       // 관리자 화면 입장 표에 '혼자 풀기 · 도전 화면'으로 보이게 (30초마다 · 창을 닫으면 나감)

// ---- 혼자 풀기: 바로 문제 · 관리자가 접속하거나 시험이 시작되면 "관리자가 접속하였어요!" 3초 → 시험 대기실 ----
async function startSolo(P, name, limitSec, hint) {
    SOLO = true;
    const MK = "ex-bk:" + EXAM + ":0:" + name + ":m";   // 혼자 풀기 문제 방식 (새로고침해도 같은 방식으로 이어서)
    try { if (limitSec === undefined) HINT = localStorage.getItem(MK) === "1"; else { HINT = !!hint; localStorage.setItem(MK, HINT ? "1" : "0"); } } catch (e) { HINT = !!hint; }
    const EK = "ex-bk:" + EXAM + ":0:" + name + ":e";   // 혼자 풀기 끝나는 시각 (이 기기 · 새로고침해도 이어서)
    try {
        if (limitSec === undefined) EXAM_ENDS = Number(localStorage.getItem(EK) || 0) || 0;
        else if (limitSec > 0) { EXAM_ENDS = Math.round(nowS() + limitSec * 1000); localStorage.setItem(EK, String(EXAM_ENDS)); }
        else { EXAM_ENDS = 0; localStorage.removeItem(EK); }
    } catch (e) { EXAM_ENDS = limitSec > 0 ? Math.round(nowS() + limitSec * 1000) : 0; }
    if (LAST_PIN) resumeSet(name, "solo");         // 새로고침해도 도전 화면 없이 바로 이어서
    // 부르기 기준 시각 = 혼자 풀기를 시작한 서버 시각 (새로고침으로 이어서 풀면 처음 시각 그대로)
    let base = 0;
    try { base = limitSec === undefined ? Number(localStorage.getItem(soloBaseKey(name))) || 0 : 0; if (!base) { base = Math.round(nowS()); localStorage.setItem(soloBaseKey(name), String(base)); } } catch (e) { base = Math.round(nowS()); }
    const exam = await startExam(P, name, 0);
    soloBeat(name, "solo");
    // 관리자가 들어와도 푸는 중에는 그대로 (사용자: '혼자 풀고 있는데 관리자가 들어오면 짜증') — 관리자가 📣 부르기 · 시험 시작을 눌러야 대기실로
    let told = false, called = false, banner = false, rang = false;
    const toLobbyBtn = (text, btnText) => {        // 제출하고 풀이를 보는 중이면 강제로 옮기지 않고 버튼으로
        if (!banner) {
            banner = true;
            $("ex-wait").insertAdjacentHTML("afterbegin", '<p class="ex-switch" id="ex-switch-msg"><span></span> <button class="ex-btn" type="button" id="ex-to-lobby" style="padding:6px 12px;font-size:13px"></button></p>');
            $("ex-to-lobby").addEventListener("click", () => switchMode(name, ""));
        }
        $("ex-switch-msg").firstChild.textContent = text; $("ex-to-lobby").textContent = btnText;
    };
    const look = (s) => {
        const d = s.exists() ? s.data() : {};
        const live = (d.phase || "ready") === "live";
        if (!called && calledAt(d, name) > base) {
            called = true;
            if (!exam.submitted()) {
                toast("📣 관리자가 시험 대기실로 불렀어요 — 잠시 뒤 이동해요 (푼 답은 이 기기에 남아요)", true);
                setTimeout(() => switchMode(name, ""), 3000);
                return;
            }
            toast("📣 관리자가 시험 대기실로 불렀어요", true);
            toLobbyBtn(live ? "🔔 시험이 시작됐어요!" : "📣 관리자가 시험 대기실로 불렀어요.", live ? "바로 들어가기" : "시험 대기실로 가기");
            return;
        }
        if (exam.submitted()) {                    // 풀이를 보는 중
            if (live && !rang) { rang = true; toast("🔔 관리자가 시험을 시작했어요!", true); toLobbyBtn("🔔 시험이 시작됐어요!", "바로 들어가기"); }
            else if (adminOnline(d) && !banner) toLobbyBtn("🛡️ 관리자가 접속하였어요! 풀이를 다 봤으면", "시험 대기실로 가기");
            return;
        }
        if (!told && adminOnline(d)) { told = true; toast("🛡️ 관리자가 접속했어요 — 계속 풀어도 돼요 (관리자가 부르면 시험 대기실로 가요)", true); }
    };
    onSnapshot(examRef(), look, () => { });
    setInterval(() => getDocFromServer(examRef()).then(look, () => { }), 5000);
}

function loadScript(src) {
    return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = ASSET + src + "?v=" + VER; s.onload = ok; s.onerror = bad; document.body.appendChild(s); });
}
async function startExam(P, name, round) {
    // 서버에서 내 기록을 가져온다 — 다른 기기에서 풀던 것도 이어서
    // (round 는 화면에 안 보이는 시험 번호 — 관리자가 새로 시작하면 +1 → 열려 있던 기기가 새 시험에 옛 답을 쓰지 못하게 막는 용도)
    let att = null, ref = null;
    const SOLO_KEY = "ex-bk:" + EXAM + ":0:" + name;   // 혼자 풀기 답 · 맞힘 · 시작 시각 (이 기기에만)

        att = { name, round, total: P.total, score: 0, solved: sv, wrong: wv, answers: {}, submitted: false, startedAt: t0, hint: HINT, hints: hv.hints || {}, revealed: hv.revealed || {} };
    }
    clearLocalAnswers();                       // 이 기기에 남은 다른 사람의 답은 지우고, 서버 기록으로 채운다
    // 💡 힌트 모드: 문제마다 본 힌트 단계(HL) · 정답을 본 문제(RV) — 응시 기록에 저장 (혼자 풀기는 이 기기에만)

        + '<button class="ex-navbtn" type="button" id="ex-navbtn" aria-expanded="false">🔢 번호</button>'
        + (SOLO ? '<button class="ex-navbtn ex-qm-toggle" type="button" id="ex-qm-toggle"></button>' : "")   // 혼자 풀기: 푸는 중에도 📝 ↔ 💡 (관리자가 진행하는 시험은 관리자가)
        + (ADMIN_MODE ? '<a class="ex-to-admin" href="#ex-admin">🛡️ 점수판</a>' : "") + '<button class="ex-btn" type="button" id="ex-bar-submit">제출</button><div class="ex-nav" id="ex-nav" hidden></div></div>'
        + (SOLO ? '<div class="ex-solo-note">📝 <b>혼자 풀기</b> — 지금은 관리자가 접속해 있지 않아서 바로 풀 수 있어요. 점수는 서버에 저장되지 않고 <b>이 기기에만</b> 남아요 (새로고침해도 이어서). <b>제출하면 바로 정답과 풀이</b>를 볼 수 있어요. 관리자가 접속하면 시험 대기실로 바뀌어요.</div>' : "")
        + ('<div class="ex-solo-note ex-hint-note ex-hintonly">💡 <b>힌트 모드</b> — 문제마다 아래 <b>💡 힌트</b> 버튼을 누를 때마다 힌트가 하나씩 더 나와요 (주제 · 길이 · 첫 줄 · 해설 · 오답 지우기 …). 맞히면 <b>풀이</b>가 바로 나와요. 막히면 <b>🔓 정답 보기</b> — 정답을 본 문제는 맞혀도 점수에 들어가지 않아요 (공부용).</div>')

    const BK = "ex-bk:" + EXAM + ":" + round + ":" + name;
    let bk = {};
    try {
        Object.keys(localStorage).forEach((k) => { if (k.indexOf("ex-bk:" + EXAM + ":") === 0 && k.indexOf(BK) !== 0 && k.split(":")[2] !== "0") localStorage.removeItem(k); });   // 이 시험의 지난 회차 것만 지움 (다른 과목 시험 · 혼자 풀기 답은 남김 — 한 기기를 여럿이 써도)
        bk = JSON.parse(localStorage.getItem(BK) || "{}") || {};
    } catch (e) { bk = {}; }
    const backup = (id, v) => { bk[id] = v; try { localStorage.setItem(BK, JSON.stringify(bk)); } catch (e) { } };
    const dropBackup = () => { try { localStorage.removeItem(BK); if (SOLO) { localStorage.removeItem(BK + ":s"); localStorage.removeItem(BK + ":t"); localStorage.removeItem(BK + ":e"); localStorage.removeItem(BK + ":c"); localStorage.removeItem(BK + ":w"); localStorage.removeItem(BK + ":h"); localStorage.removeItem(BK + ":m"); } } catch (e) { } };

    const started = new Date(att.startedAt).getTime();
    // 경과 시간: 시험 시작(서버 시각)부터 서버 시계로 → 모두 같은 숫자 · 제출했으면 제출할 때 잰 값 그대로
    const elapsed = () => {
        if (att.submitted && typeof att.elapsed === "number") return att.elapsed;

    const score = () => qs().filter(isSolved).length;
    const answerOf = (q) => {                  // 코드 작성 칸에 미리 써 둔 뼈대 그대로면 안 쓴 것으로 · 객관식은 고른 보기
        if (q.dataset.kind === "mcq") return q.dataset.ans || "";
        const el = q.querySelector(".oq-ans, .ct-code, .quiz-item input");
        return !el || (el.defaultValue.trim() && el.value.trim() === el.defaultValue.trim()) ? "" : el.value;
    };

    // ---- 서버에 저장 (답 · 맞힘 여부 · 점수) ----
    let pending = {}, timer = null;
    function queue(patch) {                    // 여러 문제의 답을 한 번에 보낼 때 answers 는 문제별로 합친다
        Object.keys(patch).forEach((k) => {
            if (k === "answers") pending.answers = Object.assign(pending.answers || {}, patch.answers);

    let prev = null, place = 0;

        if (!prev || prev.score !== r.score) place = i + 1;

function resultText(res) {
    const lines = [(D.resultName || "실제시험") + (res.hint ? " (💡 힌트 모드)" : "") + " 결과 · " + res.when + " · " + res.list.length + "명"];

    if (res.stats && res.stats.length) {

function copyText(text) {

        lv.innerHTML = '<div class="ex-lv-box" role="dialog" aria-modal="true" aria-label="스터디원 화면 보기">'
            + '<div class="ex-lv-head"><b>👁 ' + esc(name) + ' 화면</b><span class="ex-lv-meta" id="ex-lv-meta"></span>'
            + '<label><input type="checkbox" id="ex-lv-follow" checked> 📍 보는 문제 따라가기</label><button class="ex-btn ghost" type="button" id="ex-lv-close">닫기 ✕</button></div>'
            + '<div class="ex-lv-status" id="ex-lv-status"></div>'
            + '<div class="ex-nav ex-lv-nav" id="ex-lv-nav">' + qsList.map((q) => '<button type="button" data-lvgo="' + q.id + '">' + esc(lvNo(q)) + "</button>").join("") + "</div>"
            + '<div class="ex-lv-body" id="ex-lv-body">' + cards + "</div></div>";
        $("ex-lv-close").addEventListener("click", lvClose);
        $("ex-lv-follow").addEventListener("change", (e) => { lvFollow = e.target.checked; if (lvFollow) { lvLastQ = ""; lvUpdate(); } });
        $("ex-lv-nav").addEventListener("click", (e) => { const b = e.target.closest("[data-lvgo]"); if (!b) return; lvFollow = false; $("ex-lv-follow").checked = false; const c = lv.querySelector('[data-q="' + b.dataset.lvgo + '"]'); if (c) c.scrollIntoView({ block: "start" }); });
        lv.addEventListener("click", (e) => { if (e.target === lv) lvClose(); });   // 바깥을 누르면 닫기
        lv.hidden = false;
        if (window.hljs) lv.querySelectorAll("pre code").forEach((c) => { try { window.hljs.highlightElement(c); } catch (e) { } });
        lvUpdate();
        clearInterval(lvTick); lvTick = setInterval(lvStatus, 1000);   // '…초 전' · 남은 시간만 1초마다 (서버 X)
    }
    function lvClose() { lvName = ""; lv.hidden = true; lv.innerHTML = ""; clearInterval(lvTick); }
    function lvStatus() {                           // 상단 상태 줄 (보는 문제 · 다른 화면 · 점수 · 시간)
        if (!lvName || !$("ex-lv-status")) return;
        const r = rows.find((x) => x.name === lvName), st = $("ex-lv-status"), meta = $("ex-lv-meta");
        if (!r) { st.className = "ex-lv-status"; st.textContent = "아직 이번 시험 문제를 받지 않았어요."; meta.textContent = ""; return; }
        const v = r.view || {}, no = v.q ? v.q.replace("ex-q", "") : "";
        const left = endsAt ? Math.max(0, (endsAt - (Date.now() + skew)) / 1000) : null;
        meta.textContent = "✅ " + r.score + " / " + r.total + " · " + (left !== null ? "⏳ 남은 " + mmss(left) : examStart ? "⏱ " + mmss(Math.max(0, (Date.now() + skew - examStart) / 1000)) : "") + " · 답 저장 " + ago(r.updatedAt);
        const old = v.at && !r.submitted && age(v.at) > 90;
        if (r.submitted) { st.className = "ex-lv-status"; st.textContent = r.auto ? "⏹ 자동 제출됐어요" : "✅ 제출했어요"; }
        else if (v.hidden) { st.className = "ex-lv-status away"; st.textContent = "🙈 다른 화면(앱 · 탭) 보는 중 · " + mmss(Math.max(0, (Date.now() + skew - (v.since || 0)) / 1000)) + " 전부터"; }
        else { st.className = "ex-lv-status"; st.textContent = (no ? "👀 " + no + "번 보는 중" : "👀 시험 화면") + (old ? " · ⚠️ 화면 정보가 " + ago(v.at) + " 것 (연결 확인)" : ""); }
    }
    function lvUpdate() {                           // 답 · 문제별 상태 · 지금 보는 문제 (응시 기록이 바뀔 때마다)
        if (!lvName || lv.hidden) return;
        const r = rows.find((x) => x.name === lvName);
        lvStatus();
        if (!r) return;
        const a = r.answers || {}, sv = r.solved || {}, wr = r.wrong || {}, rvd = r.revealed || {}, hl = r.hints || {}, cur = (r.view || {}).q || "";
        lv.querySelectorAll("[data-ans]").forEach((box) => {
            const id = box.dataset.ans, raw = typeof a[id] === "string" ? a[id] : "";
            const ans = raw && lvOpts[id] ? raw + ". " + (lvOpts[id][raw] || "").replace(/^[A-Z]\.\s*/, "") : raw;   // 객관식은 고른 보기 글자까지
            const html = ans.trim() ? '<span class="lbl">✍️ 쓴 답</span><div class="ex-lv-text">' + esc(ans) + "</div>" : '<span class="none">(아직 안 씀)</span>';
            if (box.dataset.v !== html) { box.dataset.v = html; box.innerHTML = html; }
            const stt = (rvd[id] ? "🔓 정답 봄" : sv[id] ? "✅ 맞힘" : wr[id] ? "❌ 틀림" : ans.trim() ? "✏️ 답 씀" : "· 안 씀") + (hl[id] ? " · 💡" + hl[id] : "");
            const chip = lv.querySelector('[data-st="' + id + '"]'); if (chip) chip.textContent = stt;
            const nb = lv.querySelector('[data-lvgo="' + id + '"]');
            if (nb) { nb.className = (sv[id] ? "ok" : wr[id] ? "no" : ans.trim() ? "wr" : "") + (id === cur ? " cur" : ""); }
            const card = box.closest(".ex-lv-q"); if (card) card.classList.toggle("cur", id === cur);
        });
        if (cur && cur !== lvLastQ) {               // 보는 문제가 바뀌면 따라가기
            lvLastQ = cur;
            if (lvFollow) { const c = lv.querySelector('[data-q="' + cur + '"]'); if (c) c.scrollIntoView({ block: "start", behavior: "smooth" }); }
        }
    }

    // 📣 혼자 푸는 사람 부르기 → 시험 문서 calls.{이름} / callAll (친구 화면이 보고 3초 뒤 대기실로)
    const callingAt = {};
    async function callSolo(names) {
        const patch = {};
        if (names === "*") patch.callAll = serverTimestamp(); else names.forEach((n) => { patch["calls." + n] = serverTimestamp(); });
        (names === "*" ? here().filter((x) => x.st === "solo").map((x) => x.name) : names).forEach((n) => { callingAt[n] = Date.now(); });
        draw();
        try { await updateDoc(examRef(), patch); $("ex-go-msg").textContent = "📣 불렀어요 — 몇 초 안에 대기실로 와요"; }
        catch (err) { $("ex-go-msg").textContent = "⚠️ 부르지 못했어요 (" + (err.code || err.message) + ")"; }
    }
    $("ex-admin-board").addEventListener("click", (e) => {
        const w = e.target.closest("[data-watch]");
        if (w) { lvOpen(w.dataset.watch); return; }
        const b = e.target.closest("[data-call], [data-call-all]");
        if (!b) return;
        callSolo(b.dataset.callAll ? "*" : [b.dataset.call]);
    });
    function draw() {
        const box = $("ex-admin-board");
        if (phase === "ready") {                   // 대기실: 지금 접속해 있는 사람 (10분 넘게 신호가 없거나 창을 닫은 사람은 숨김)
            const list = here();
            $("ex-admin-status").textContent = "⏳ 입장 " + list.length + "명";
            if (lobbyErr) { box.innerHTML = '<p class="ex-note">⚠️ 입장한 사람 목록을 불러오지 못했어요 (' + esc(lobbyErr) + ') — Firestore 규칙을 새로 게시해야 보여요. 시작 · 종료는 그대로 돼요.</p>'; return; }
            if (!list.length) { box.innerHTML = '<p class="ex-note">아직 입장한 사람이 없어요.</p>'; return; }
            const solo = list.filter((x) => x.st === "solo").map((x) => x.name);
            const callBtn = (n) => callingAt[n] && Date.now() - callingAt[n] < 20000 ? '<button class="ex-call" type="button" disabled>부르는 중…</button>' : '<button class="ex-call" type="button" data-call="' + esc(n) + '">📣 대기실로 부르기</button>';
            box.innerHTML = (solo.length > 1 ? '<p class="ex-solo-row">📝 혼자 푸는 사람 ' + solo.length + '명 <button class="ex-call" type="button" data-call-all="1">📣 모두 부르기</button></p>' : "")
                + '<table class="ex-board"><tr><th>이름</th><th>상태</th><th>연결</th></tr>'
                + list.map((x) => "<tr><td><b>" + esc(x.name) + "</b></td><td>" + (x.st === "solo" ? '<span class="ex-pill solo">📝 혼자 풀기</span>' + callBtn(x.name) : '<span class="ex-pill wait">' + (ST[x.st] || "입장") + "</span>") + "</td><td>" + conn(x.name) + "</td></tr>").join("") + "</table>"
                + (solo.length ? '<p class="ex-note">📝 혼자 푸는 사람은 관리자가 <b>📣 부르기</b>를 누르거나 <b>시험을 시작</b>하면 대기실로 와요 (그 전엔 하던 걸 계속 풀어요).</p>' : "");
            return;
        }
        $("ex-admin-status").textContent = (phase === "live" ? "● 실시간 · " : "⏹ 종료 · ") + rows.length + "명" + (hintNow ? " · 💡 힌트 모드" : "");
        if (!rows.length) { box.innerHTML = '<p class="ex-note">' + (phase === "live" ? "아직 문제를 받은 사람이 없어요." : "이번 시험 기록이 없어요.") + "</p>"; return; }
        const show = phase === "ended" || rows.every((r) => r.submitted);
        let h = '<table class="ex-board">';
        if (!show) {
            const list = rows.slice().sort((a, b) => String(a.startedAt).localeCompare(String(b.startedAt)));
            h += "<tr><th>이름</th><th>점수</th><th>상태</th><th>답 저장</th><th>연결</th><th>화면</th></tr>";
            list.forEach((r) => {
                const pct = r.total ? Math.round(r.score / r.total * 100) : 0;
                const away = r.view && r.view.hidden && !r.submitted ? ' <span class="bad">🙈</span>' : "";
                h += "<tr><td><b>" + esc(r.name) + "</b>" + away + '</td><td class="num">' + r.score + " / " + r.total + '<span class="ex-meter"><i style="width:' + pct + '%"></i></span>' + hintTag(r) + "</td><td>" + pill(r) + "</td><td>" + ago(r.updatedAt) + "</td><td>" + (r.submitted ? "-" : conn(r.name)) + '</td><td><button class="ex-call" type="button" data-watch="' + esc(r.name) + '">👁 화면 보기</button></td></tr>';
            });
            const missing = lobby.filter((x) => x.st !== "left" && age(x.at) < 50 && inRoster(x.name) && !rows.some((r) => r.name === x.name)).map((x) => x.name);
            if (missing.length) h += '<tr><td colspan="6" class="bad">⚠️ 접속해 있는데 아직 문제를 못 받은 사람: ' + esc(missing.join(", ")) + " — 5초 안에 안 바뀌면 그 기기에서 새로고침</td></tr>";
        } else {
            h += "<tr><th>순위</th><th>이름</th><th>점수</th><th>걸린 시간</th><th>상태</th></tr>";
            rankOf(rows).forEach((r) => {
                h += '<tr><td class="ex-rank">' + medal(r.place) + "</td><td><b>" + esc(r.name) + '</b></td><td class="num">' + r.score + " / " + r.total + hintTag(r) + "</td><td>" + mmss(r.elapsed) + "</td><td>" + pill(r) + "</td></tr>";
            });
        }
        box.innerHTML = h + "</table>" + (show ? "" : '<p class="ex-note">제출 ' + rows.filter((r) => r.submitted).length + " / " + rows.length + "명</p>");
    }
    onSnapshot(collection(db, "exams", EXAM, "lobby"), (qs) => {
        lobby = qs.docs.map((x) => x.data()).sort((a, b) => String(a.name).localeCompare(String(b.name), "ko"));
        lobbyErr = ""; draw();
    }, (err) => { lobbyErr = err.code || err.message; draw(); });
    setInterval(draw, 10000);                      // '…초 전' · 연결 상태 갱신
    // 시험 문서: 실시간 + 5초마다 서버 직접 확인 (관리자 기기도 실시간 연결이 멈출 수 있음) · 늦게 온 예전 상태는 버림
    function applyExam(s) {
        const d = s.data() || {};
        const k = (d.round || 1) * 3 + ({ ready: 0, live: 1, ended: 2 }[d.phase || "ready"] || 0);
        if (k < seenStage) return;
        seenStage = k;
        phase = d.phase || "ready"; pageVer = d.pageVer || ""; endsAt = phase === "live" && typeof d.endsAt === "number" ? d.endsAt : 0;
        hintNow = !!d.hintMode; if (qsel !== hintNow) qsel = hintNow;   // 다른 기기(관리자)에서 바꿨어도 맞춤 (그리기는 setPhaseUI)
        if (phase !== "ready" && d.startedAt && d.startedAt.toMillis) examStart = d.startedAt.toMillis();
        setPhaseUI();
        if (firstSnap && phase === "ready" && typeof d.plannedSec === "number" && d.plannedSec > 0 && $("ex-timed").hidden) {
            const v = d.plannedSec; $("ex-th").value = Math.floor(v / 3600); $("ex-tm").value = Math.floor(v % 3600 / 60); $("ex-ts").value = v % 60; $("ex-timed").hidden = false;
        }
        if (!rosterRef()) { const nr = Array.isArray(d.roster) ? d.roster : null; takeRoster(nr); }   // 같이 쓰는 명단은 아래에서 따로 받음
        if ((d.round || 1) !== round || !unsubRows) {
            round = d.round || 1; rows = [];
            if (unsubRows) unsubRows();
            unsubRows = onSnapshot(query(collection(db, "exams", EXAM, "attempts"), where("round", "==", round)), (qs) => {
                rows = qs.docs.map((x) => x.data());
                draw(); lvUpdate();
            }, (err) => { $("ex-admin-status").textContent = "○ 점수판을 불러오지 못했어요 (" + (err.code || err.message) + ")"; });
        }
        draw();
        // 종료 정리 중에 창을 닫았으면, 다시 열었을 때 이어서 정리
        if (firstSnap && phase === "ended") finishExam(false);
        firstSnap = false;
    }
    onSnapshot(examRef(), applyExam);
    // 관리자 접속 신호 (15초마다 · 창을 닫으면 지움) → 친구들: 접속해 있으면 시험 대기실, 없으면 혼자 풀기
    const beatAdmin = () => updateDoc(examRef(), { ["admins." + ADMIN_DEV]: { at: serverTimestamp(), ttl: document.hidden ? 180 : 30 } }).catch(() => { });
    setInterval(beatAdmin, 10000);
    document.addEventListener("visibilitychange", beatAdmin);   // 탭이 가려지면 넉넉히(180초) · 다시 보이면 바로 신호
    window.addEventListener("pagehide", () => { updateDoc(examRef(), { ["admins." + ADMIN_DEV]: deleteField() }).catch(() => { }); });   // 창을 닫으면 내 칸만 지움
    adminPlay().catch((err) => {                   // 점수판 아래에서 내 이름으로 같이 풀기
        const box = $("ex-play-setup"); box.hidden = false;
        box.innerHTML = '<p class="ex-msg no">⚠️ 같이 풀기를 열지 못했어요 (' + esc(err && (err.code || err.message) || err) + ') — 새로고침해 주세요. 점수판 · 시작 · 종료는 그대로 돼요.</p>';
    });
    setInterval(async () => {
        try {
            applyExam(await getDocFromServer(examRef()));
            if (rosterRef()) takeRoster(rosterOf(await getDocFromServer(rosterRef())));
            rows = (await getDocsFromServer(query(collection(db, "exams", EXAM, "attempts"), where("round", "==", round)))).docs.map((x) => x.data());
            try { lobby = (await getDocsFromServer(collection(db, "exams", EXAM, "lobby"))).docs.map((x) => x.data()).sort((a, b) => String(a.name).localeCompare(String(b.name), "ko")); lobbyErr = ""; }
            catch (e) { lobbyErr = e.code || e.message; }
            draw(); lvUpdate();
        } catch (e) { $("ex-admin-status").textContent = "🔴 서버 연결 끊김 — 다시 연결하는 중 (" + (e.code || e.message) + ")"; }
    }, 5000);
}
</script>
</body>
</html>
