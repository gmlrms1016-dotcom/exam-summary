<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자바프로그래밍 그림 정리</title>
<script>
    // 사이트와 같은 테마 (theme.js 의 저장값 "exam-summary-theme" — 없으면 다크)
    (function () {
        function pick() { try { return localStorage.getItem("exam-summary-theme") === "light" ? "light" : "dark"; } catch (e) { return "dark"; } }
        var forced = /[?&]theme=(light|dark)\b/.exec(location.search);
        document.documentElement.setAttribute("data-theme", forced ? forced[1] : pick());
        window.addEventListener("storage", function (e) { if (e.key === "exam-summary-theme") document.documentElement.setAttribute("data-theme", pick()); });
    })();
</script>
<style>
    :root{--bg:#f4f6f4;--card:#fff;--line:#d7ddd7;--ink:#1d241e;--ink2:#5d6a60;--main:#2d6a4f;
          --cell:#7c6ae6;--myelin:#e0a838;--astro:#e0862b;--oligo:#0f9f74;--micro:#d9363e;--schwann:#2b8fd1;--vessel:#d9363e;
          --ex:#16a34a;--inh:#2563eb;--ap:#e5484d;--fore:#e0862b;--mid:#c9b48a;--hind:#a0522d;
          --fr:#8b7cf6;--pa:#ec5f9e;--te:#22b07d;--oc:#e9b52c;--light:#f5a524;--eye:#eef4fb;--nerve:#e8a3a3;--hl:#f59e0b;}
    html[data-theme=dark]{--bg:#0c1014;--card:#13171b;--line:#262a2f;--ink:#f5f5f5;--ink2:#a8a8a8;--main:#4cb5f9;
          --cell:#a596f5;--myelin:#f0c35a;--astro:#f5a04a;--oligo:#34d399;--micro:#ff6369;--schwann:#5ab8f0;--vessel:#ff6369;
          --ex:#4cc38a;--inh:#6b9cff;--ap:#ff6369;--fore:#f5a04a;--mid:#d9c79c;--hind:#d07a4f;
          --fr:#a596f5;--pa:#f27db3;--te:#4cc38a;--oc:#f5c84a;--light:#ffb547;--eye:#1c2733;--nerve:#c97878;--hl:#ffb547;}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
    .box{max-width:780px;margin:0 auto;padding:10px 12px 14px;}
    .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 8px;}
    .tabs button{min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 4px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;line-height:1.25;}
    .tabs button[aria-pressed=true]{border-color:var(--main);color:var(--main);box-shadow:inset 0 0 0 1px var(--main);}
    .src{margin:0 0 6px;font-size:13px;color:var(--ink2);}
    .src b{color:var(--main);}
    .stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;}
    svg{display:block;width:100%;height:auto;}
    svg[hidden]{display:none;}
    svg text{fill:var(--ink);font-family:inherit;font-size:19px;}
    svg text.s{font-size:15px;fill:var(--ink2);}
    svg text.b{font-weight:800;}
    svg text.w{fill:#fff;}
    svg text.m{font-family:Menlo,Consolas,"D2Coding",monospace;}
    svg .ln{stroke:var(--ink2);stroke-width:1.6;fill:none;}
    svg .ax{stroke:var(--ink2);stroke-width:2;fill:none;}
    svg .dash{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:6 5;fill:none;}
    svg [data-s]{transition:opacity .45s ease;}
    svg [data-s].off{opacity:0;}
    svg [data-s].dim{opacity:.28;}
    svg [data-s].hl{filter:drop-shadow(0 0 5px var(--hl));}
    .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;}
    .ctl button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;}
    .ctl button.main{border-color:var(--main);color:var(--main);}
    .ctl .pos{margin-left:auto;font-size:13px;color:var(--ink2);}
    ol.cap{margin:8px 0 0;padding:9px 12px 9px 34px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14.5px;line-height:1.65;}
    ol.cap li{margin:2px 0;padding:1px 4px;border-radius:6px;cursor:pointer;}
    ol.cap li b{color:var(--main);}
    ol.cap li.cur{background:color-mix(in srgb,var(--hl) 22%,transparent);}
    ol.cap li.later{opacity:.45;}
    .note{margin:6px 0 0;font-size:13px;color:var(--ink2);line-height:1.6;}
    .note a{color:var(--main);}
    @media (max-width:560px){ .tabs{grid-template-columns:repeat(3,minmax(0,1fr));} .tabs button{font-size:12px;} ol.cap{font-size:14px;padding-left:28px;}
        /* 폰: 그림이 작아지니 그림 속 글자를 키움 (긴 줄도 600 폭 안에 들어가는 크기까지만) */
        svg text{font-size:22px;} svg text.s{font-size:17px;} .stage{padding:3px;} }
</style>
</head>
<body>
<div class="box" id="box">
    <div class="tabs" id="tabs" role="group" aria-label="그림 고르기"></div>
    <p class="src" id="src"></p>
    <div class="stage">

<!-- ① this() — 생성자가 다른 생성자를 부름 (Book) -->
<svg data-fig="thiscall" viewBox="0 0 600 470" role="img" aria-label="this 로 다른 생성자를 부르는 Book 생성자 세 개" hidden>

    <rect x="308" y="14" width="280" height="78" rx="10" style="fill:var(--fr);fill-opacity:.18;stroke:var(--fr);stroke-width:2"/>
    <text x="448" y="44" text-anchor="middle" class="b m">Book()</text><text x="448" y="74" text-anchor="middle" class="s m">this("", "")</text>
    <rect x="100" y="170" width="400" height="104" rx="10" style="fill:var(--te);fill-opacity:.18;stroke:var(--te);stroke-width:2"/>

    <text x="300" y="230" text-anchor="middle" class="s m">this.title = title;</text><text x="300" y="256" text-anchor="middle" class="s m">this.author = author;</text></g>
  <g data-s="2"><path class="d" d="M152,94 L226,164" style="stroke:var(--oc);stroke-width:2.5;fill:none"/><path d="M218,162 L230,168 L226,155 Z" style="fill:var(--oc)"/>
    <text x="40" y="140" class="s b" style="fill:var(--oc)">"춘향전" →</text></g>
  <g data-s="3"><path class="d" d="M448,94 L374,164" style="stroke:var(--fr);stroke-width:2.5;fill:none"/><path d="M374,155 L370,168 L382,162 Z" style="fill:var(--fr)"/>
    <text x="300" y="306" text-anchor="middle" class="s b" style="fill:var(--fr)">Book() 로 돌아와서 → 기본 생성자 호출됨</text></g>
  <g data-s="4"><text x="40" y="350" class="s">매개변수 2개</text><text x="560" y="350" text-anchor="end" class="b">어린왕자 · 생텍쥐페리</text>
    <text x="40" y="382" class="s">매개변수 1개</text><text x="560" y="382" text-anchor="end" class="b">춘향전 · 작자미상</text>
    <text x="40" y="414" class="s">매개변수 0개</text><text x="560" y="414" text-anchor="end" class="b">빈 문자열 · 빈 문자열</text></g>
  <g data-s="5"><text x="300" y="456" text-anchor="middle" class="s b" style="fill:var(--ap)">⚠️ this() = 생성자 안에서만 · 반드시 첫 문장</text></g>
</svg>

<!-- ② 메소드 오버로딩 — 매개변수 개수 · 타입으로 골라 부름 -->
<svg data-fig="overload" viewBox="0 0 600 420" role="img" aria-label="오버로딩된 getSum 메소드 호출" hidden>

    <rect x="300" y="34" width="290" height="70" rx="10" style="fill:var(--te);fill-opacity:.14;stroke:var(--te);stroke-width:2"/>

    <rect x="300" y="122" width="290" height="70" rx="10" style="fill:var(--te);fill-opacity:.14;stroke:var(--te);stroke-width:2"/>

    <path class="d" d="M264,157 L294,157" style="stroke:var(--ink2);stroke-width:2.5;fill:none"/><path d="M290,151 L300,157 L290,163 Z" style="fill:var(--ink2)"/></g>
  <g data-s="3"><rect x="10" y="210" width="252" height="70" rx="10" style="fill:var(--inh);fill-opacity:.14;stroke:var(--inh);stroke-width:2"/>

    <rect x="300" y="210" width="290" height="70" rx="10" style="fill:var(--oc);fill-opacity:.2;stroke:var(--oc);stroke-width:2"/>
    <text x="445" y="238" text-anchor="middle" class="s m b">getSum(double, double)</text><text x="445" y="268" text-anchor="middle" class="s">double 리턴 · i + j</text>
    <path class="d" d="M264,245 L294,245" style="stroke:var(--ink2);stroke-width:2.5;fill:none"/><path d="M290,239 L300,245 L290,251 Z" style="fill:var(--ink2)"/></g>
  <g data-s="4"><rect x="10" y="300" width="580" height="108" rx="10" class="dash" style="stroke:var(--ap)"/>
    <text x="30" y="328" class="s m">int getSum(int i, int j)</text><text x="30" y="356" class="s m">double getSum(int i, int j)</text>
    <text x="300" y="392" text-anchor="middle" class="s b" style="fill:var(--ap)">❌ 리턴 타입만 다름 → 오버로딩 실패 (컴파일 오류)</text></g>
</svg>

<!-- ③ 접근 지정자 4가지 — 공개 범위 -->
<svg data-fig="access" viewBox="0 0 600 480" role="img" aria-label="private 디폴트 protected public 공개 범위" hidden>

  <g data-s="3"><rect x="30" y="52" width="540" height="236" rx="14" style="fill:var(--inh);fill-opacity:.07;stroke:var(--inh);stroke-width:2"/>

  <g data-s="2"><rect x="50" y="94" width="500" height="180" rx="12" style="fill:var(--oc);fill-opacity:.1;stroke:var(--oc);stroke-width:2"/>
    <text x="66" y="122" class="b" style="fill:var(--oc)">디폴트 (생략)</text><text x="534" y="122" text-anchor="end" class="s">같은 패키지</text></g>
  <g data-s="1"><rect x="70" y="136" width="460" height="124" rx="10" style="fill:var(--ap);fill-opacity:.1;stroke:var(--ap);stroke-width:2"/>
    <text x="86" y="164" class="b" style="fill:var(--ap)">private</text><text x="514" y="164" text-anchor="end" class="s">같은 클래스 안만</text>
    <text x="300" y="214" text-anchor="middle" class="s">외부로부터 완벽 차단</text><text x="300" y="242" text-anchor="middle" class="s">(상속받은 자식도 X)</text></g>
  <g data-s="5"><text x="24" y="346" class="s m">aClass.a = 10;</text><text x="250" y="346" class="s b" style="fill:var(--te)">✅ public</text>
    <text x="24" y="380" class="s m">aClass.b = 10;</text><text x="250" y="380" class="s b" style="fill:var(--ap)">❌ private → 컴파일 오류</text>
    <text x="24" y="414" class="s m">aClass.c = 10;</text><text x="250" y="414" class="s b" style="fill:var(--te)">✅ 디폴트 (같은 패키지)</text>
    <text x="300" y="456" text-anchor="middle" class="s m" style="fill:var(--ap)">b has private access in Sample</text></g>
</svg>

<!-- ④ static — 클래스에 하나 · 모든 객체가 공유 (Counter) -->

    <text x="236" y="106" text-anchor="middle" class="b">0</text></g>
  <g data-s="2"><rect x="16" y="196" width="264" height="112" rx="12" style="fill:var(--inh);fill-opacity:.12;stroke:var(--inh);stroke-width:2"/>
    <text x="148" y="224" text-anchor="middle" class="b">cnt1 객체</text><text x="148" y="254" text-anchor="middle" class="s m">instanceCount</text><text x="108" y="290" text-anchor="middle" class="b">0</text>
    <rect x="320" y="196" width="264" height="112" rx="12" style="fill:var(--inh);fill-opacity:.12;stroke:var(--inh);stroke-width:2"/>
    <text x="452" y="224" text-anchor="middle" class="b">cnt2 객체</text><text x="452" y="254" text-anchor="middle" class="s m">instanceCount</text><text x="412" y="290" text-anchor="middle" class="b">0</text>
    <path class="dash" d="M148,194 L240,126 M452,194 L360,126"/><text x="300" y="168" text-anchor="middle" class="s b" style="fill:var(--oc)">같은 칸 공유</text></g>
  <g data-s="3"><text x="300" y="106" text-anchor="middle" class="b" style="fill:var(--oc)">→ 1</text><text x="162" y="290" text-anchor="middle" class="b" style="fill:var(--te)">→ 1</text>
    <text x="148" y="342" text-anchor="middle" class="s m b">cnt1.add1()</text></g>
  <g data-s="4"><text x="364" y="106" text-anchor="middle" class="b" style="fill:var(--ap)">→ 2</text><text x="466" y="290" text-anchor="middle" class="b" style="fill:var(--te)">→ 1</text>
    <text x="452" y="342" text-anchor="middle" class="s m b">cnt2.add1()</text></g>
  <g data-s="5"><text x="20" y="390" class="s m">Counter.gongyuCount → 2</text><text x="316" y="390" class="s m">cnt1.gongyuCount → 2</text>
    <text x="20" y="422" class="s m">cnt1.instanceCount → 1</text><text x="316" y="422" class="s m">cnt2.instanceCount → 1</text>
    <text x="300" y="464" text-anchor="middle" class="s b" style="fill:var(--main)">static = 클래스에 하나 · 객체 이름으로 읽어도 같은 칸</text></g>
</svg>

<!-- ⑤ 객체 배열 — Book[] book = new Book[2] -->
<svg data-fig="objarr" viewBox="0 0 600 460" role="img" aria-label="객체 배열은 레퍼런스 배열을 만든 뒤 칸마다 객체를 만든다" hidden>
  <g data-s="1"><text x="20" y="30" class="s m b">① Book[] book = new Book[2];</text>

    <path class="d" d="M76,115 L156,82" style="stroke:var(--ink2);stroke-width:2;fill:none"/><path d="M150,78 L160,80 L154,88 Z" style="fill:var(--ink2)"/>
    <rect x="160" y="50" width="90" height="40" style="fill:var(--card);stroke:var(--inh);stroke-width:2"/><rect x="160" y="90" width="90" height="40" style="fill:var(--card);stroke:var(--inh);stroke-width:2"/>
    <text x="205" y="76" text-anchor="middle" class="s m">null</text><text x="205" y="116" text-anchor="middle" class="s m">null</text>
    <text x="270" y="76" class="s">[0]</text><text x="270" y="116" class="s">[1]</text>
    <text x="320" y="96" class="s">레퍼런스 칸만 생김</text><text x="320" y="122" class="s">(객체는 아직 없음)</text></g>

    <path class="ln" d="M76,245 L156,222"/><rect x="160" y="196" width="90" height="40" style="fill:var(--card);stroke:var(--inh);stroke-width:2"/><rect x="160" y="236" width="90" height="40" style="fill:var(--card);stroke:var(--inh);stroke-width:2"/>
    <circle cx="205" cy="216" r="5" style="fill:var(--ink)"/><circle cx="205" cy="256" r="5" style="fill:var(--ink)"/>
    <path class="d" d="M211,216 L292,210" style="stroke:var(--te);stroke-width:2.2;fill:none"/><path d="M286,204 L296,210 L286,216 Z" style="fill:var(--te)"/>
    <path class="d" d="M211,256 L292,262" style="stroke:var(--te);stroke-width:2.2;fill:none"/><path d="M286,256 L296,262 L286,268 Z" style="fill:var(--te)"/>
    <rect x="298" y="190" width="292" height="40" rx="8" style="fill:var(--te);fill-opacity:.16;stroke:var(--te);stroke-width:2"/><text x="444" y="216" text-anchor="middle" class="s b">사랑의 기술 · 에리히 프롬</text>
    <rect x="298" y="242" width="292" height="40" rx="8" style="fill:var(--te);fill-opacity:.16;stroke:var(--te);stroke-width:2"/><text x="444" y="268" text-anchor="middle" class="s b">시간의 역사 · 스티븐 호킹</text></g>
  <g data-s="3"><text x="20" y="330" class="s m b">③ book[i].title · book[i].author</text>
    <text x="20" y="364" class="s">(사랑의 기술, 에리히 프롬)(시간의 역사, 스티븐 호킹)</text></g>
  <g data-s="4"><text x="20" y="412" class="s b" style="fill:var(--ap)">⚠️ ② 없이 book[0].title</text><text x="20" y="440" class="s m" style="fill:var(--ap)">→ NullPointerException</text></g>
</svg>

<!-- ⑥ 10주차 — 상속 객체 (Point · ColorPoint · 5장 6 ~ 8 · 21쪽) -->
<svg data-fig="inherit" viewBox="0 0 600 480" role="img" aria-label="ColorPoint 객체 하나 안의 Point 부분과 ColorPoint 부분" hidden>

            "<b>자동</b> 박싱 · 언박싱 (JDK 1.5 부터) — <code>Integer ten = 10;</code> · <code>int n = ten;</code> → 예제 6-6 <code>m = 20</code>",
            "많은 메소드가 <b>static</b> — <code>Integer.parseInt(\"100\")</code> → 100 · <code>toHexString(28)</code> → 1c · <code>toBinaryString(28)</code> → 11100" ],
          note: "⚠️ 39쪽 주석은 toHexString ↔ toBinaryString 설명이 서로 바뀜 (Hex = 16진수 · Binary = 2진수 · 출력은 맞음) · 28 = 16+8+4 = 11100 → 0001 1100 → 1c" },
        { id: "strmeth", week: 12, tab: "⑲ String 메소드", src: "6장 44 · 45 · 48 · 49 · 50쪽 — String 주요 메소드 · 예제 6-7 · 12주차 수업 파일 StringEx.java",
          steps: [
            "<code>a = new String(\" C#\")</code> — 앞에 공백 포함 <b>3글자</b> · <code>contains(\"#\")</code> true",
            "<code>concat(b)</code> → <b>새 문자열</b> <code>\" C#,C++ \"</code> 을 a 에 다시 대입 · <code>trim()</code> → 앞뒤 공백 제거 <code>\"C#,C++\"</code>",
            "<code>replace(\"C#\", \"Java\")</code> → <code>\"Java,C++\"</code> · <code>split(\",\")</code> → 배열 <code>{\"Java\", \"C++\"}</code>",
            "<code>substring(5)</code> — 인덱스 <b>5부터 끝까지</b> → J0 a1 v2 a3 ,4 <b>C5</b> → <code>\"C++\"</code>",
            "<code>charAt(2)</code> → C0 +1 <b>+2</b> → <code>'+'</code> · String 은 <b>수정 불가</b> → 바꾼 결과를 쓰려면 다시 대입" ],
          note: "⚠️ 47쪽 <code>\"I love \".concat(\"Java.\")</code> 의 결과는 \"I love Java.\" (슬라이드의 대문자 L 은 오타 · javac 확인)" },
        { id: "alist", week: 13, tab: "⑳ ArrayList", src: "13주차 7장 18 ~ 24쪽 · ✍️ 수업 ArrayListEx1 · ArrayListEx2",
          steps: [
            "<code>add(5)</code> · <code>add(4)</code> · <code>add(-1)</code> — 뒤에 차례로 → [5, 4, -1]",
            "<code>add(2, 100)</code> — <b>2번 자리에 끼워 넣기</b> · 뒤는 한 칸씩 밀림 → [5, 4, 100, -1]",
            "<code>get(2)</code> = 100 · <code>size()</code> = 4 · 인덱스는 <b>0부터</b>",
            "<code>remove(1)</code> — 그 자리를 지우고 뒤 요소가 앞으로 당겨짐 (🤖 숫자로 든 예 · 수업은 Point 객체)" ],
          note: "✍️ 수업 ArrayListEx1 → 5 · 4 · 100 · -1 · ArrayListEx2 는 Point 4개 중 1번을 지워 3개 · 문제1 은 remove(\"박민수\") 처럼 값으로도 지움" },
        { id: "foreach", week: 13, tab: "㉑ for · for-each", src: "13주차 ✍️ 수업 코드 “위 for문과 아래 for문은 같음” · 노션 “ArrayList for문 실수 예”",
          steps: [
            "인덱스 for — <code>for (int index = 0; index &lt; list.size(); index++)</code> 안에서 <code>list.get(index)</code>",
            "for-each — <code>for (int x : list)</code> 앞에서부터 하나씩 · 두 for 문의 결과는 같음",
            "✍️ <code>index = 1</code> 로 시작하면 <b>0번 칸을 건너뜀</b> (위 for 2줄 + 아래 for-each 3줄 = 5줄이 됐던 실수)",
            "<code>ArrayList&lt;String&gt;</code> 에 <code>add(1)</code> → 컴파일 오류 · 기본 타입은 <code>Integer</code> 같은 Wrapper 로" ],
          note: "✍️ 수업 코드의 for-each 변수 이름은 hangae (낱개) — 이름은 마음대로" }
    ];

    var tabsBox = document.getElementById("tabs"), cap = document.getElementById("cap"), src = document.getElementById("src"),
        note = document.getElementById("note"), pos = document.getElementById("pos"), box = document.getElementById("box");
    var S = { fig: 0, step: 0, timers: [] };   // step 0 = 전체

    function svgOf(i) { return document.querySelector('svg[data-fig="' + FIGS[i].id + '"]'); }
    function parts(svgEl) { return Array.prototype.slice.call(svgEl.querySelectorAll("[data-s]")); }
    function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; }

    function drawIn(root) {                       // 선이 그려지듯이 (stroke-dashoffset)
        var list = root.matches && root.matches(".d") ? [root] : [];
        list = list.concat(Array.prototype.slice.call(root.querySelectorAll(".d")));
        list.forEach(function (p) {
            if (!p.getTotalLength) return;
            var L; try { L = p.getTotalLength(); } catch (e) { return; }
            if (!L) return;
            p.style.transition = "none"; p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
            p.getBoundingClientRect();
            p.style.transition = "stroke-dashoffset 0.9s ease"; p.style.strokeDashoffset = 0;
            setTimeout(function () { p.style.strokeDasharray = ""; }, 1000);
        });
    }

    function renderCap() {
        var f = FIGS[S.fig];
        cap.innerHTML = "";
        f.steps.forEach(function (t, i) {
            var li = document.createElement("li"); li.innerHTML = t;
            if (S.step && i + 1 === S.step) li.className = "cur";
            else if (S.step && i + 1 > S.step) li.className = "later";
            li.addEventListener("click", function () { go(i + 1); });
            cap.appendChild(li);
        });
        pos.textContent = S.step ? S.step + " / " + f.steps.length + " 단계" : "전체 " + f.steps.length + " 단계";
    }

    function apply(animateNew) {                  // 지금 단계에 맞게 보이기 · 숨기기
        var svgEl = svgOf(S.fig);
        parts(svgEl).forEach(function (g) {
            var k = +g.getAttribute("data-s");
            var wasOff = g.classList.contains("off");
            var show = !S.step || k <= S.step;
            g.classList.toggle("off", !show);
            g.classList.toggle("hl", !!S.step && k === S.step);
            if (show && wasOff && animateNew) drawIn(g);
        });
        renderCap();
    }

    function drawAll() {                          // 전체를 단계 순서대로 그리면서 보여 주기
        clearTimers();
        var svgEl = svgOf(S.fig), n = FIGS[S.fig].steps.length;
        S.step = 0;
        parts(svgEl).forEach(function (g) { g.classList.add("off"); g.classList.remove("hl"); });
        drawIn(svgEl);
        renderCap();
        for (var k = 1; k <= n; k++) (function (k) {
            S.timers.push(setTimeout(function () {
                parts(svgEl).forEach(function (g) { if (+g.getAttribute("data-s") === k) { g.classList.remove("off"); drawIn(g); } });
            }, 350 + (k - 1) * 650));
        })(k);
    }

    function go(step) {
        clearTimers();
        var n = FIGS[S.fig].steps.length;
        S.step = Math.max(1, Math.min(n, step));
        apply(true);
    }

    function show(i, draw) {
        clearTimers();
        S.fig = i; S.step = 0;
        Array.prototype.forEach.call(document.querySelectorAll("svg[data-fig]"), function (s) {   // SVG 는 .hidden 속성이 없어서 attribute 로
            if (s.getAttribute("data-fig") === FIGS[i].id) s.removeAttribute("hidden"); else s.setAttribute("hidden", "");
        });
        Array.prototype.forEach.call(tabsBox.children, function (b, j) { b.setAttribute("aria-pressed", j === i ? "true" : "false"); });
        src.innerHTML = "📄 " + FIGS[i].src;
        note.innerHTML = FIGS[i].note || "";
        if (draw) drawAll(); else { parts(svgOf(i)).forEach(function (g) { g.classList.remove("off", "hl"); }); renderCap(); }
        tell();
    }

    // 주차로 골라 보기 — ?week=5 = 그 주차 그림만 · ?weeks=1-7 = 그 범위 (주차 페이지 · 중간고사 · 기말고사 · 완전정리가 같은 그림 파일을 나눠 씀 · README 🎨)
    (function () {
        var q = location.search, m1 = /[?&]week=(\d+)/.exec(q), m2 = /[?&]weeks=(\d+)-(\d+)/.exec(q);
        if (!m1 && !m2) return;
        var lo = m1 ? +m1[1] : +m2[1], hi = m1 ? +m1[1] : +m2[2];
        var keep = FIGS.filter(function (f) { return [].concat(f.week).some(function (w) { return w >= lo && w <= hi; }); });
        if (keep.length) FIGS = keep;
    })();

    // 그림 검사 — 콘솔에서 figCheck() → 글자끼리 겹침 · 600 폭 밖으로 넘침 목록 (없으면 [] · 폰 폭에서도 한 번 더)
    window.figCheck = function () {
        var out = [];
        Array.prototype.forEach.call(document.querySelectorAll("svg[data-fig]"), function (sv) {
            var wasHidden = sv.hasAttribute("hidden"); sv.removeAttribute("hidden");
            var vb = sv.viewBox.baseVal, ts = Array.prototype.map.call(sv.querySelectorAll("text"), function (t) { return { t: t, b: t.getBBox() }; });
            ts.forEach(function (o) { if (o.b.x < -1 || o.b.x + o.b.width > vb.width + 1) out.push(sv.getAttribute("data-fig") + " 넘침: " + o.t.textContent.slice(0, 24)); });
            for (var i = 0; i < ts.length; i++) for (var j = i + 1; j < ts.length; j++) {
                var a = ts[i].b, c = ts[j].b, ox = Math.min(a.x + a.width, c.x + c.width) - Math.max(a.x, c.x), oy = Math.min(a.y + a.height, c.y + c.height) - Math.max(a.y, c.y);
                if (ox > 2 && oy > 3) out.push(sv.getAttribute("data-fig") + " 겹침: " + ts[i].t.textContent.slice(0, 16) + " × " + ts[j].t.textContent.slice(0, 16));
            }
            if (wasHidden) sv.setAttribute("hidden", "");
        });
        return out;
    };

    FIGS.forEach(function (f, i) {
        var b = document.createElement("button"); b.type = "button"; b.textContent = f.tab;
        b.addEventListener("click", function () { show(i, true); try { history.replaceState(null, "", "#" + f.id); } catch (e) {} });
        tabsBox.appendChild(b);
    });
    document.getElementById("redraw").addEventListener("click", function () { drawAll(); });
    document.getElementById("all").addEventListener("click", function () { clearTimers(); S.step = 0; apply(false); });
    document.getElementById("prev").addEventListener("click", function () { go(S.step ? S.step - 1 : 1); });
    document.getElementById("next").addEventListener("click", function () { go(S.step ? S.step + 1 : 1); });
    document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") go(S.step + 1); else if (e.key === "ArrowLeft") go(S.step ? S.step - 1 : 1); });

    // 주차 페이지 iframe 높이 맞추기 (build_weeks.py 의 🎬 와 같은 약속)
    function tell() { try { if (parent !== window) parent.postMessage({ wkAnimH: Math.ceil(box.getBoundingClientRect().height) + 4 }, "*"); } catch (e) {} }
    if (window.ResizeObserver) new ResizeObserver(tell).observe(box);
    window.addEventListener("load", tell);

    var start = 0, h = (location.hash || "").slice(1);
    FIGS.forEach(function (f, i) { if (f.id === h) start = i; });
    show(start, false);
    // 처음 화면에 보일 때 한 번 그리면서 보여 주기
    if (window.IntersectionObserver) {
        var done = false;
        new IntersectionObserver(function (es) { if (!done && es[0].isIntersecting) { done = true; drawAll(); } }, { threshold: 0.3 }).observe(document.querySelector(".stage"));
    }
})();
</script>
