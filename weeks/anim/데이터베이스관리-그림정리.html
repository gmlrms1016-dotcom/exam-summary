<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터베이스관리 그림 정리</title>
<script>
    // 사이트와 같은 테마 (theme.js 의 저장값 "exam-summary-theme" — 없으면 다크)
    (function () {
        function pick() { try { return localStorage.getItem("exam-summary-theme") === "light" ? "light" : "dark"; } catch (e) { return "dark"; } }
        var forced = /[?&]theme=(light|dark)\b/.exec(location.search);
        document.documentElement.setAttribute("data-theme", forced ? forced[1] : pick());
        window.addEventListener("storage", function (e) { if (e.key === "exam-summary-theme") document.documentElement.setAttribute("data-theme", pick()); });
    })();
</script>
<style>
    :root{--bg:#f4f6f4;--card:#fff;--line:#d7ddd7;--ink:#1d241e;--ink2:#5d6a60;--main:#2d6a4f;
          --cell:#7c6ae6;--myelin:#e0a838;--astro:#e0862b;--oligo:#0f9f74;--micro:#d9363e;--schwann:#2b8fd1;--vessel:#d9363e;
          --ex:#16a34a;--inh:#2563eb;--ap:#e5484d;--fore:#e0862b;--mid:#c9b48a;--hind:#a0522d;
          --fr:#8b7cf6;--pa:#ec5f9e;--te:#22b07d;--oc:#e9b52c;--light:#f5a524;--eye:#eef4fb;--nerve:#e8a3a3;--hl:#f59e0b;}
    html[data-theme=dark]{--bg:#0c1014;--card:#13171b;--line:#262a2f;--ink:#f5f5f5;--ink2:#a8a8a8;--main:#4cb5f9;
          --cell:#a596f5;--myelin:#f0c35a;--astro:#f5a04a;--oligo:#34d399;--micro:#ff6369;--schwann:#5ab8f0;--vessel:#ff6369;
          --ex:#4cc38a;--inh:#6b9cff;--ap:#ff6369;--fore:#f5a04a;--mid:#d9c79c;--hind:#d07a4f;
          --fr:#a596f5;--pa:#f27db3;--te:#4cc38a;--oc:#f5c84a;--light:#ffb547;--eye:#1c2733;--nerve:#c97878;--hl:#ffb547;}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
    .box{max-width:780px;margin:0 auto;padding:10px 12px 14px;}
    .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 8px;}
    .tabs button{min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 4px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;line-height:1.25;}
    .tabs button[aria-pressed=true]{border-color:var(--main);color:var(--main);box-shadow:inset 0 0 0 1px var(--main);}
    .src{margin:0 0 6px;font-size:13px;color:var(--ink2);}
    .src b{color:var(--main);}
    .stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;}
    svg{display:block;width:100%;height:auto;}
    svg[hidden]{display:none;}
    svg text{fill:var(--ink);font-family:inherit;font-size:19px;}
    svg text.s{font-size:15px;fill:var(--ink2);}
    svg text.b{font-weight:800;}
    svg text.w{fill:#fff;}
    svg text.m{font-family:Menlo,Consolas,"D2Coding",monospace;}
    svg .ln{stroke:var(--ink2);stroke-width:1.6;fill:none;}
    svg .ax{stroke:var(--ink2);stroke-width:2;fill:none;}
    svg .dash{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:6 5;fill:none;}
    svg [data-s]{transition:opacity .45s ease;}
    svg [data-s].off{opacity:0;}
    svg [data-s].dim{opacity:.28;}
    svg [data-s].hl{filter:drop-shadow(0 0 5px var(--hl));}
    .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;}
    .ctl button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;}
    .ctl button.main{border-color:var(--main);color:var(--main);}
    .ctl .pos{margin-left:auto;font-size:13px;color:var(--ink2);}
    ol.cap{margin:8px 0 0;padding:9px 12px 9px 34px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14.5px;line-height:1.65;}
    ol.cap li{margin:2px 0;padding:1px 4px;border-radius:6px;cursor:pointer;}
    ol.cap li b{color:var(--main);}
    ol.cap li.cur{background:color-mix(in srgb,var(--hl) 22%,transparent);}
    ol.cap li.later{opacity:.45;}
    .note{margin:6px 0 0;font-size:13px;color:var(--ink2);line-height:1.6;}
    .note a{color:var(--main);}
    @media (max-width:560px){ .tabs{grid-template-columns:repeat(3,minmax(0,1fr));} .tabs button{font-size:12px;} ol.cap{font-size:14px;padding-left:28px;}
        /* 폰: 그림이 작아지니 그림 속 글자를 키움 (긴 줄도 600 폭 안에 들어가는 크기까지만) */
        svg text{font-size:22px;} svg text.s{font-size:17px;} .stage{padding:3px;} }
</style>
</head>
<body>
<div class="box" id="box">
    <div class="tabs" id="tabs" role="group" aria-label="그림 고르기"></div>
    <p class="src" id="src"></p>
    <div class="stage">

  <g data-s="4"><circle cx="186" cy="338" r="17" style="fill:var(--inh)"/><text x="186" y="345" text-anchor="middle" class="b w">4</text>
    <text x="236" y="332" class="s b">HAVING AVG(점수) &gt;= 75</text><text x="236" y="358" class="s">그룹 조건 → 78.5 · 75 · 82.5 모두 통과</text></g>
  <g data-s="5"><circle cx="186" cy="58" r="17" style="fill:var(--te)"/><text x="186" y="65" text-anchor="middle" class="b w">5</text>

    <text x="236" y="402" class="s b">ORDER BY AVG(점수) DESC</text><text x="236" y="428" class="s">수학 82.5 → 영어 78.5 → 국어 75</text></g>
  <g data-s="6"><text x="14" y="474" class="s b" style="fill:var(--ap)">WHERE 에 AVG(점수) → ERROR 1111 → 그룹 조건은 HAVING</text></g>
</svg>

          steps: [
            "<b>①</b> <code>sum(col2)</code> — 집계함수는 NULL 을 빼고 → 20 + 70 = <b>90</b> → “결과는 NULL 이다” ✕",
            "<b>②</b> <code>sum(col1 + col2 + col3)</code> — 행마다 먼저 더함 → 1 · 2행은 NULL 이 섞여 <b>NULL</b> · 3행만 140 → 합 <b>140</b> → “185” ✕",
            "🔥 <b>③</b> <code>sum(col2 + col3)</code> — 행마다 → NULL · NULL · 90 → 합 <b>90</b> → ⭕ <b>정답</b>",
            "<b>④</b> <code>sum(col2) + sum(col3)</code> — 열마다 따로 합한 뒤 더함 → 90 + 20 = <b>110</b> → “90” ✕",
            "6쪽 정리 — 1. 칸(컬럼)끼리 연산할 때 NULL 이 있으면 항상 <b>NULL</b> · 2. 집계함수는 여러 행을 모을 때 NULL 을 <b>연산 대상에서 제외</b>" ],
          note: "✍️ 엑셀 답 “① X 90 · ② X 140 · ③ O 90 · ④ X 110” 전부 맞음 (MySQL 8.4 로 확인) · 문제의 number 는 Oracle 자료형 → MySQL 에서는 int 로 실행" },
        { id: "setop", week: 11, tab: "⑨ 집합 연산 R · S", src: "11주차 ✍️ 필기 [QUIZ 11-4] · 강의자료 7쪽 — R(A, B, C) · S(B, C, D) · “관계대수식으로 작성하시오”",
          steps: [
            "<b>프로젝션 π B,C</b> — R 과 S 에서 B · C 열만 → 두 결과의 열 개수 · 도메인이 같아짐 (합병 가능)",
            "<b>1) 합집합</b> <code>π B,C(R) ∪ π B,C(S)</code> → <code>UNION</code> → 중복은 한 번만 → <b>4행</b> (✍️ 내 답 그대로)",
            "<b>2) 교집합</b> <code>π B,C(R) ∩ π B,C(S)</code> → <code>INTERSECT</code> → 양쪽 다 있는 (b1, c1) <b>1행</b>",
            "<b>3) 차집합</b> <code>π B,C(R) − π B,C(S)</code> → R 에만 있는 (b1, c2) · (b2, c3) — 슬라이드의 <code>MINUS</code> 는 Oracle 문법",
            "<b>4) 카티션 프로덕트</b> <code>R × S</code> → <code>SELECT * FROM R, S;</code> → 4 × 3 = <b>12행</b> · 열 3 + 3 = 6개",
            "⚠️ MySQL 에서 <code>MINUS</code> → ERROR 1064 · <b>MySQL 8.0.31+ 는 <code>EXCEPT</code> · <code>INTERSECT</code></b> (이 맥 8.4 로 확인) · 기말은 합집합만 (10주차 🔥)" ],
          note: "⚠️ 수업요약 txt 의 R INSERT 는 3행이 <code>('a2','b1','c2')</code> 라 슬라이드의 a3 와 달라요 (오타로 보임) — B · C 결과는 같고 4) 의 A 열만 달라짐 · 그림은 슬라이드(7쪽) 값" },
        { id: "outer", week: 11, tab: "⑩ 내부 · 외부조인", src: "11주차 ✍️ 필기 “내부조인 : 일치하는 행 검색 · 외부조인 : 일치하지 않는 행도 검색” · 강의자료 11 ~ 19쪽 [실습] freshman · dmember",
          steps: [
            "<b>내부조인</b> (동등조인) — <code>freshman.name = dmember.name</code> 인 짝만 → 김광식 · 김현정 <b>2행</b> · 방법1 <code>FROM … , … WHERE</code> = 방법2 <code>INNER JOIN … ON</code>",
            "<b>자연조인</b> — 동등조인에서 공통 필드(name) 하나를 빼고 → <code>SELECT freshman.name, address, dept_name …</code> (name 만 쓰면 ERROR 1052 모호함)",
            "<b>왼쪽 외부조인</b> <code>LEFT OUTER JOIN</code> — 왼쪽(freshman) 행은 짝이 없어도 다 → 조영수 · 대전 · <b>NULL · NULL</b> (3행)",
            "<b>오른쪽 외부조인</b> <code>RIGHT OUTER JOIN</code> — 오른쪽(dmember) 행은 다 → <b>NULL · NULL</b> · 이진영 · 전자공학과 (3행)",
            "<b>완전 외부조인</b> — 양쪽 다 → <b>4행</b> · MySQL 은 <code>FULL OUTER JOIN</code> 문법이 없어서 (ERROR 1064) <b>왼쪽 <code>UNION</code> 오른쪽</b> (✍️ 내 필기 그대로)",
            "⚠️ 19쪽 답안처럼 뒤쪽을 <code>dmember LEFT OUTER JOIN freshman</code> 로 쓰면 열 순서가 (name, dept_name, name, address) 로 바뀌어 UNION 이 열을 엇갈려 합침 → 6행 · <code>freshman RIGHT OUTER JOIN dmember</code> 로 써야 4행" ],
          note: "결과는 MySQL 8.4 로 실행한 값 · ✍️ 실습 엑셀 “외부조인-답안” 시트와 같음 · 카티션 프로덕트는 3 × 3 = 9행 (<a href=\"../데이터베이스관리-11주차.html\" target=\"_top\">11주차 페이지</a>)" }
    ];

    var tabsBox = document.getElementById("tabs"), cap = document.getElementById("cap"), src = document.getElementById("src"),
        note = document.getElementById("note"), pos = document.getElementById("pos"), box = document.getElementById("box");
    var S = { fig: 0, step: 0, timers: [] };   // step 0 = 전체

    function svgOf(i) { return document.querySelector('svg[data-fig="' + FIGS[i].id + '"]'); }
    function parts(svgEl) { return Array.prototype.slice.call(svgEl.querySelectorAll("[data-s]")); }
    function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; }

    function drawIn(root) {                       // 선이 그려지듯이 (stroke-dashoffset)
        var list = root.matches && root.matches(".d") ? [root] : [];
        list = list.concat(Array.prototype.slice.call(root.querySelectorAll(".d")));
        list.forEach(function (p) {
            if (!p.getTotalLength) return;
            var L; try { L = p.getTotalLength(); } catch (e) { return; }
            if (!L) return;
            p.style.transition = "none"; p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
            p.getBoundingClientRect();
            p.style.transition = "stroke-dashoffset 0.9s ease"; p.style.strokeDashoffset = 0;
            setTimeout(function () { p.style.strokeDasharray = ""; }, 1000);
        });
    }

    function renderCap() {
        var f = FIGS[S.fig];
        cap.innerHTML = "";
        f.steps.forEach(function (t, i) {
            var li = document.createElement("li"); li.innerHTML = t;
            if (S.step && i + 1 === S.step) li.className = "cur";
            else if (S.step && i + 1 > S.step) li.className = "later";
            li.addEventListener("click", function () { go(i + 1); });
            cap.appendChild(li);
        });
        pos.textContent = S.step ? S.step + " / " + f.steps.length + " 단계" : "전체 " + f.steps.length + " 단계";
    }

    function apply(animateNew) {                  // 지금 단계에 맞게 보이기 · 숨기기
        var svgEl = svgOf(S.fig);
        parts(svgEl).forEach(function (g) {
            var k = +g.getAttribute("data-s");
            var wasOff = g.classList.contains("off");
            var show = !S.step || k <= S.step;
            g.classList.toggle("off", !show);
            g.classList.toggle("hl", !!S.step && k === S.step);
            if (show && wasOff && animateNew) drawIn(g);
        });
        renderCap();
    }

    function drawAll() {                          // 전체를 단계 순서대로 그리면서 보여 주기
        clearTimers();
        var svgEl = svgOf(S.fig), n = FIGS[S.fig].steps.length;
        S.step = 0;
        parts(svgEl).forEach(function (g) { g.classList.add("off"); g.classList.remove("hl"); });
        drawIn(svgEl);
        renderCap();
        for (var k = 1; k <= n; k++) (function (k) {
            S.timers.push(setTimeout(function () {
                parts(svgEl).forEach(function (g) { if (+g.getAttribute("data-s") === k) { g.classList.remove("off"); drawIn(g); } });
            }, 350 + (k - 1) * 650));
        })(k);
    }

    function go(step) {
        clearTimers();
        var n = FIGS[S.fig].steps.length;
        S.step = Math.max(1, Math.min(n, step));
        apply(true);
    }

    function show(i, draw) {
        clearTimers();
        S.fig = i; S.step = 0;
        Array.prototype.forEach.call(document.querySelectorAll("svg[data-fig]"), function (s) {   // SVG 는 .hidden 속성이 없어서 attribute 로
            if (s.getAttribute("data-fig") === FIGS[i].id) s.removeAttribute("hidden"); else s.setAttribute("hidden", "");
        });
        Array.prototype.forEach.call(tabsBox.children, function (b, j) { b.setAttribute("aria-pressed", j === i ? "true" : "false"); });
        src.innerHTML = "📄 " + FIGS[i].src;
        note.innerHTML = FIGS[i].note || "";
        if (draw) drawAll(); else { parts(svgOf(i)).forEach(function (g) { g.classList.remove("off", "hl"); }); renderCap(); }
        tell();
    }

    // 주차로 골라 보기 — ?week=5 = 그 주차 그림만 · ?weeks=1-7 = 그 범위 (주차 페이지 · 중간고사 · 기말고사 · 완전정리가 같은 그림 파일을 나눠 씀 · README 🎨)
    (function () {
        var q = location.search, m1 = /[?&]week=(\d+)/.exec(q), m2 = /[?&]weeks=(\d+)-(\d+)/.exec(q);
        if (!m1 && !m2) return;
        var lo = m1 ? +m1[1] : +m2[1], hi = m1 ? +m1[1] : +m2[2];
        var keep = FIGS.filter(function (f) { return [].concat(f.week).some(function (w) { return w >= lo && w <= hi; }); });
        if (keep.length) FIGS = keep;
    })();

    // 그림 검사 — 콘솔에서 figCheck() → 글자끼리 겹침 · 600 폭 밖으로 넘침 목록 (없으면 [] · 폰 폭에서도 한 번 더)
    window.figCheck = function () {
        var out = [];
        Array.prototype.forEach.call(document.querySelectorAll("svg[data-fig]"), function (sv) {
            var wasHidden = sv.hasAttribute("hidden"); sv.removeAttribute("hidden");
            var vb = sv.viewBox.baseVal, ts = Array.prototype.map.call(sv.querySelectorAll("text"), function (t) { return { t: t, b: t.getBBox() }; });
            ts.forEach(function (o) { if (o.b.x < -1 || o.b.x + o.b.width > vb.width + 1) out.push(sv.getAttribute("data-fig") + " 넘침: " + o.t.textContent.slice(0, 24)); });
            for (var i = 0; i < ts.length; i++) for (var j = i + 1; j < ts.length; j++) {
                var a = ts[i].b, c = ts[j].b, ox = Math.min(a.x + a.width, c.x + c.width) - Math.max(a.x, c.x), oy = Math.min(a.y + a.height, c.y + c.height) - Math.max(a.y, c.y);
                if (ox > 2 && oy > 3) out.push(sv.getAttribute("data-fig") + " 겹침: " + ts[i].t.textContent.slice(0, 16) + " × " + ts[j].t.textContent.slice(0, 16));
            }
            if (wasHidden) sv.setAttribute("hidden", "");
        });
        return out;
    };

    FIGS.forEach(function (f, i) {
        var b = document.createElement("button"); b.type = "button"; b.textContent = f.tab;
        b.addEventListener("click", function () { show(i, true); try { history.replaceState(null, "", "#" + f.id); } catch (e) {} });
        tabsBox.appendChild(b);
    });
    document.getElementById("redraw").addEventListener("click", function () { drawAll(); });
    document.getElementById("all").addEventListener("click", function () { clearTimers(); S.step = 0; apply(false); });
    document.getElementById("prev").addEventListener("click", function () { go(S.step ? S.step - 1 : 1); });
    document.getElementById("next").addEventListener("click", function () { go(S.step ? S.step + 1 : 1); });
    document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") go(S.step + 1); else if (e.key === "ArrowLeft") go(S.step ? S.step - 1 : 1); });

    // 주차 페이지 iframe 높이 맞추기 (build_weeks.py 의 🎬 와 같은 약속)
    function tell() { try { if (parent !== window) parent.postMessage({ wkAnimH: Math.ceil(box.getBoundingClientRect().height) + 4 }, "*"); } catch (e) {} }
    if (window.ResizeObserver) new ResizeObserver(tell).observe(box);
    window.addEventListener("load", tell);

    var start = 0, h = (location.hash || "").slice(1);
    FIGS.forEach(function (f, i) { if (f.id === h) start = i; });
    show(start, false);
    // 처음 화면에 보일 때 한 번 그리면서 보여 주기
    if (window.IntersectionObserver) {
        var done = false;
        new IntersectionObserver(function (es) { if (!done && es[0].isIntersecting) { done = true; drawAll(); } }, { threshold: 0.3 }).observe(document.querySelector(".stage"));
    }
})();
</script>
