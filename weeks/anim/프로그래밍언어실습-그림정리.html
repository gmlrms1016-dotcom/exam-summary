<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로그래밍언어실습 그림 정리</title>
<script>
    // 사이트와 같은 테마 (theme.js 의 저장값 "exam-summary-theme" — 없으면 다크)
    (function () {
        function pick() { try { return localStorage.getItem("exam-summary-theme") === "light" ? "light" : "dark"; } catch (e) { return "dark"; } }
        var forced = /[?&]theme=(light|dark)\b/.exec(location.search);
        document.documentElement.setAttribute("data-theme", forced ? forced[1] : pick());
        window.addEventListener("storage", function (e) { if (e.key === "exam-summary-theme") document.documentElement.setAttribute("data-theme", pick()); });
    })();
</script>
<style>
    :root{--bg:#f4f6f4;--card:#fff;--line:#d7ddd7;--ink:#1d241e;--ink2:#5d6a60;--main:#2d6a4f;
          --cell:#7c6ae6;--myelin:#e0a838;--astro:#e0862b;--oligo:#0f9f74;--micro:#d9363e;--schwann:#2b8fd1;--vessel:#d9363e;
          --ex:#16a34a;--inh:#2563eb;--ap:#e5484d;--fore:#e0862b;--mid:#c9b48a;--hind:#a0522d;
          --fr:#8b7cf6;--pa:#ec5f9e;--te:#22b07d;--oc:#e9b52c;--light:#f5a524;--eye:#eef4fb;--nerve:#e8a3a3;--hl:#f59e0b;}
    html[data-theme=dark]{--bg:#0c1014;--card:#13171b;--line:#262a2f;--ink:#f5f5f5;--ink2:#a8a8a8;--main:#4cb5f9;
          --cell:#a596f5;--myelin:#f0c35a;--astro:#f5a04a;--oligo:#34d399;--micro:#ff6369;--schwann:#5ab8f0;--vessel:#ff6369;
          --ex:#4cc38a;--inh:#6b9cff;--ap:#ff6369;--fore:#f5a04a;--mid:#d9c79c;--hind:#d07a4f;
          --fr:#a596f5;--pa:#f27db3;--te:#4cc38a;--oc:#f5c84a;--light:#ffb547;--eye:#1c2733;--nerve:#c97878;--hl:#ffb547;}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
    .box{max-width:780px;margin:0 auto;padding:10px 12px 14px;}
    .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 8px;}
    .tabs button{min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 4px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;line-height:1.25;}
    .tabs button[aria-pressed=true]{border-color:var(--main);color:var(--main);box-shadow:inset 0 0 0 1px var(--main);}
    .src{margin:0 0 6px;font-size:13px;color:var(--ink2);}
    .src b{color:var(--main);}
    .stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;}
    svg{display:block;width:100%;height:auto;}
    svg[hidden]{display:none;}
    svg text{fill:var(--ink);font-family:inherit;font-size:19px;}
    svg text.s{font-size:15px;fill:var(--ink2);}
    svg text.b{font-weight:800;}
    svg text.w{fill:#fff;}
    svg text.m{font-family:Menlo,Consolas,"D2Coding",monospace;}
    svg .ln{stroke:var(--ink2);stroke-width:1.6;fill:none;}
    svg .ax{stroke:var(--ink2);stroke-width:2;fill:none;}
    svg .dash{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:6 5;fill:none;}
    svg [data-s]{transition:opacity .45s ease;}
    svg [data-s].off{opacity:0;}
    svg [data-s].dim{opacity:.28;}
    svg [data-s].hl{filter:drop-shadow(0 0 5px var(--hl));}
    .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;}
    .ctl button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;}
    .ctl button.main{border-color:var(--main);color:var(--main);}
    .ctl .pos{margin-left:auto;font-size:13px;color:var(--ink2);}
    ol.cap{margin:8px 0 0;padding:9px 12px 9px 34px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14.5px;line-height:1.65;}
    ol.cap li{margin:2px 0;padding:1px 4px;border-radius:6px;cursor:pointer;}
    ol.cap li b{color:var(--main);}
    ol.cap li.cur{background:color-mix(in srgb,var(--hl) 22%,transparent);}
    ol.cap li.later{opacity:.45;}
    .note{margin:6px 0 0;font-size:13px;color:var(--ink2);line-height:1.6;}
    .note a{color:var(--main);}
    @media (max-width:560px){ .tabs{grid-template-columns:repeat(3,minmax(0,1fr));} .tabs button{font-size:12px;} ol.cap{font-size:14px;padding-left:28px;}
        /* 폰: 그림이 작아지니 그림 속 글자를 키움 (긴 줄도 600 폭 안에 들어가는 크기까지만) */
        svg text{font-size:22px;} svg text.s{font-size:17px;} .stage{padding:3px;} }
</style>
</head>
<body>
<div class="box" id="box">
    <div class="tabs" id="tabs" role="group" aria-label="그림 고르기"></div>
    <p class="src" id="src"></p>
    <div class="stage">

<!-- ① 빌드 = 컴파일 + 링크 -->
<svg data-fig="build" viewBox="0 0 600 400" role="img" aria-label="빌드는 컴파일과 링크" hidden>
  <g data-s="1"><rect x="150" y="16" width="300" height="64" rx="10" style="fill:var(--inh);fill-opacity:.15;stroke:var(--inh);stroke-width:2"/>
    <text x="300" y="42" text-anchor="middle" class="b">소스 파일</text><text x="300" y="68" text-anchor="middle" class="s m">01localvar.c</text></g>
  <g data-s="2"><path class="d" d="M300,82 L300,140" style="stroke:var(--ink2);stroke-width:2.5;fill:none"/><path d="M293,132 L300,144 L307,132 Z" style="fill:var(--ink2)"/>
    <text x="318" y="118" class="b" style="fill:var(--oc)">① 컴파일</text>
    <rect x="150" y="146" width="300" height="64" rx="10" style="fill:var(--oc);fill-opacity:.2;stroke:var(--oc);stroke-width:2"/>
    <text x="300" y="172" text-anchor="middle" class="b">목적파일</text><text x="300" y="198" text-anchor="middle" class="s">.obj (Win) · .o (Linux)</text></g>
  <g data-s="3"><rect x="470" y="146" width="120" height="64" rx="10" style="fill:var(--fr);fill-opacity:.15;stroke:var(--fr);stroke-width:2"/>
    <text x="530" y="172" text-anchor="middle" class="b">라이브러리</text><text x="530" y="198" text-anchor="middle" class="s">printf 등</text>
    <path class="d" d="M300,212 L300,266 M530,212 L530,240 L306,240" style="stroke:var(--ink2);stroke-width:2.5;fill:none"/><path d="M293,260 L300,272 L307,260 Z" style="fill:var(--ink2)"/>
    <text x="236" y="254" text-anchor="middle" class="b" style="fill:var(--te)">② 링크</text>
    <rect x="150" y="274" width="300" height="64" rx="10" style="fill:var(--te);fill-opacity:.2;stroke:var(--te);stroke-width:2"/>
    <text x="300" y="300" text-anchor="middle" class="b">실행파일</text><text x="300" y="326" text-anchor="middle" class="s">.exe (Win) · a.out (Linux)</text></g>
  <g data-s="4"><path class="ln" d="M132,18 L114,18 L114,336 L132,336"/>
    <text x="60" y="160" text-anchor="middle" class="b" style="fill:var(--main)">빌드</text><text x="60" y="186" text-anchor="middle" class="s">= 컴파일</text><text x="60" y="208" text-anchor="middle" class="s">+ 링크</text></g>
  <g data-s="5"><text x="300" y="380" text-anchor="middle" class="s" style="fill:var(--ap)">⚠️ .o = 링크 전 목적파일 (실행파일 아님)</text></g>
</svg>

<!-- ② 메모리 4 영역 -->
<svg data-fig="memory" viewBox="0 0 600 440" role="img" aria-label="코드 데이터 스택 힙 메모리 영역" hidden>
  <g data-s="1"><rect x="200" y="16" width="200" height="76" rx="8" style="fill:var(--inh);fill-opacity:.18;stroke:var(--inh);stroke-width:2"/>
    <text x="300" y="48" text-anchor="middle" class="b">코드 (code)</text><text x="300" y="76" text-anchor="middle" class="s">✍️ 중요!</text>
    <text x="418" y="48" class="s">main · 함수의</text><text x="418" y="72" class="s">명령 (기계어)</text></g>
  <g data-s="2"><rect x="200" y="100" width="200" height="76" rx="8" style="fill:var(--oc);fill-opacity:.22;stroke:var(--oc);stroke-width:2"/>
    <text x="300" y="132" text-anchor="middle" class="b">데이터 (data)</text><text x="300" y="160" text-anchor="middle" class="s">✍️ 중요!</text>
    <text x="418" y="132" class="s">전역변수</text><text x="418" y="156" class="s">static 변수</text></g>
  <g data-s="3"><rect x="200" y="184" width="200" height="76" rx="8" style="fill:var(--te);fill-opacity:.2;stroke:var(--te);stroke-width:2"/>
    <text x="300" y="216" text-anchor="middle" class="b">스택 (stack)</text><text x="300" y="244" text-anchor="middle" class="s b" style="fill:var(--ap)">✍️ 아주 중요!</text>
    <text x="418" y="216" class="s">지역변수</text><text x="418" y="240" class="s">매개변수</text></g>
  <g data-s="4"><rect x="200" y="300" width="200" height="76" rx="8" style="fill:var(--fr);fill-opacity:.18;stroke:var(--fr);stroke-width:2"/>
    <text x="300" y="332" text-anchor="middle" class="b">힙 (heap)</text><text x="300" y="360" text-anchor="middle" class="s">실행 중에 빌림</text>
    <text x="418" y="332" class="s">malloc</text><text x="418" y="356" class="s">(나중에 배움)</text></g>
  <g data-s="5"><path class="ln" d="M190,18 L172,18 L172,258 L190,258"/>
    <text x="90" y="118" text-anchor="middle" class="b">A. 정적</text><text x="90" y="144" text-anchor="middle" class="s">컴파일 때</text><text x="90" y="166" text-anchor="middle" class="s">크기 결정</text>
    <path class="ln" d="M190,302 L172,302 L172,374 L190,374"/>
    <text x="90" y="334" text-anchor="middle" class="b">B. 동적</text><text x="90" y="358" text-anchor="middle" class="s">런타임</text>
    <text x="300" y="416" text-anchor="middle" class="s">스택 칸은 함수가 불릴 때 생기고 끝나면 사라짐</text></g>
</svg>

<!-- ③ 블록 범위 — scope1_5.c -->
<svg data-fig="scope" viewBox="0 0 600 470" role="img" aria-label="지역변수의 블록 범위" hidden>
  <g><rect x="10" y="10" width="580" height="452" rx="12" class="dash"/><text x="24" y="34" class="s m">scope1_5.c</text></g>
  <g data-s="1"><rect x="30" y="140" width="540" height="306" rx="10" style="fill:var(--inh);fill-opacity:.08;stroke:var(--inh);stroke-width:2"/>
    <text x="50" y="168" class="b m">main() { … }</text><text x="50" y="194" class="s">int a = 0; → main 블록 안 어디서나</text></g>
  <g data-s="2"><rect x="60" y="210" width="480" height="104" rx="10" style="fill:var(--te);fill-opacity:.14;stroke:var(--te);stroke-width:2"/>
    <text x="80" y="238" class="b m">while (a &lt; 5) { … }</text><text x="80" y="266" class="s">int b = 20; → while 블록 안에서만</text>
    <text x="80" y="294" class="s m">a, b: 1, 20 … 5, 20</text></g>
  <g data-s="3"><text x="300" y="356" text-anchor="middle" class="m" style="fill:var(--ap)">printf("b: %d\n", b);</text>
    <text x="300" y="388" text-anchor="middle" class="s b" style="fill:var(--ap)">❌ b 는 while 블록 밖 → 컴파일 오류</text>
    <text x="300" y="420" text-anchor="middle" class="s" style="fill:var(--te)">a 는 main 블록이라 여기서도 OK</text></g>
  <g data-s="4"><rect x="30" y="50" width="260" height="74" rx="10" style="fill:var(--oc);fill-opacity:.18;stroke:var(--oc);stroke-width:2"/>
    <text x="160" y="80" text-anchor="middle" class="b m">test1()</text><text x="160" y="106" text-anchor="middle" class="s">local1 = 10</text>
    <rect x="310" y="50" width="260" height="74" rx="10" style="fill:var(--oc);fill-opacity:.18;stroke:var(--oc);stroke-width:2"/>
    <text x="440" y="80" text-anchor="middle" class="b m">test2(local2)</text><text x="440" y="106" text-anchor="middle" class="s">매개변수도 지역변수</text></g>
</svg>

<!-- ④ 지역이 전역보다 우선 — 02-1global.c -->
<svg data-fig="shadow" viewBox="0 0 600 430" role="img" aria-label="전역변수 PI 와 지역변수 PI" hidden>
  <g data-s="1"><rect x="150" y="14" width="300" height="72" rx="10" style="fill:var(--oc);fill-opacity:.22;stroke:var(--oc);stroke-width:2"/>
    <text x="300" y="44" text-anchor="middle" class="b">전역 PI = 3.14</text><text x="300" y="72" text-anchor="middle" class="s">gi = 0 (기본값) · 함수 밖</text></g>
  <g data-s="2"><rect x="16" y="130" width="276" height="200" rx="10" style="fill:var(--inh);fill-opacity:.08;stroke:var(--inh);stroke-width:2"/>
    <text x="154" y="158" text-anchor="middle" class="b m">main()</text>
    <rect x="34" y="172" width="240" height="48" rx="8" style="fill:var(--te);fill-opacity:.25;stroke:var(--te);stroke-width:2"/>
    <text x="154" y="203" text-anchor="middle" class="b">지역 PI = 3.141592</text>
    <text x="154" y="252" text-anchor="middle" class="s">둘레1 = 2 × PI × r</text><text x="154" y="280" text-anchor="middle" class="b" style="fill:var(--te)">→ 36.88</text>
    <text x="154" y="310" text-anchor="middle" class="s">PI 출력 → 3.141592</text>
    <path class="dash" d="M196,88 L104,128"/><text x="168" y="120" class="s b" style="fill:var(--ap)">✕ 가려짐</text></g>
  <g data-s="3"><rect x="308" y="130" width="276" height="200" rx="10" style="fill:var(--oc);fill-opacity:.08;stroke:var(--oc);stroke-width:2"/>
    <text x="446" y="158" text-anchor="middle" class="b m">getArea()</text><text x="446" y="184" text-anchor="middle" class="b m">getCircum()</text>
    <text x="446" y="214" text-anchor="middle" class="s">지역 PI 없음 → 전역 사용</text>
    <text x="446" y="250" text-anchor="middle" class="s">면적 = r × r × 3.14</text><text x="446" y="276" text-anchor="middle" class="b" style="fill:var(--oc)">→ 108.19</text>
    <text x="446" y="308" text-anchor="middle" class="s">둘레2 → 36.86</text>
    <path class="d" d="M380,88 L420,126" style="stroke:var(--oc);stroke-width:2.5;fill:none"/></g>
  <g data-s="4"><text x="300" y="372" text-anchor="middle" class="b" style="fill:var(--main)">같은 이름이면 지역변수가 우선</text>
    <text x="300" y="404" text-anchor="middle" class="s">둘레1(36.88) ≠ 둘레2(36.86) 인 이유</text></g>
</svg>

<!-- ⑤ 1차원 배열 — 연속 공간 · 첨자 · sizeof (10주차) -->
<svg data-fig="arr1d" viewBox="0 0 600 400" role="img" aria-label="1차원 배열 int count[5] 의 메모리" hidden>
  <g><text x="300" y="34" text-anchor="middle" class="b m">int count[5] = {10,20,30,40,50};</text></g>
  <g data-s="1"><rect x="40" y="60" width="104" height="70" rx="0" style="fill:var(--inh);fill-opacity:0.16;stroke:var(--inh);stroke-width:2"/><text x="92" y="104" text-anchor="middle" class="b">10</text><text x="92" y="158" text-anchor="middle" class="b m" style="fill:var(--main)">[0]</text><rect x="144" y="60" width="104" height="70" rx="0" style="fill:var(--inh);fill-opacity:0.16;stroke:var(--inh);stroke-width:2"/><text x="196" y="104" text-anchor="middle" class="b">20</text><text x="196" y="158" text-anchor="middle" class="b m" style="fill:var(--main)">[1]</text><rect x="248" y="60" width="104" height="70" rx="0" style="fill:var(--inh);fill-opacity:0.16;stroke:var(--inh);stroke-width:2"/><text x="300" y="104" text-anchor="middle" class="b">30</text><text x="300" y="158" text-anchor="middle" class="b m" style="fill:var(--main)">[2]</text><rect x="352" y="60" width="104" height="70" rx="0" style="fill:var(--inh);fill-opacity:0.16;stroke:var(--inh);stroke-width:2"/><text x="404" y="104" text-anchor="middle" class="b">40</text><text x="404" y="158" text-anchor="middle" class="b m" style="fill:var(--main)">[3]</text><rect x="456" y="60" width="104" height="70" rx="0" style="fill:var(--inh);fill-opacity:0.16;stroke:var(--inh);stroke-width:2"/><text x="508" y="104" text-anchor="middle" class="b">50</text><text x="508" y="158" text-anchor="middle" class="b m" style="fill:var(--main)">[4]</text></g>
  <g data-s="2"><text x="92" y="186" text-anchor="middle" class="s">+0</text><text x="196" y="186" text-anchor="middle" class="s">+4</text><text x="300" y="186" text-anchor="middle" class="s">+8</text><text x="404" y="186" text-anchor="middle" class="s">+12</text><text x="508" y="186" text-anchor="middle" class="s">+16</text><text x="300" y="222" text-anchor="middle" class="s">칸마다 int 4바이트 · 주소는 4씩 커짐</text></g>
  <g data-s="3"><text x="300" y="262" text-anchor="middle" class="b m">sizeof(count) = 5 × 4 = 20</text><text x="300" y="292" text-anchor="middle" class="s">sizeof(count[0]) = 4 · 칸 수 = 20 / 4 = 5</text></g>
  <g data-s="4"><path class="d" d="M24,330 L35.4,110.0" style="stroke:var(--ap);stroke-width:2.5;fill:none"/><path d="M28.4,109.6 L36,98 L42.4,110.3 Z" style="fill:var(--ap)"/><text x="44" y="346" text-anchor="start" class="b" style="fill:var(--ap)">count == &amp;count[0] → 배열이름 = 시작주소</text><text x="300" y="384" text-anchor="middle" class="s">short student[10] → 2바이트 × 10 = 20바이트</text></g>
</svg>

<!-- ⑥ 2차원 배열 — 행 우선 · sizeof 24 · 12 · 4 (10주차) -->
<svg data-fig="arr2d" viewBox="0 0 600 440" role="img" aria-label="2차원 배열 int count[2][3] 의 행 우선 저장" hidden>

            "<code>count</code> 와 <code>count[0]</code> 은 <b>같은 주소</b> · <code>count[1]</code> 은 12바이트 뒤 (실행 예 …e0 → …ec)" ],
          note: "주소(%p)는 실행할 때마다 달라요 — 차이(12바이트)가 핵심" },
        { id: "for8", week: 10, tab: "⑦ 🔥 8쪽 for", src: "10주차 🔥 ✍️ 노션 “8페이지 왼쪽 코드를 오른쪽으로 바꾸는 게 기말고사 문제” — 강의자료 8쪽",
          steps: [
            "왼쪽 — 배열 요소마다 <b>printf 를 한 줄씩</b> (첨자 0 · 1 · 2 를 서식 안에 직접)",
            "오른쪽 — <b><code>int i;</code></b> 추가 + <b><code>for (i = 0; i &lt; 3; i++)</code></b> · 서식은 <code>\"array1[%d]: %d\\n\"</code> · 값은 <b><code>i, array1[i]</code></b>",
            "i = 0 · 1 · 2 → <code>array1[0]</code> · <code>array1[1]</code> · <code>array1[2]</code> → 10 · 20 · 30 (조건 <b>i &lt; 3</b> = 칸 수)",
            "출력은 왼쪽 · 오른쪽 <b>똑같음</b> — array1[0]: 10 / array1[1]: 20 / array1[2]: 30" ],
          note: "7쪽도 같은 생각 — <code>student[0] = 5;</code> … 4줄 → <code>for(i=0; i&lt;5; i++) student[i] = 5;</code>" },
        { id: "zigzag", week: 10, tab: "⑧ ✍️ 지그재그", src: "10주차 ✍️ 수업 퀴즈 quiz01-01-array1.c — 3 × 3 을 → ← → 로 채우기",
          steps: [
            "0행 — j = 0 부터 <b>sw = 1 (→)</b> → a[0][0]=1 · a[0][1]=2 · a[0][2]=3 · j 가 3(밖)이 되면 while 끝",
            "<b>sw *= -1</b> → -1 (←) · <b>j += sw</b> → 3 에서 2 로 되돌림 → 1행 a[1][2]=4 · a[1][1]=5 · a[1][0]=6",
            "다시 sw = 1 (→) · j = 0 → 2행 a[2][0]=7 · a[2][1]=8 · a[2][2]=9",
            "출력 <code>%3d</code> → 1 2 3 / 6 5 4 / 7 8 9" ],
          note: "퀴즈 ② 5 × 5 뱀 모양도 같은 모양 — 홀수 행만 거꾸로 (<code>arr[i][4 - j] = k++</code>)" },
        { id: "ainit", week: 10, tab: "⑨ 초기화 규칙", src: "10주차 강의자료 9 ~ 12쪽 · ✍️ 수업 파일 array5.c",
          steps: [
            "다 채움 — <code>int a[5] = {1,2,3,4,5};</code>",
            "일부만 — <code>{100, 200, 300, }</code> → 쓰지 않은 칸은 <b>0</b>",
            "쉼표 초기화 — <code>short student[10] = { 0, };</code> → <b>모두 0</b> (11쪽 ex01_01-array7 → <b>10 0</b>)",
            "크기 생략 — <code>int c[] = {10,20,30};</code> → 값 개수만큼 <b>3칸</b> (12쪽)",
            "초기화 안 함 — <code>short student[10];</code> → 자동으로 초기화되지 않음 → <b>쓰레기값</b> (10쪽 VS 결과 <b>10 -13108</b>)" ],
          note: "⚠️ 필기 <code>{10.20.30.40.50};;</code> → 값 사이는 쉼표 · ; 하나 · 배열끼리 <code>y = x;</code> 는 오류 → 원소 하나씩 복사" }
    ];

    var tabsBox = document.getElementById("tabs"), cap = document.getElementById("cap"), src = document.getElementById("src"),
        note = document.getElementById("note"), pos = document.getElementById("pos"), box = document.getElementById("box");
    var S = { fig: 0, step: 0, timers: [] };   // step 0 = 전체

    function svgOf(i) { return document.querySelector('svg[data-fig="' + FIGS[i].id + '"]'); }
    function parts(svgEl) { return Array.prototype.slice.call(svgEl.querySelectorAll("[data-s]")); }
    function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; }

    function drawIn(root) {                       // 선이 그려지듯이 (stroke-dashoffset)
        var list = root.matches && root.matches(".d") ? [root] : [];
        list = list.concat(Array.prototype.slice.call(root.querySelectorAll(".d")));
        list.forEach(function (p) {
            if (!p.getTotalLength) return;
            var L; try { L = p.getTotalLength(); } catch (e) { return; }
            if (!L) return;
            p.style.transition = "none"; p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
            p.getBoundingClientRect();
            p.style.transition = "stroke-dashoffset 0.9s ease"; p.style.strokeDashoffset = 0;
            setTimeout(function () { p.style.strokeDasharray = ""; }, 1000);
        });
    }

    function renderCap() {
        var f = FIGS[S.fig];
        cap.innerHTML = "";
        f.steps.forEach(function (t, i) {
            var li = document.createElement("li"); li.innerHTML = t;
            if (S.step && i + 1 === S.step) li.className = "cur";
            else if (S.step && i + 1 > S.step) li.className = "later";
            li.addEventListener("click", function () { go(i + 1); });
            cap.appendChild(li);
        });
        pos.textContent = S.step ? S.step + " / " + f.steps.length + " 단계" : "전체 " + f.steps.length + " 단계";
    }

    function apply(animateNew) {                  // 지금 단계에 맞게 보이기 · 숨기기
        var svgEl = svgOf(S.fig);
        parts(svgEl).forEach(function (g) {
            var k = +g.getAttribute("data-s");
            var wasOff = g.classList.contains("off");
            var show = !S.step || k <= S.step;
            g.classList.toggle("off", !show);
            g.classList.toggle("hl", !!S.step && k === S.step);
            if (show && wasOff && animateNew) drawIn(g);
        });
        renderCap();
    }

    function drawAll() {                          // 전체를 단계 순서대로 그리면서 보여 주기
        clearTimers();
        var svgEl = svgOf(S.fig), n = FIGS[S.fig].steps.length;
        S.step = 0;
        parts(svgEl).forEach(function (g) { g.classList.add("off"); g.classList.remove("hl"); });
        drawIn(svgEl);
        renderCap();
        for (var k = 1; k <= n; k++) (function (k) {
            S.timers.push(setTimeout(function () {
                parts(svgEl).forEach(function (g) { if (+g.getAttribute("data-s") === k) { g.classList.remove("off"); drawIn(g); } });
            }, 350 + (k - 1) * 650));
        })(k);
    }

    function go(step) {
        clearTimers();
        var n = FIGS[S.fig].steps.length;
        S.step = Math.max(1, Math.min(n, step));
        apply(true);
    }

    function show(i, draw) {
        clearTimers();
        S.fig = i; S.step = 0;
        Array.prototype.forEach.call(document.querySelectorAll("svg[data-fig]"), function (s) {   // SVG 는 .hidden 속성이 없어서 attribute 로
            if (s.getAttribute("data-fig") === FIGS[i].id) s.removeAttribute("hidden"); else s.setAttribute("hidden", "");
        });
        Array.prototype.forEach.call(tabsBox.children, function (b, j) { b.setAttribute("aria-pressed", j === i ? "true" : "false"); });
        src.innerHTML = "📄 " + FIGS[i].src;
        note.innerHTML = FIGS[i].note || "";
        if (draw) drawAll(); else { parts(svgOf(i)).forEach(function (g) { g.classList.remove("off", "hl"); }); renderCap(); }
        tell();
    }

    // 주차로 골라 보기 — ?week=5 = 그 주차 그림만 · ?weeks=1-7 = 그 범위 (주차 페이지 · 중간고사 · 기말고사 · 완전정리가 같은 그림 파일을 나눠 씀 · README 🎨)
    (function () {
        var q = location.search, m1 = /[?&]week=(\d+)/.exec(q), m2 = /[?&]weeks=(\d+)-(\d+)/.exec(q);
        if (!m1 && !m2) return;
        var lo = m1 ? +m1[1] : +m2[1], hi = m1 ? +m1[1] : +m2[2];
        var keep = FIGS.filter(function (f) { return [].concat(f.week).some(function (w) { return w >= lo && w <= hi; }); });
        if (keep.length) FIGS = keep;
    })();

    // 그림 검사 — 콘솔에서 figCheck() → 글자끼리 겹침 · 600 폭 밖으로 넘침 목록 (없으면 [] · 폰 폭에서도 한 번 더)
    window.figCheck = function () {
        var out = [];
        Array.prototype.forEach.call(document.querySelectorAll("svg[data-fig]"), function (sv) {
            var wasHidden = sv.hasAttribute("hidden"); sv.removeAttribute("hidden");
            var vb = sv.viewBox.baseVal, ts = Array.prototype.map.call(sv.querySelectorAll("text"), function (t) { return { t: t, b: t.getBBox() }; });
            ts.forEach(function (o) { if (o.b.x < -1 || o.b.x + o.b.width > vb.width + 1) out.push(sv.getAttribute("data-fig") + " 넘침: " + o.t.textContent.slice(0, 24)); });
            for (var i = 0; i < ts.length; i++) for (var j = i + 1; j < ts.length; j++) {
                var a = ts[i].b, c = ts[j].b, ox = Math.min(a.x + a.width, c.x + c.width) - Math.max(a.x, c.x), oy = Math.min(a.y + a.height, c.y + c.height) - Math.max(a.y, c.y);
                if (ox > 2 && oy > 3) out.push(sv.getAttribute("data-fig") + " 겹침: " + ts[i].t.textContent.slice(0, 16) + " × " + ts[j].t.textContent.slice(0, 16));
            }
            if (wasHidden) sv.setAttribute("hidden", "");
        });
        return out;
    };

    FIGS.forEach(function (f, i) {
        var b = document.createElement("button"); b.type = "button"; b.textContent = f.tab;
        b.addEventListener("click", function () { show(i, true); try { history.replaceState(null, "", "#" + f.id); } catch (e) {} });
        tabsBox.appendChild(b);
    });
    document.getElementById("redraw").addEventListener("click", function () { drawAll(); });
    document.getElementById("all").addEventListener("click", function () { clearTimers(); S.step = 0; apply(false); });
    document.getElementById("prev").addEventListener("click", function () { go(S.step ? S.step - 1 : 1); });
    document.getElementById("next").addEventListener("click", function () { go(S.step ? S.step + 1 : 1); });
    document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") go(S.step + 1); else if (e.key === "ArrowLeft") go(S.step ? S.step - 1 : 1); });

    // 주차 페이지 iframe 높이 맞추기 (build_weeks.py 의 🎬 와 같은 약속)
    function tell() { try { if (parent !== window) parent.postMessage({ wkAnimH: Math.ceil(box.getBoundingClientRect().height) + 4 }, "*"); } catch (e) {} }
    if (window.ResizeObserver) new ResizeObserver(tell).observe(box);
    window.addEventListener("load", tell);

    var start = 0, h = (location.hash || "").slice(1);
    FIGS.forEach(function (f, i) { if (f.id === h) start = i; });
    show(start, false);
    // 처음 화면에 보일 때 한 번 그리면서 보여 주기
    if (window.IntersectionObserver) {
        var done = false;
        new IntersectionObserver(function (es) { if (!done && es[0].isIntersecting) { done = true; drawAll(); } }, { threshold: 0.3 }).observe(document.querySelector(".stage"));
    }
})();
</script>
